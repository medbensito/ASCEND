<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ASCEND</title>
<meta name="description" content="ASCEND : ton développement personnel et ton JOMO, jour après jour. Make everyday matter.">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASCEND">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<style>
/* ===== ASCEND : couleurs, typo, fond ===== */
:root {
  --fond: #070709;
  --fond-2: #0c0c0e;
  --carte: #111113;
  --carte-2: #171719;
  --carte-3: #1e1e20;
  --trait: rgba(255, 255, 255, .08);
  --trait-fort: rgba(255, 255, 255, .17);
  --texte: #f4eee6;
  --doux: #efe9e0;
  --pale: #868688;
  --bleu: #e6e0d5;
  --violet: #e6e0d5;
  --accent: linear-gradient(135deg, #e6e0d5 0%, #e5dfd4 100%);
  --accent-texte: #eee8de;
  --anneau: #e5dfd3;
  --vert: #3ee08f;
  --orange: #ffb547;
  --rouge: #ff5d73;
  --jomo: #2fd3c5;
  --ecran: #57c3ff;
  --focus: #f1ebe2;
  --H: 60px;
  --rayon: 18px;
  --haut-sur: env(safe-area-inset-top, 0px);
  --bas-sur: env(safe-area-inset-bottom, 0px);
  --police: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
/* Une app, pas une page : on ne pince pas pour zoomer, le double toucher ne zoome pas */
html { touch-action: pan-x pan-y; }
body {
  font-family: var(--police);
  color: var(--texte);
  background-color: var(--fond);
  background-image:
    radial-gradient(120% 60% at 110% -10%, rgba(255, 255, 255, .14), transparent 60%),
    radial-gradient(90% 55% at -20% 105%, rgba(255, 255, 255, .11), transparent 60%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  font-size: 15px;
  line-height: 1.35;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
.masque { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
h1, h2, h3, p { margin: 0; }

/* ===== Structure : écran + onglets du bas ===== */
/* L'app occupe la partie visible de l'écran (l'iPhone la décale parfois après le clavier : on la suit) */
.app { position: fixed; top: var(--app-haut, 0px); bottom: var(--app-bas, 0px); left: 0; right: 0; max-width: 640px; margin: 0 auto;
  display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; }
html.clavier { --bas-sur: 0px; }
.ecran { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; outline: none;
  padding: calc(var(--haut-sur) + 18px) max(18px, env(safe-area-inset-right)) 28px max(18px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.ecran > * { flex-shrink: 0; }
.ecran.plein { overflow: hidden; padding-bottom: 0; }
.ecran.plein > .cal-jour { flex-shrink: 1; }
.onglets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 10px calc(var(--bas-sur) + 8px);
  background: rgba(8, 8, 10, .92); border-top: 1px solid var(--trait); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.onglet { display: grid; justify-items: center; gap: 3px; padding: 7px 2px 6px; border: 0; background: none; color: var(--pale); border-radius: 14px;
  font-size: 11px; font-weight: 600; letter-spacing: .01em; min-height: 52px; }
.onglet svg { width: 24px; height: 24px; }
.onglet[aria-current="page"] { color: #eae4da; background: rgba(255, 255, 255, .07); }
.onglet[aria-current="page"] svg { filter: drop-shadow(0 0 8px rgba(255, 255, 255, .35)); }

/* ===== Textes d'en-tête ===== */
.tete { display: flex; align-items: flex-start; gap: 12px; }
.tete > div { flex: 1; min-width: 0; }
.tete h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.12; }
.tete p { color: var(--doux); font-size: 15px; margin-top: 4px; }
.tete .actions-tete { display: flex; gap: 8px; flex: none; }
.icone-bouton { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--trait); background: rgba(23, 23, 25, .6); color: var(--texte);
  display: grid; place-items: center; padding: 0; flex: none; }
.icone-bouton svg { width: 22px; height: 22px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--trait-fort); background: radial-gradient(circle at 30% 25%, #2c2c2e, #171719);
  color: var(--texte); font-weight: 700; font-size: 14px; letter-spacing: .02em; display: grid; place-items: center; flex: none; }
.section-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.section-tete h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.lien { border: 0; background: none; color: var(--doux); font-size: 13px; font-weight: 600; padding: 8px 4px; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; white-space: nowrap; flex: none; }
.lien svg { width: 14px; height: 14px; }
.lien.fort { color: var(--accent-texte); }
.lien.danger { color: var(--rouge); }

/* ===== Cartes ===== */
.carte { background: linear-gradient(180deg, rgba(28, 28, 30, .82), rgba(16, 16, 18, .9)); border: 1px solid var(--trait); border-radius: var(--rayon);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 10px 30px rgba(0, 0, 0, .25); }
.carte.pad { padding: 16px; }
.vide { color: var(--doux); text-align: center; padding: 22px 16px; font-size: 14px; line-height: 1.5; }

/* ===== Boutons ===== */
.bouton { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border: 0; border-radius: 16px;
  background: var(--accent); color: var(--sur-accent); font-weight: 700; font-size: 16px; box-shadow: 0 10px 26px rgba(255, 255, 255, .175), inset 0 1px 0 rgba(255, 255, 255, .18); width: 100%; }
.bouton svg { width: 20px; height: 20px; }
.bouton:disabled { opacity: .45; box-shadow: none; }
.bouton.secondaire { background: rgba(35, 35, 37, .7); border: 1px solid var(--trait-fort); box-shadow: none; color: var(--texte); }
.bouton.danger { background: rgba(255, 93, 115, .12); border: 1px solid rgba(255, 93, 115, .45); color: #ff8a9a; box-shadow: none; }
.bouton.petit { min-height: 44px; font-size: 15px; border-radius: 14px; }
.boutons { display: grid; gap: 10px; }
.boutons.deux { grid-template-columns: 1fr 1fr; }

/* ===== Segments (7j / 30j / 90j, Mois / Jour…) ===== */
.segments { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: rgba(17, 17, 19, .9); border: 1px solid var(--trait); }
.segments button { border: 0; background: none; color: var(--doux); font-weight: 600; font-size: 14px; border-radius: 12px; min-height: 40px; padding: 0 8px; }
.segments button[aria-pressed="true"], .segments button[aria-selected="true"] { background: var(--accent); color: var(--sur-accent); box-shadow: 0 6px 18px rgba(255, 255, 255, .175); }

/* ===== Interrupteur ===== */
.interrupteur { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
.interrupteur input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.interrupteur i { position: absolute; inset: 0; border-radius: 16px; background: #29292b; border: 1px solid var(--trait-fort); transition: background .2s; }
.interrupteur i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px; border-radius: 50%; background: #f4eee6; transition: transform .2s, background .2s; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.interrupteur input:checked + i { background: var(--accent); border-color: transparent; }
.interrupteur input:checked + i::after { transform: translateX(20px); background: #fff; }
.interrupteur input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ===== Cases à cocher rondes ===== */
.rond-coche { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--anneau); background: rgba(12, 12, 14, .6); padding: 0; display: grid; place-items: center; color: transparent; flex: none; }
.rond-coche svg { width: 16px; height: 16px; }
.rond-coche[aria-checked="true"] { background: var(--accent); border-color: #eee8de; color: var(--sur-accent); box-shadow: 0 0 14px rgba(255, 255, 255, .3); }
.rond-coche:disabled { opacity: .5; }
/* Cible tactile élargie */
.rond-coche { position: relative; }
.rond-coche::before { content: ""; position: absolute; inset: -8px; }

/* ===== Lignes (tâches, habitudes) ===== */
.lignes { display: grid; gap: 10px; }
.ligne { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; }
.ligne .ouvrir { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; text-align: left; color: inherit; min-height: 40px; }
.ligne .quoi { flex: 1; min-width: 0; display: grid; gap: 2px; }
.ligne .quoi b { font-weight: 650; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ligne .quoi small { color: var(--doux); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ligne .pts { color: var(--accent-texte); font-weight: 700; font-size: 14px; white-space: nowrap; flex: none; }
.ligne .pts.gagne { color: var(--vert); }
.ligne .pts.nul { color: var(--pale); font-weight: 600; }
.ligne.faite .quoi b { color: var(--doux); text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, .3); }
.tuile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 21px; flex: none; background: color-mix(in srgb, var(--c, #e5dfd3) 18%, #0f0f11); border: 1px solid color-mix(in srgb, var(--c, #e5dfd3) 40%, transparent); }
.tuile.petite { width: 32px; height: 32px; border-radius: 10px; font-size: 17px; }
.puce-cat { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }

/* ===== Toast ===== */
.toast { position: fixed; left: 50%; top: calc(var(--haut-sur) + 12px); transform: translate(-50%, calc(-100% - 40px)); z-index: 50; max-width: min(92vw, 520px);
  background: rgba(26, 26, 28, .96); border: 1px solid var(--trait-fort); color: var(--texte); padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 14px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, .45); transition: transform .3s ease, opacity .3s ease, visibility .3s; pointer-events: none; text-align: center; opacity: 0; visibility: hidden; }
.toast:empty { display: none; }
.toast.visible { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

/* ===== Lancement ===== */
.lancement { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--fond);
  background-image: radial-gradient(80% 50% at 100% 0%, rgba(255, 255, 255, .175), transparent 60%), radial-gradient(80% 50% at 0% 100%, rgba(255, 255, 255, .15), transparent 60%);
  transition: opacity .45s ease, visibility .45s; }
.lancement.parti { opacity: 0; visibility: hidden; }
.marque { display: grid; justify-items: center; gap: 18px; text-align: center; }
.marque svg { width: 108px; height: 108px; filter: drop-shadow(0 0 24px rgba(255, 255, 255, .275)); }
.marque b { font-size: 34px; font-weight: 300; letter-spacing: .42em; margin-right: -.42em; }
.marque small { color: var(--doux); font-size: 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* ===== Accueil ===== */
.salut h1 { font-size: 27px; }
.points { position: relative; overflow: hidden; padding: 18px 18px 58px; min-height: 150px;
  background: radial-gradient(120% 120% at 100% 0%, rgba(255, 255, 255, .175), transparent 55%), linear-gradient(180deg, rgba(30, 30, 32, .9), rgba(16, 16, 18, .95)); }
.points .libelle { display: flex; align-items: center; gap: 8px; color: var(--doux); font-weight: 600; font-size: 14px; }
.points .libelle .etoile { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 181, 71, .14); border: 1px solid rgba(255, 181, 71, .45); }
.points .libelle .etoile svg { width: 15px; height: 15px; color: var(--orange); }
.points .total { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; position: relative; z-index: 1; }
.points .total b { font-size: 40px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.points .total span { color: var(--vert); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 3px; }
.points .total span.zero { color: var(--pale); }
.points .total span svg { width: 13px; height: 13px; }
.points .palier { position: relative; z-index: 1; margin-top: 6px; color: var(--doux); font-size: 13px; }
.points .palier b { color: var(--texte); font-weight: 650; }
.points .embleme { position: absolute; right: 10px; top: 6px; width: 92px; height: 92px; z-index: 1; }
.points .courbe { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 56px; opacity: .95; }
.points .monte { animation: monte .6s ease; }
@keyframes monte { 0% { transform: translateY(6px); opacity: .3; } 100% { transform: none; opacity: 1; } }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { padding: 14px; display: grid; gap: 6px; text-align: left; border: 1px solid var(--trait); color: inherit; min-height: 96px; }
.mini .titre-mini { color: var(--doux); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.mini b { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mini small { color: var(--doux); font-size: 12.5px; }
.alerte { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-color: rgba(255, 181, 71, .45); background: linear-gradient(180deg, rgba(60, 44, 20, .55), rgba(30, 22, 12, .55)); }
.alerte .ic { font-size: 20px; line-height: 1; }
.alerte p { font-size: 14px; color: #ffe2b0; }
.alerte p b { color: #fff; }
.a-valider { display: grid; gap: 10px; padding: 14px; }
.a-valider p { font-size: 14.5px; }
.a-valider p small { display: block; color: var(--doux); font-size: 12.5px; margin-top: 2px; }

/* ===== Calendrier : mois ===== */
.cal-tete { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 12px; }
.cal-tete h2 { font-size: 18px; font-weight: 650; }
.cal-tete .icone-bouton { width: 40px; height: 40px; border: 0; background: none; }
.mois-grille { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; padding: 0 6px 12px; touch-action: pan-y; }
.mois-grille .jsem { text-align: center; color: var(--doux); font-size: 13px; font-weight: 600; padding: 4px 0 8px; }
.jour-m { position: relative; border: 0; background: none; color: var(--texte); height: 46px; display: grid; justify-items: center; align-content: start; gap: 3px; padding: 0; border-radius: 12px; }
.jour-m .n { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-variant-numeric: tabular-nums; }
.jour-m.dehors { color: #656567; }
.jour-m.auj .n { color: #efe9df; font-weight: 800; }
.jour-m[aria-pressed="true"] .n { background: var(--accent); color: var(--sur-accent); font-weight: 700; box-shadow: 0 0 0 3px rgba(255, 255, 255, .125), 0 0 18px rgba(255, 255, 255, .375); }
.jour-m .pts-j { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; }
.jour-m .pts-j i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.jour-m.charge .n::after { content: ""; position: absolute; top: 2px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
.jour-liste-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 2px 2px 10px; }
.jour-liste-tete h2 { font-size: 16px; font-weight: 650; }
.jour-liste-tete small { color: var(--doux); font-size: 13px; }
.ligne.cal { min-height: 58px; padding: 10px 14px; }

/* ===== Calendrier : jour (grille) ===== */
.cal-barre { display: flex; gap: 10px; align-items: center; }
.cal-barre .segments { flex: 1; }
.bande { display: grid; grid-template-columns: 30px repeat(7, minmax(0, 1fr)) 30px; align-items: center; gap: 2px; }
.bande .fleche { border: 0; background: none; color: var(--doux); height: 52px; padding: 0; display: grid; place-items: center; }
.bande .fleche svg { width: 18px; height: 18px; }
.jour-b { border: 0; background: none; color: var(--texte); display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 14px; min-height: 56px; }
.jour-b span { font-size: 11px; color: var(--doux); font-weight: 600; }
.jour-b b { font-size: 16px; font-weight: 600; width: 32px; height: 32px; max-width: 100%; border-radius: 50%; display: grid; place-items: center; }
@media (max-width: 359px) { .jour-b b { width: 28px; height: 28px; font-size: 15px; } }
.jour-b.auj b { color: #efe9df; }
.jour-b[aria-pressed="true"] b { background: var(--accent); color: var(--sur-accent); box-shadow: 0 0 14px rgba(255, 255, 255, .35); }
.jour-b i { width: 4px; height: 4px; border-radius: 50%; }
.jour-b i.plein { background: var(--doux); }
.jour-entete { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.jour-entete h2 { font-size: 17px; font-weight: 650; }
.jauge { display: grid; gap: 5px; min-width: 120px; text-align: right; }
.jauge small { color: var(--doux); font-size: 12px; }
.jauge small b { color: var(--texte); }
.jauge .barre { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .09); overflow: hidden; }
.jauge .barre i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.jauge.depasse small b { color: var(--orange); }
.jauge.depasse .barre i { background: linear-gradient(90deg, #ffb547, #ff7a59); }
.defile { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; margin: 0 -18px; padding: 0 18px; touch-action: pan-y; }
.grille { position: relative; height: calc(var(--H) * 24); margin-left: 46px; }
.grille .heure { position: absolute; left: -46px; width: 40px; text-align: right; transform: translateY(-50%); color: var(--pale); font-size: 11px; font-variant-numeric: tabular-nums; }
.grille .trait-h { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255, 255, 255, .05); }
.colonnes { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n, 1), 1fr); }
.colonne { position: relative; border: 0; background: none; padding: 0; }
.bloc { position: absolute; border-radius: 12px; overflow: hidden; background: color-mix(in srgb, var(--c) 22%, #111113); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
  border-left: 4px solid var(--c); color: var(--texte); touch-action: none; user-select: none; -webkit-user-select: none; }
.bloc .b-ouvrir { position: absolute; inset: 0; border: 0; background: none; padding: 0; width: 100%; }
.bloc .b-texte { position: relative; pointer-events: none; display: grid; gap: 1px; padding: 6px 8px 0 9px; padding-right: 44px; }
.bloc .b-texte b { font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bloc .b-texte small { font-size: 11.5px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bloc.court .b-texte { grid-auto-flow: column; justify-content: start; gap: 6px; padding-top: 2px; }
.bloc .rond-coche { position: absolute; right: 8px; top: 6px; width: 26px; height: 26px; }
.bloc.court .rond-coche { top: 50%; margin-top: -11px; width: 22px; height: 22px; }
.bloc.fait .b-texte b { text-decoration: line-through; color: var(--doux); }
.bloc.libre { background: repeating-linear-gradient(135deg, rgba(47, 211, 197, .14) 0 8px, rgba(47, 211, 197, .06) 8px 16px); }
.bloc.sansecran { background: repeating-linear-gradient(135deg, rgba(87, 195, 255, .14) 0 8px, rgba(87, 195, 255, .05) 8px 16px); }
.bloc.grignote { border-style: dashed; }
.bloc .gain { position: absolute; right: 8px; bottom: 5px; font-size: 11px; font-weight: 700; color: var(--vert); pointer-events: none; }
.bloc .bord { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; cursor: ns-resize; }
.bloc .poignee { position: absolute; left: 50%; width: 30px; height: 18px; margin-left: -15px; display: grid; place-items: center; }
.bloc .poignee::after { content: ""; width: 26px; height: 6px; border-radius: 3px; background: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, .45); }
.bloc .poignee.haut { top: -2px; }
.bloc .poignee.bas { bottom: -2px; }
.bloc.choisi { box-shadow: 0 0 0 2px #eee8de, 0 0 20px rgba(255, 255, 255, .25); z-index: 3; overflow: visible; }
.bloc.leve { z-index: 5; box-shadow: 0 12px 30px rgba(0, 0, 0, .5), 0 0 0 2px #eee8de; opacity: .95; }
.bloc.brouillon { --c: #eee8de; background: rgba(255, 255, 255, .125); border-style: dashed; z-index: 4; overflow: visible; }
.bloc.repere { animation: repere 1.8s ease-out 1; }
@keyframes repere { 0%, 55% { box-shadow: 0 0 0 3px #fff, 0 0 26px rgba(255, 255, 255, .475); } }
.maintenant { position: absolute; left: -8px; right: 0; height: 2px; background: #ff5d73; z-index: 6; pointer-events: none; }
.maintenant::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ff5d73; }
.maintenant span { position: absolute; left: -50px; top: -8px; font-size: 11px; font-weight: 700; color: #ff8a9a; background: var(--fond); padding: 0 2px; }
.bas-espace { height: 96px; }
.fab { position: absolute; right: 18px; bottom: 18px; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--sur-accent); display: grid; place-items: center;
  box-shadow: 0 12px 30px rgba(255, 255, 255, .25); z-index: 8; }
.fab svg { width: 26px; height: 26px; }
.cal-jour { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

/* ===== Objectifs ===== */
.serie-carte { display: flex; align-items: center; gap: 14px; padding: 16px; }
.serie-carte .flamme { font-size: 32px; line-height: 1; filter: drop-shadow(0 0 10px rgba(255, 150, 60, .55)); }
.serie-carte b { font-size: 28px; font-weight: 700; }
.serie-carte small { color: var(--doux); font-size: 13px; display: block; }
.histo { display: flex; gap: 4px; margin-top: 4px; }
.histo i { width: 9px; height: 9px; border-radius: 3px; background: rgba(255, 255, 255, .08); }
.histo i.ok { background: var(--c, var(--bleu)); box-shadow: 0 0 6px color-mix(in srgb, var(--c, #e6e0d5) 70%, transparent); }
.histo i.non { background: transparent; border: 1px dashed rgba(255, 255, 255, .125); }
.obj-carte { padding: 16px; display: grid; gap: 12px; text-align: left; color: inherit; border: 1px solid var(--trait); width: 100%; }
.obj-carte .haut { display: flex; align-items: center; gap: 12px; }
.obj-carte .haut div { flex: 1; min-width: 0; display: grid; gap: 2px; }
.obj-carte .haut b { font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.obj-carte .haut small { color: var(--doux); font-size: 12.5px; }
.obj-carte .pc { font-size: 18px; font-weight: 700; color: var(--accent-texte); }
.obj-carte.atteint .pc { color: var(--vert); }
.barre-obj { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.barre-obj i { display: block; height: 100%; border-radius: 4px; background: var(--accent); box-shadow: 0 0 10px rgba(255, 255, 255, .3); }
.obj-carte.atteint .barre-obj i { background: linear-gradient(90deg, #2fd38f, #3ee08f); }

/* ===== Progression ===== */
.anneau-carte { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 18px; }
.anneau { position: relative; width: 150px; height: 150px; }
.anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.anneau .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.anneau .val b { font-size: 36px; font-weight: 700; letter-spacing: -.02em; }
.anneau .val b small { font-size: 18px; font-weight: 600; }
.anneau .val span { color: var(--doux); font-size: 11px; line-height: 1.2; max-width: 92px; margin: 2px auto 0; }
.chiffres { display: grid; gap: 18px; }
.chiffres .evol { display: grid; gap: 2px; }
.chiffres .evol b { font-size: 22px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.chiffres .evol b.hausse { color: var(--vert); }
.chiffres .evol b.baisse { color: #ff8a9a; }
.chiffres .evol b.egal { color: var(--doux); }
.chiffres .evol b svg { width: 16px; height: 16px; }
.chiffres small { color: var(--doux); font-size: 13px; }
.repart { display: grid; gap: 12px; }
.repart .r-ligne { display: grid; grid-template-columns: 24px minmax(70px, 1fr) 2fr 44px; align-items: center; gap: 10px; font-size: 14px; }
.repart .r-ligne .ic { font-size: 16px; text-align: center; }
.repart .r-ligne .barre { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .06); overflow: hidden; }
.repart .r-ligne .barre i { display: block; height: 100%; border-radius: 4px; background: var(--c); }
.repart .r-ligne b { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.encourage { display: flex; align-items: center; gap: 14px; padding: 18px; }
.encourage svg { width: 44px; height: 44px; flex: none; }
.encourage p { font-size: 15px; line-height: 1.45; }
.trois { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.trois .mini { min-height: 0; }
.trois .mini b { font-size: 20px; }
.courbe-pts { width: 100%; height: 120px; display: block; }
.legende-courbe { display: flex; justify-content: space-between; color: var(--pale); font-size: 11.5px; margin-top: 4px; }
/* ===== Feuilles (formulaires en bas d'écran) ===== */
dialog { color: var(--texte); }
/* Calée sur la partie visible de l'écran : au-dessus du clavier quand il est sorti */
dialog.feuille { top: var(--vv-haut, 0px); bottom: var(--vv-bas, 0px); width: 100%; max-width: 560px;
  max-height: 92vh; max-height: min(92dvh, calc(var(--vv-h, 100dvh) - 12px)); margin: auto auto 0; padding: 0; border: 1px solid var(--trait-fort); border-bottom: 0;
  border-radius: 26px 26px 0 0; background: linear-gradient(180deg, #141416, #0d0d0f 40%); box-shadow: 0 -20px 60px rgba(0, 0, 0, .55); }
dialog.feuille[open] { display: flex; flex-direction: column; animation: monter .26s ease; }
dialog.feuille.haute { height: 92vh; height: min(92dvh, calc(var(--vv-h, 100dvh) - 12px)); }
dialog.feuille::before { content: ""; display: block; flex: none; width: 40px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .175); margin: 8px auto 0; }
dialog::backdrop { background: rgba(4, 4, 6, .62); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
@keyframes monter { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (min-width: 640px) { dialog.feuille { margin: auto; border-radius: 26px; border-bottom: 1px solid var(--trait-fort); } }
/* Les formulaires ne forment pas de boîte : en-tête, corps et pied sont posés directement dans la feuille,
   comme le Profil (un formulaire en flex imbriqué s'affichait mal sur iPhone) */
#form-tache, #form-cat, #form-hab, #form-obj { display: contents; }
/* Sur téléphone, créer ou modifier une tâche, un objectif, une habitude ou une catégorie, la liste des catégories
   et le choix d'une catégorie ouvrent une page entière :
   toute la fenêtre se voit, de l'en-tête (sous l'heure et l'encoche) au bouton du bas (au-dessus du clavier s'il est sorti) */
@media (max-width: 639px), (orientation: landscape) and (max-height: 520px) {
  html dialog.feuille.page { top: var(--vv-haut, 0px); bottom: var(--vv-bas, 0px); left: 0; right: 0; width: 100%; max-width: none; height: auto; max-height: none;
    margin: 0; border: 0; border-radius: 0; box-shadow: none; background: radial-gradient(120% 50% at 110% -10%, rgba(255, 255, 255, .11), transparent 60%), linear-gradient(180deg, #111113, #09090b 45%); }
  html dialog.feuille.page::before { display: none; }
  html dialog.feuille.page[open] { animation: page-monte .28s cubic-bezier(.2, .8, .2, 1); }
  html dialog.feuille.page .f-haut { padding-top: calc(var(--haut-sur) + 8px); border-bottom: 1px solid var(--trait); }
  html dialog.feuille.page .f-corps { padding-top: 14px; }
  html dialog.feuille.page::backdrop { background: #070709; -webkit-backdrop-filter: none; backdrop-filter: none; }
}
/* Téléphone couché : le ✓ de l'en-tête suffit, le grand bouton du bas laisse la place au contenu */
@media (orientation: landscape) and (max-height: 520px) {
  html dialog.feuille.page .f-pied { display: none; }
  html dialog.feuille.page .f-haut { padding-top: 4px; padding-bottom: 4px; }
}
@keyframes page-monte { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.f-haut { flex: none; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; padding: 6px 10px 8px; }
.f-haut h2 { text-align: center; font-size: 18px; font-weight: 700; }
.f-icone { width: 44px; height: 44px; border: 0; background: none; color: var(--texte); display: grid; place-items: center; padding: 0; border-radius: 50%; }
.f-icone svg { width: 22px; height: 22px; }
.f-valider { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--sur-accent); display: grid; place-items: center; justify-self: end; padding: 0; box-shadow: 0 0 16px rgba(255, 255, 255, .3); }
.f-valider svg { width: 20px; height: 20px; }
.f-ok { border: 0; background: none; color: var(--accent-texte); font-weight: 700; font-size: 16px; padding: 10px 6px; justify-self: end; min-height: 44px; }
.f-msg { flex: none; margin: 0 18px; color: #f4eee6; font-size: 13.5px; font-weight: 600; min-height: 0; }
.f-msg:empty { display: none; }
.f-msg:not(:empty) { padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .07); border: 1px solid var(--trait-fort); margin-bottom: 8px; }
.f-corps { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 6px 18px calc(var(--bas-sur) + 22px); display: grid; gap: 16px; align-content: start; grid-auto-rows: max-content; grid-template-columns: minmax(0, 1fr); }
.f-pied { flex: none; padding: 10px 18px calc(var(--bas-sur) + 14px); border-top: 1px solid var(--trait); background: rgba(10, 10, 12, .6); }
.champ-nom { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 0 16px; border-radius: 16px; background: rgba(23, 23, 25, .7); border: 1px solid var(--trait-fort); }
.champ-nom svg { width: 20px; height: 20px; color: var(--doux); flex: none; }
.champ-nom input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; padding: 14px 0; }
.champ-nom input::placeholder { color: var(--pale); opacity: 1; }
.champ-nom:focus-within { border-color: #eee8de; box-shadow: 0 0 0 3px rgba(255, 255, 255, .125); }
.etiquette { font-size: 15px; font-weight: 600; color: var(--texte); margin: 0 0 8px 2px; display: block; }
.groupe { border-radius: 16px; background: rgba(23, 23, 25, .55); border: 1px solid var(--trait); overflow: hidden; }
.rang { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 14px; border: 0; border-bottom: 1px solid var(--trait); background: none; width: 100%; text-align: left; color: inherit; }
.groupe > .rang:last-child, .groupe > :last-child .rang, .groupe > :last-child > .rang { border-bottom: 0; }
.rang > span:first-child { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.rang .sous { display: block; color: var(--doux); font-size: 12.5px; }
.rang .val { color: var(--accent-texte); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.rang .val svg { width: 16px; height: 16px; color: var(--doux); }
.rang .ic { width: 28px; height: 28px; display: grid; place-items: center; color: var(--doux); flex: none; font-size: 18px; }
.rang .ic svg { width: 22px; height: 22px; }
.rang input[type="date"], .rang input[type="time"], .rang select, .rang input[type="number"] { border: 1px solid var(--trait-fort); background: rgba(12, 12, 14, .8); border-radius: 10px; padding: 8px 10px;
  color: var(--texte); font-size: 16px; min-height: 40px; color-scheme: dark; max-width: 58%; }
.rang input[type="number"] { width: 84px; text-align: center; }
.rang select { -webkit-appearance: none; appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, #efe9e0 50%), linear-gradient(135deg, #efe9e0 50%, transparent 50%);
  background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.horaires { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 14px 12px; }
.horaires label { display: grid; gap: 4px; font-size: 12.5px; color: var(--doux); font-weight: 600; }
.horaires input { width: 100%; max-width: none; border: 1px solid var(--trait-fort); background: rgba(12, 12, 14, .8); border-radius: 10px; padding: 9px 10px; color: var(--texte); font-size: 16px; min-height: 44px; color-scheme: dark; }
.pas-points { display: flex; align-items: center; gap: 6px; }
.note { color: var(--doux); font-size: 13px; line-height: 1.45; }
.erreur { color: #ff8a9a; font-size: 14px; font-weight: 600; }
.erreur:empty { display: none; }
.types { display: grid; grid-template-columns: repeat(3, 1fr); }
.types label { position: relative; display: grid; place-items: center; min-height: 40px; border-radius: 12px; color: var(--doux); font-weight: 600; font-size: 13.5px; cursor: pointer; text-align: center; padding: 0 4px; }
.types input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.types label:has(input:checked) { background: var(--accent); color: var(--sur-accent); box-shadow: 0 6px 18px rgba(255, 255, 255, .175); }
.types label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.choix-jours { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.choix-jours label { position: relative; display: grid; place-items: center; height: 42px; border-radius: 50%; border: 1px solid var(--trait-fort); color: var(--doux); font-weight: 700; cursor: pointer; }
.choix-jours input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.choix-jours label:has(input:checked) { background: var(--accent); color: var(--sur-accent); border-color: transparent; }
.choix-jours label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.icones-choix { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.icones-choix label, .couleurs-choix label { position: relative; display: grid; place-items: center; height: 46px; border-radius: 12px; border: 1px solid var(--trait); font-size: 22px; cursor: pointer; background: rgba(23, 23, 25, .55); }
.icones-choix input, .couleurs-choix input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.icones-choix label:has(input:checked) { border-color: #eee8de; box-shadow: 0 0 0 2px #eee8de inset; background: rgba(255, 255, 255, .11); }
.couleurs-choix { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.couleurs-choix label { border-radius: 50%; height: auto; aspect-ratio: 1; background: var(--c); border: 2px solid transparent; }
.couleurs-choix label:has(input:checked) { box-shadow: 0 0 0 3px var(--fond), 0 0 0 5px #fff; }
.icones-choix label:has(input:focus-visible), .couleurs-choix label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.cat-rang .tuile { width: 36px; height: 36px; font-size: 19px; border-radius: 11px; }
.cat-rang[aria-checked="true"] { background: rgba(255, 255, 255, .08); }
.cat-rang[aria-checked="true"] .val { color: #fff; }
.etapes { display: grid; gap: 0; }
.etape { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--trait); }
.etape:last-child { border-bottom: 0; }
.etape span { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
.etape.faite span { color: var(--doux); text-decoration: line-through; }
.etape .rond-coche { width: 26px; height: 26px; }
.etape .retirer { width: 40px; height: 40px; border: 0; background: none; color: var(--pale); display: grid; place-items: center; padding: 0; flex: none; }
.etape .retirer svg { width: 18px; height: 18px; }
.ajout-etape { display: flex; gap: 8px; padding: 10px; }
.ajout-etape input { flex: 1; min-width: 0; border: 1px solid var(--trait-fort); background: rgba(12, 12, 14, .8); border-radius: 12px; padding: 0 12px; min-height: 44px; font-size: 16px; }
.ajout-etape button { flex: none; width: auto; padding: 0 16px; min-height: 44px; }
.anneau.petit { width: 96px; height: 96px; }
.anneau.petit .val b { font-size: 24px; }
.obj-resume { display: flex; align-items: center; gap: 16px; }
.obj-resume p { font-size: 14px; color: var(--doux); line-height: 1.5; }
.obj-resume p b { color: var(--texte); }

/* ===== Catégories (gestion) ===== */
.cat-liste .rang { min-height: 66px; }
.cat-liste .rang .ouvrir-cat { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; color: inherit; text-align: left; padding: 0; min-height: 48px; }
.cat-liste .rang .ouvrir-cat .quoi-cat { display: grid; gap: 2px; min-width: 0; }
.cat-liste .rang .ouvrir-cat b { font-weight: 650; }
.cat-liste .rang .ouvrir-cat small { color: var(--doux); font-size: 12.5px; }
.cat-liste .rang.inactive .tuile { filter: grayscale(.8); opacity: .6; }

/* ===== Questions ===== */
dialog.feuille.petite { max-height: 80vh; max-height: min(80dvh, calc(var(--vv-h, 100dvh) - 12px)); }
.q-corps { padding: 18px 18px calc(var(--bas-sur) + 18px); display: grid; gap: 12px; }
.q-corps h2 { font-size: 19px; font-weight: 700; text-align: center; }
.q-corps p { color: var(--doux); text-align: center; font-size: 15px; line-height: 1.45; }
.q-choix { display: grid; gap: 10px; margin-top: 6px; }

/* ===== Minuteur ===== */
dialog.minuteur { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--fond);
  background-image: radial-gradient(80% 50% at 50% 30%, rgba(255, 255, 255, .14), transparent 65%); }
dialog.minuteur[open] { display: grid; }
.m-corps { display: grid; grid-template-rows: auto 1fr auto; gap: 18px; padding: calc(var(--haut-sur) + 16px) 22px calc(var(--bas-sur) + 22px); max-width: 520px; width: 100%; margin: 0 auto; min-height: 100%; }
.m-haut { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; text-align: center; }
.m-haut h2 { font-size: 17px; font-weight: 700; }
.m-centre { display: grid; justify-items: center; align-content: center; gap: 18px; text-align: center; }
.m-anneau { position: relative; width: min(74vw, 300px); aspect-ratio: 1; }
.m-anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.m-anneau .temps { position: absolute; inset: 0; display: grid; place-content: center; gap: 4px; }
.m-anneau .temps b { font-size: clamp(48px, 15vw, 66px); font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.m-anneau .temps span { color: var(--doux); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }
.m-tache { display: grid; gap: 4px; }
.m-tache b { font-size: 19px; font-weight: 650; }
.m-tache small { color: var(--doux); font-size: 14px; }
.m-cycles { display: flex; gap: 8px; justify-content: center; }
.m-cycles i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, .1); }
.m-cycles i.fait { background: var(--accent); box-shadow: 0 0 8px rgba(255, 255, 255, .35); }

/* ===== Profil ===== */
.profil-tete { display: flex; align-items: center; gap: 14px; }
input, select, textarea { font-size: 16px; }
.profil-tete .avatar { width: 64px; height: 64px; font-size: 20px; }
.profil-tete .embleme-p { width: 64px; height: 64px; margin-left: auto; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 10px; }
legend { font-size: 13px; font-weight: 700; color: var(--doux); text-transform: uppercase; letter-spacing: .08em; padding: 0 2px; margin-bottom: 10px; }
.code-coffre { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 20px; letter-spacing: .06em; text-align: center; padding: 16px; border-radius: 14px; background: rgba(12, 12, 14, .8); border: 1px dashed var(--trait-fort); user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }
.champ-code { font-family: ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase; letter-spacing: .06em; }
.liste-radios { display: grid; gap: 0; }
.liste-radios label { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border-bottom: 1px solid var(--trait); }
.liste-radios label:last-child { border-bottom: 0; }

/* ===== Loupe ===== */
.lp-haut { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 8px 10px 14px; margin: 0; }
.lp-champ { flex: 1; min-width: 0; position: relative; }
.lp-champ .lp-icone { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: var(--doux); pointer-events: none; }
.lp-champ .lp-icone svg { width: 18px; height: 18px; }
.lp-champ input { width: 100%; min-height: 46px; border: 1px solid var(--trait-fort); border-radius: 14px; padding: 8px 42px 8px 38px; background: rgba(23, 23, 25, .7); color: var(--texte); font-size: 16px; -webkit-appearance: none; appearance: none; }
.lp-champ input::-webkit-search-cancel-button, .lp-champ input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.lp-champ input::placeholder { color: var(--pale); opacity: 1; }
.lp-effacer { position: absolute; right: 4px; top: 50%; margin-top: -19px; width: 38px; height: 38px; border: 0; background: none; color: var(--doux); padding: 0; display: grid; place-items: center; }
.lp-effacer svg { width: 18px; height: 18px; }
.lp-filtres { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.filtre { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1px solid var(--trait-fort); border-radius: 18px; background: rgba(23, 23, 25, .6); color: var(--texte); font-weight: 600; font-size: 13px; }
.filtre[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: var(--sur-accent); }
.filtre[aria-pressed="true"]::before { content: "✓"; font-weight: 800; }
.lp-resultats { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 14px calc(var(--bas-sur) + 18px); display: grid; gap: 14px; align-content: start; }
.lp-resultats h3 { font-size: 13px; font-weight: 700; color: var(--doux); text-transform: uppercase; letter-spacing: .08em; margin: 4px 2px 8px; display: flex; justify-content: space-between; }
mark { background: rgba(255, 213, 107, .9); color: #121214; border-radius: 4px; padding: 0 2px; }

/* ===== Verrou Face ID ===== */
dialog#verrou { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; border: 0; padding: 0; background: var(--fond);
  background-image: radial-gradient(80% 50% at 100% 0%, rgba(255, 255, 255, .175), transparent 60%), radial-gradient(80% 50% at 0% 100%, rgba(255, 255, 255, .15), transparent 60%); }
dialog#verrou[open] { display: grid; place-items: center; }
dialog#verrou::backdrop { background: var(--fond); }
.vr-corps { display: grid; gap: 14px; justify-items: center; text-align: center; width: 100%; max-width: 380px; padding: 24px 24px calc(var(--bas-sur) + 24px); }
.vr-logo svg { width: 96px; height: 96px; filter: drop-shadow(0 0 22px rgba(255, 255, 255, .275)); }
.vr-corps h2 { font-size: 22px; font-weight: 700; }
.vr-corps > p { color: var(--doux); font-size: 15px; }
.vr-aide { display: grid; gap: 10px; width: 100%; }
.vr-aide p { color: var(--doux); font-size: 14px; }
.note.diag { text-align: center; font-size: 11px; color: var(--pale); -webkit-user-select: text; user-select: text; margin-top: -8px; }
/* ===== Paysage (téléphone tourné) : le calendrier seul, en plein écran ===== */
html.paysage .onglets { display: none; }
html.paysage .app { max-width: none; grid-template-rows: minmax(0, 1fr); }
html.paysage .ecran { overflow: hidden; gap: 0;
  padding: 6px max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 4px) max(14px, env(safe-area-inset-left)); }
.pay { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.pay-barre { flex: none; display: flex; align-items: center; gap: 8px; min-height: 46px; }
.pay-barre h2 { flex: 1; min-width: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pay-barre .icone-bouton { width: 42px; height: 42px; border-radius: 12px; }
.pay-barre .segments { flex: none; width: 170px; padding: 3px; }
.pay-barre .segments button { min-height: 36px; font-size: 13.5px; }
.pay-barre .jauge { min-width: 110px; }
/* Mois : chaque case montre ses tâches */
.pay-mois { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto repeat(var(--rangs, 5), minmax(0, 1fr)); gap: 4px; touch-action: pan-y; }
.pay-mois .jsem { text-align: center; color: var(--doux); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding-bottom: 2px; }
.case-m { min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 4px 5px; border-radius: 10px; text-align: left;
  border: 1px solid var(--trait); background: rgba(18, 18, 20, .75); color: var(--texte); }
.case-m .n { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 16px; display: flex; justify-content: space-between; gap: 4px; }
.case-m .n i { font-style: normal; color: var(--orange); font-size: 11px; }
.case-m.dehors { background: rgba(12, 12, 14, .5); }
.case-m.dehors .n { color: var(--pale); }
.case-m.auj { border-color: rgba(255, 255, 255, .35); }
.case-m.auj .n { color: #f1ebe2; }
.case-m[aria-current="date"] .n span { background: var(--accent); color: var(--sur-accent); border-radius: 8px; padding: 0 6px; box-shadow: 0 0 10px rgba(255, 255, 255, .35); }
.case-m .chip { display: block; font-size: 12px; line-height: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 0 3px 0 5px; border-left: 3px solid var(--c); border-radius: 3px; background: color-mix(in srgb, var(--c) 16%, transparent); }
.case-m .chip.fait { color: var(--doux); text-decoration: line-through; }
.case-m .n .encore { font-style: normal; font-size: 11.5px; color: var(--doux); font-weight: 700; margin-left: auto; }
.case-m .n i { margin-left: 2px; }
/* Jour : la grille prend toute la largeur */
html.paysage .defile { margin: 0; padding: 0 0 0 12px; }
html.paysage .bas-espace { height: 64px; }
html.paysage .fab { right: 4px; bottom: 6px; width: 52px; height: 52px; }
html.paysage .bloc .b-texte b { font-size: 14px; }
html.paysage .bloc .b-texte small { font-size: 12px; }
/* Feuilles et minuteur, téléphone couché */
@media (orientation: landscape) and (max-height: 520px) {
  dialog.feuille { max-height: 96vh; max-height: min(96dvh, calc(var(--vv-h, 100dvh) - 8px)); }
  dialog.feuille.haute { height: 96vh; height: min(96dvh, calc(var(--vv-h, 100dvh) - 8px)); }
  .f-corps, .f-pied, .f-haut { padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
  dialog.minuteur { overflow-y: auto; }
  .m-corps { grid-template-rows: auto auto auto; gap: 10px; padding-top: 10px; }
  .m-anneau { width: min(52vh, 220px); }
  .m-anneau .temps b { font-size: 44px; }
  .boutons { grid-auto-flow: column; }
}
/* Jour, téléphone couché : toute la journée à l'écran, sans défiler */
html.paysage .defile.ajuste { overflow: hidden; }
.ajuste .bas-espace { height: 0; }
.ajuste .grille { margin-left: 40px; }
.ajuste .grille .heure { left: -40px; width: 34px; font-size: 10px; }
.ajuste .bloc { border-radius: 8px; border-left-width: 3px; }
.ajuste .bloc.court .b-texte { height: 100%; align-items: center; padding: 0 44px 0 8px; gap: 8px; }
html.paysage .ajuste .bloc.court .b-texte b { font-size: 12.5px; line-height: 1; }
html.paysage .ajuste .bloc.court .b-texte small { font-size: 11px; line-height: 1; }
.ajuste .bloc.court .rond-coche { top: 50%; margin-top: 0; transform: translateY(-50%); height: min(18px, calc(100% - 2px)); width: auto; aspect-ratio: 1; border-width: 1.5px; right: 10px; }
.ajuste .bloc.court .rond-coche svg { width: 62%; height: 62%; }
.ajuste .bloc.court .gain { top: 50%; bottom: auto; transform: translateY(-50%); right: 36px; }
.ajuste .maintenant span { left: -44px; font-size: 10px; }
html.paysage .pay:has(.ajuste) .fab { width: 46px; height: 46px; right: 2px; bottom: 4px; }
/* ===== Bilan de la semaine et priorités ===== */
/* Entrées : « Bilan de la semaine » (Progression), « Choisis tes priorités » (Accueil) */
.b-entree { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; min-height: 64px; text-align: left; color: inherit; }
.b-entree .quoi { flex: 1; min-width: 0; display: grid; gap: 2px; }
.b-entree .quoi b { font-weight: 650; font-size: 15.5px; }
.b-entree .quoi small { color: var(--doux); font-size: 12.5px; }
.b-entree > svg { width: 18px; height: 18px; color: var(--doux); flex: none; }

/* Accueil : les priorités de la semaine */
.prio .section-tete { margin-bottom: 4px; align-items: center; }
.prio .section-tete h2 { font-size: 16px; }
.prio .section-tete h2 small { color: var(--doux); font-size: 13px; font-weight: 600; margin-left: 4px; }
.prio-liste { display: grid; }
.prio-ligne { display: flex; align-items: center; gap: 12px; min-height: 48px; border-top: 1px solid var(--trait); }
.prio-ligne:first-child { border-top: 0; }
.prio-ligne span { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.prio-ligne .rond-coche { width: 26px; height: 26px; }
.prio-ligne.faite span { color: var(--doux); text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, .3); }

/* Saisie des priorités */
.prio-champ { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-bottom: 1px solid var(--trait); }
.prio-champ:last-child { border-bottom: 0; }
.prio-champ .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 800; color: var(--sur-accent); background: var(--accent); }
.prio-champ input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; padding: 14px 0; }
.prio-champ input::placeholder { color: var(--pale); opacity: 1; }
.prio-champ:focus-within { background: rgba(255, 255, 255, .05); }

/* Feuille du bilan */
#bilan .f-corps { gap: 20px; }
#bilan .section-tete { margin-bottom: 8px; align-items: baseline; }
#bilan .section-tete h3 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
#bilan .section-tete .note { text-align: right; font-size: 12px; }
.b-semaine { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; text-align: center; }
.b-semaine p { display: grid; gap: 2px; }
.b-semaine b { font-size: 16px; font-weight: 700; }
.b-semaine small { color: var(--doux); font-size: 12.5px; }
.b-semaine .icone-bouton:disabled { opacity: .3; }
.b-semaine .icone-bouton svg { width: 18px; height: 18px; }
.b-hero { display: grid; grid-template-columns: auto 1fr; gap: 14px 18px; align-items: center; padding: 16px;
  background: radial-gradient(120% 120% at 100% 0%, rgba(255, 255, 255, .15), transparent 55%), linear-gradient(180deg, rgba(30, 30, 32, .9), rgba(16, 16, 18, .95)); }
.b-chiffres { display: grid; gap: 6px; min-width: 0; }
.b-pts { color: var(--doux); font-size: 14px; }
.b-pts b { color: var(--texte); font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-right: 2px; }
.b-chiffres .evol { display: grid; gap: 1px; }
.b-chiffres .evol b { font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.b-chiffres .evol b svg { width: 14px; height: 14px; }
.b-chiffres .evol b.hausse { color: var(--vert); }
.b-chiffres .evol b.baisse { color: #ff8a9a; }
.b-chiffres .evol b.egal { color: var(--doux); }
.b-chiffres .evol small { color: var(--doux); font-size: 12px; }
.b-bonus { color: var(--orange); font-size: 13.5px; font-weight: 700; }
.b-phrase { grid-column: 1 / -1; font-size: 15px; line-height: 1.45; padding-top: 12px; border-top: 1px solid var(--trait); }
.b-cat { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--trait); }
.b-cat:last-child { border-bottom: 0; }
.b-cat-nom { display: grid; gap: 7px; min-width: 0; }
.b-cat-nom b { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-cat .barre-obj { height: 6px; }
.b-cat .barre-obj i { background: var(--c); box-shadow: none; }
.b-cat-val { display: grid; justify-items: end; gap: 2px; text-align: right; }
.b-cat-val b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.b-cat-val small { color: var(--doux); font-size: 12px; white-space: nowrap; }
.b-cat.ok .b-cat-val small { color: var(--vert); font-weight: 700; }
.prio-revue { list-style: none; margin: 0; padding: 0; }
.prio-revue li { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; border-bottom: 1px solid var(--trait); font-size: 15px; }
.prio-revue li:last-child { border-bottom: 0; }
.prio-revue li > span:last-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.prio-revue .marque-prio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--anneau); display: grid; place-items: center; flex: none; color: #fff; }
.prio-revue .marque-prio svg { width: 13px; height: 13px; }
.prio-revue li.faite .marque-prio { background: var(--accent); border-color: #eee8de; }
.prio-revue li:not(.faite) > span:last-child { color: var(--doux); }
.b-grille { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.b-grille .mini { min-height: 0; padding: 12px 14px; }
.b-grille .mini b { font-size: 21px; }
.b-grille .mini b small { font-size: 13px; color: var(--doux); font-weight: 600; }
.b-meilleur { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-top: 10px; font-size: 14px; color: var(--doux); }
.b-meilleur b { color: var(--texte); }
.b-cible { padding-top: 4px; }
.b-cible .note { margin: -2px 0 10px; }
@media (max-width: 359px) { .b-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } .b-chiffres { justify-items: center; } }
#b-titre:focus { outline: none; }
.b-regle { margin-top: 8px; font-size: 12.5px; }

/* ===== Tâches pas faites ===== */
.pf-entree .tuile { --c: #ffb547; }
#pas-faites .f-corps { gap: 18px; }
.pf-jour { display: grid; gap: 10px; }
.pf-jour h3 { font-size: 13px; font-weight: 700; color: var(--doux); text-transform: uppercase; letter-spacing: .08em; margin: 2px 2px 0; }
.pf-item { display: grid; gap: 12px; padding: 14px; border-left: 4px solid var(--c); }
.pf-haut { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pf-haut .quoi { flex: 1; min-width: 0; display: grid; gap: 2px; }
.pf-haut .quoi b { font-weight: 650; font-size: 15.5px; overflow-wrap: anywhere; }
.pf-haut .quoi small { color: var(--doux); font-size: 12.5px; }
.pf-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pf-b { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 56px; padding: 6px 4px; border-radius: 14px; border: 1px solid var(--trait-fort);
  background: rgba(35, 35, 37, .55); color: var(--texte); font-size: 12.5px; font-weight: 650; text-align: center; line-height: 1.15; }
.pf-b svg { width: 18px; height: 18px; }
.pf-b > span[aria-hidden] { font-size: 17px; line-height: 18px; }
.pf-b[data-pf="fait"] svg { color: var(--vert); }
.pf-b[aria-expanded="true"] { background: rgba(255, 255, 255, .125); border-color: #eee8de; }
.pf-reports { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pf-reports .bouton { font-size: 14px; padding: 0 10px; }
.pf-reports .bouton:last-child:nth-child(odd) { grid-column: 1 / -1; }
.pf-fini { display: grid; justify-items: center; gap: 12px; text-align: center; padding: 48px 16px; }
.pf-fini > span { font-size: 44px; }
.pf-fini p { color: var(--doux); font-size: 15px; display: grid; gap: 4px; }
.pf-fini p b { color: var(--texte); font-size: 19px; }
#bilan .pf-entree { margin-bottom: 12px; }

/* ===== Jour difficile ===== */
.difficile { display: grid; gap: 10px; padding: 16px; border-color: rgba(160, 190, 255, .3); background: linear-gradient(135deg, rgba(150, 175, 255, .14), rgba(255, 255, 255, .03)); }
.difficile h2 { font-size: 16px; font-weight: 600; }
.difficile p { font-size: 14px; color: var(--doux); line-height: 1.45; }
.difficile .bouton.petit { font-size: 13.5px; padding: 0 12px; line-height: 1.15; text-align: center; }
.dur-lien { align-self: center; margin: 6px auto 0; display: flex; color: var(--doux); min-height: 44px; }
.etiquette .sous { color: var(--pale); font-weight: 500; }

/* ===== Qui je deviens ===== */
.idt .section-tete { margin-bottom: 4px; align-items: center; }
.idt-liste { display: grid; }
.idt-ligne { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 0; border: 0; border-top: 1px solid var(--trait); background: none; color: inherit; text-align: left; }
.idt-ligne:first-child { border-top: 0; }
.groupe .idt-ligne { padding: 10px 14px; }
.idt-ligne .tuile { --c: #e4d3b3; font-size: 20px; }
.idt-ligne .quoi { flex: 1; min-width: 0; display: grid; gap: 3px; }
.idt-ligne .quoi b { font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idt-ligne .quoi small { color: var(--doux); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idt-ligne .barre-obj { height: 4px; margin-top: 4px; }
.idt-ligne.dort .tuile { opacity: .55; filter: grayscale(.6); }
.idt-ligne.dort .quoi small { color: var(--accent-texte); }
.idt-val { display: grid; justify-items: end; flex: none; }
.idt-val b { font-size: 24px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
.idt-val small { color: var(--doux); font-size: 11px; }
.pastilles { display: flex; flex-wrap: wrap; gap: 8px; }
.pastille { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--trait-fort); background: rgba(255, 255, 255, .05); color: var(--texte); font-size: 14px; font-weight: 550; }
.pastille.ronde { width: 46px; padding: 0; font-size: 20px; }
.pastille[aria-checked="true"] { background: rgba(255, 255, 255, .16); border-color: #fff; box-shadow: 0 0 14px rgba(255, 255, 255, .25); }
.idt-revue li > span:last-child { display: grid; gap: 2px; }
.idt-revue li small { color: var(--doux); font-size: 12.5px; }
.idt-revue li:not(.faite) .tuile { opacity: .5; filter: grayscale(.6); }

/* ===== Énergie, réflexion, coach ===== */
.energie { display: grid; gap: 12px; }
.energie h2 { font-size: 15px; font-weight: 600; }
.en-choix { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.en-choix button { display: grid; justify-items: center; gap: 3px; min-height: 60px; padding: 8px 2px; border-radius: 16px; border: 1px solid var(--trait); background: rgba(255, 255, 255, .04); color: var(--doux); transition: transform .12s ease; }
.en-choix button span { font-size: 22px; line-height: 1.1; }
.en-choix button small { font-size: 10.5px; font-weight: 550; white-space: nowrap; }
.en-choix button[aria-checked="true"] { background: rgba(255, 255, 255, .16); border-color: #fff; color: #fff; box-shadow: 0 0 16px rgba(255, 255, 255, .22); }
.en-choix button:active { transform: scale(.94); }
.energie.notee .en-choix button:not([aria-checked="true"]) { opacity: .55; }
.coach { display: grid; gap: 12px; padding: 16px; border-color: rgba(228, 211, 179, .38); background: linear-gradient(135deg, rgba(228, 211, 179, .14), rgba(255, 255, 255, .03) 65%); }
.coach h2 { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .1em; color: var(--accent-texte); }
.coach h2 .tuile { --c: #e4d3b3; text-transform: none; letter-spacing: 0; }
.coach h2 small { margin-left: auto; color: var(--doux); font-size: 12px; letter-spacing: 0; font-weight: 550; }
.coach p { font-size: 15px; line-height: 1.5; }
.coach .bouton.petit { font-size: 13.5px; padding: 0 12px; line-height: 1.15; text-align: center; }
.refl-champ { display: grid; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--trait); }
.refl-champ:last-child { border-bottom: 0; }
.refl-champ > span { font-size: 13px; font-weight: 650; color: var(--accent-texte); }
.refl-champ textarea { width: 100%; border: 0; background: none; outline: none; resize: none; font-size: 16px; line-height: 1.4; padding: 0; color: var(--texte); font-family: inherit; }
.refl-champ textarea::placeholder { color: var(--pale); opacity: 1; }
.refl-champ:focus-within { background: rgba(255, 255, 255, .05); }
.refl-champ p { font-size: 15px; line-height: 1.45; }
.refl-rappel { display: flex; gap: 12px; align-items: center; padding: 12px 16px; font-size: 15px; }
.refl-rappel > span:last-child { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.refl-rappel small { color: var(--accent-texte); font-size: 12px; font-weight: 650; }

/* ===== Vue Semaine ===== */
.sem-nav { padding: 0; }
.sem-nav h2 { display: grid; gap: 2px; text-align: center; font-size: 18px; font-weight: 600; }
.sem-nav h2 small { color: var(--doux); font-size: 12.5px; font-weight: 500; }
.sem-bandeau { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 4px; scrollbar-width: none; }
.sem-bandeau::-webkit-scrollbar { display: none; }
.sem-puce { flex: none; display: grid; grid-template-columns: auto auto; align-items: center; gap: 3px 6px; min-height: 48px; padding: 7px 12px; border-radius: 16px; border: 1px solid var(--trait); background: rgba(255, 255, 255, .05); color: var(--texte); }
.sem-puce span { font-size: 16px; }
.sem-puce b { font-size: 13.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
.sem-puce i { grid-column: 1 / -1; display: flex; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .12); overflow: hidden; min-width: 54px; }
.sem-puce u { background: var(--c); height: 100%; }
.sem-puce s { background: color-mix(in srgb, var(--c) 40%, transparent); height: 100%; }
.sem-puce.ok b { color: var(--vert); }
.sem-puce.manque { border-color: rgba(255, 181, 71, .6); }
.sem-puce.manque b { color: var(--orange); }
.sem-puce[aria-expanded="true"] { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .6); }
.sem-detail { display: grid; gap: 10px; padding: 14px 16px; font-size: 14.5px; }
.sem-detail .bouton.petit { font-size: 13.5px; padding: 0 12px; line-height: 1.15; }
.sem-jours { display: grid; gap: 6px; }
.sem-jour { display: grid; gap: 8px; padding: 6px 0 10px; border-top: 1px solid var(--trait); }
.sem-jour:first-child { border-top: 0; }
.sem-jour-tete { display: flex; align-items: center; gap: 8px; }
.sem-nom { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; min-height: 44px; padding: 0 2px; border: 0; background: none; color: inherit; text-align: left; }
.sem-nom b { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.sem-nom small { margin-left: auto; color: var(--doux); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.sem-nom .chevron { color: var(--pale); font-size: 12px; }
.sem-auj { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--sur-accent); background: var(--accent); padding: 3px 8px; border-radius: 999px; align-self: center; }
.sem-jour.auj .sem-nom b { color: #fff; }
.sem-jour.passe .sem-nom b { color: var(--doux); font-weight: 550; }
.sem-jour.passe { padding: 0; gap: 0; }
.sem-jour.passe .lignes { padding-bottom: 10px; }
.sem-jour.charge .sem-nom small { color: var(--orange); }
.sem-plus { width: 38px; height: 38px; flex: none; }
.sem-plus svg { width: 16px; height: 16px; }
.sem-jour .ligne { min-height: 56px; padding: 9px 14px; }

/* ===== Feuille courte ===== */
.puces { display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px; padding: 2px 18px; scrollbar-width: none; }
.puces::-webkit-scrollbar { display: none; }
.puce { flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--trait-fort); background: rgba(255, 255, 255, .05); color: var(--texte); font-size: 14px; font-weight: 550; white-space: nowrap; }
.puce[aria-pressed="true"] { background: var(--accent); color: var(--sur-accent); border-color: transparent; font-weight: 650; box-shadow: 0 0 14px rgba(255, 240, 215, .25); }
.t-date { margin-top: 8px; }
.t-resume { text-align: center; font-size: 14px; font-weight: 600; color: var(--accent-texte); min-height: 20px; }
.t-plus summary { display: flex; align-items: baseline; gap: 8px; min-height: 44px; padding: 0 2px; font-size: 15px; font-weight: 600; cursor: pointer; list-style: none; }
.t-plus summary::-webkit-details-marker { display: none; }
.t-plus summary::before { content: "▸"; color: var(--pale); }
.t-plus[open] summary::before { content: "▾"; }
.t-plus summary small { color: var(--doux); font-size: 12.5px; font-weight: 500; }

/* ===== Accueil : Maintenant ===== */
.mnt { display: grid; gap: 8px; padding: 14px 16px; border-left: 3px solid var(--c); }
.mnt h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-texte); }
.mnt-ligne { display: flex; align-items: center; gap: 12px; }
.mnt-ligne .ouvrir { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0; border: 0; background: none; color: inherit; text-align: left; }
.mnt-ligne .quoi { flex: 1; min-width: 0; display: grid; gap: 2px; }
.mnt-ligne .quoi b { font-size: 18px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mnt-ligne .quoi small { color: var(--doux); font-size: 13px; }
.mnt-ligne .pts { color: var(--accent-texte); font-weight: 600; font-size: 13.5px; }

/* ===== Gestes, menu d'actions, bac À caser ===== */
.ligne[data-glisse] { touch-action: pan-y; position: relative; z-index: 1; }
.ligne.glisse { box-shadow: 0 10px 30px rgba(0, 0, 0, .6); }
.g-fond { position: absolute; left: 0; right: 0; display: flex; align-items: center; padding: 0 20px; border-radius: var(--rayon); font-size: 14px; font-weight: 700; color: var(--doux); background: rgba(255, 255, 255, .04); }
.g-fond.droite { justify-content: flex-start; }
.g-fond.gauche { justify-content: flex-end; }
.g-fond.droite.ok { background: rgba(47, 211, 125, .22); color: var(--vert); }
.g-fond.gauche.ok { background: rgba(228, 211, 179, .2); color: var(--accent-texte); }
.toast.avec-action { display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 20px; pointer-events: auto; }
.toast-action { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--accent); color: var(--sur-accent); font-size: 14px; font-weight: 700; flex: none; }
.a-liste .rang { width: 100%; text-align: left; }
.a-liste .rang.danger { color: #ff8a9a; }
#actions .f-corps { gap: 18px; }
.bac { display: grid; gap: 10px; padding-top: 10px; border-top: 1px solid var(--trait); }
.bac .section-tete h2 small { color: var(--doux); font-size: 13px; font-weight: 600; }
.bac-ligne { width: 100%; text-align: left; color: inherit; display: flex; align-items: center; gap: 12px; }
.bac-ligne .quoi { flex: 1; min-width: 0; display: grid; gap: 2px; }
.bac-ligne .quoi b { font-weight: 600; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bac-ligne .quoi small { color: var(--doux); font-size: 12.5px; }
.bac-ajout .champ-nom input { font-size: 16px; }

/* ===== Semaine couchée (7 colonnes), tâches sans heure ===== */
.sem7-tete { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin: 0 0 2px 40px; gap: 4px; }
.sem7-tete span { text-align: center; font-size: 11px; font-weight: 600; color: var(--doux); white-space: nowrap; }
.sem7-tete span b { font-weight: 700; color: var(--texte); }
.sem7-tete span.auj, .sem7-tete span.auj b { color: var(--accent-texte); }
.sem7-tete span.charge b { color: var(--orange); }
.sem7-tete span i { font-style: normal; margin-left: 4px; color: var(--pale); }
.sem7 .bloc.court .b-texte { padding: 0 4px 0 5px; }
.sem7 .bloc .b-texte small, .sem7 .bloc .rond-coche, .sem7 .bloc .gain { display: none; }
html.paysage .sem7 .bloc .b-texte b { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sem7 .bloc { border-radius: 6px; }
.sem7 .colonne.auj { background: rgba(255, 255, 255, .045); }
.sem7 .colonne + .colonne { border-left: 1px solid var(--trait); }
.flou-zone { display: grid; gap: 8px; padding: 0 0 10px; }
.flou-zone .ligne { min-height: 52px; padding: 8px 14px; }
#form-tache.sans-heure .horaires { opacity: .45; }
.sem7 .bloc .b-texte { padding-right: 4px; padding-left: 5px; }

/* ===== Récompenses ===== */
.rec-pastille { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; max-width: 100%; padding: 0 14px 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 550; color: var(--doux);
  background: rgba(255, 255, 255, .04); border: 1px solid var(--trait); }
.rec-pastille span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-pastille.pret { color: var(--sur-accent); background: var(--accent); border-color: transparent; font-weight: 650; box-shadow: 0 0 18px rgba(255, 240, 215, .3); }
.niveau + .niveau { margin-top: 8px; }
.r-solde { display: grid; gap: 6px; padding: 18px; text-align: center; background: linear-gradient(135deg, rgba(228, 211, 179, .16), rgba(255, 255, 255, .03) 65%); border-color: rgba(228, 211, 179, .35); }
.r-solde p:first-child { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
.r-solde b { font-size: 44px; font-weight: 250; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.r-solde small { color: var(--doux); font-size: 14px; }
.r-solde .note { text-align: center; }
.r-ligne { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; min-height: 68px; }
.r-ligne .ouvrir { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; color: inherit; text-align: left; min-height: 48px; }
.r-ligne .tuile { --c: #e4d3b3; font-size: 20px; }
.r-ligne .quoi { flex: 1; min-width: 0; display: grid; gap: 3px; }
.r-ligne .quoi b { font-size: 15.5px; font-weight: 600; overflow-wrap: anywhere; }
.r-ligne .quoi small { color: var(--doux); font-size: 12.5px; }
.r-ligne.ok .quoi small { color: var(--accent-texte); font-weight: 600; }
.r-ligne .barre-obj { height: 4px; margin-top: 3px; }
.r-ligne .bouton.petit { flex: none; padding: 0 16px; font-size: 14px; }
.r-ligne .bouton:disabled { opacity: .45; }
#recompenses .pastille { text-align: left; height: auto; padding: 10px 14px; line-height: 1.25; }
#recompenses .pastille.ronde { padding: 0; }
.r-ligne .bouton.petit { width: auto; flex: 0 0 auto; min-width: 0; }
.r-ligne .ouvrir { flex: 1 1 0; }

/* ===== Type Événement ===== */
.types { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.types label { font-size: 12.5px; white-space: nowrap; padding: 0 2px; }
@media (max-width: 359px) { .types label { font-size: 11.5px; } }

/* ===== Niveaux et looks (édition 22) ===== */
.niveau > button { color: var(--texte); font-family: inherit; }
.n-tete { display: flex; align-items: center; gap: 16px; padding: 18px; }
.n-tete > div { flex: 1; min-width: 0; display: grid; gap: 4px; }
.n-tete small { color: var(--accent-texte); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .1em; }
.n-tete b { font-size: 26px; font-weight: 300; letter-spacing: -.02em; }
.n-tete .barre-obj { margin: 4px 0 2px; }
.n-embleme { flex: none; width: 76px; height: 76px; display: block; }
.n-embleme.petit { width: 40px; height: 40px; }
.n-embleme .embleme { position: static; width: 100%; height: 100%; display: block; }
.n-auto { padding: 12px 16px; min-height: 60px; }
.n-ligne { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 14px; color: inherit; text-align: left; font: inherit; }
.n-ligne .quoi { flex: 1; min-width: 0; display: grid; gap: 2px; }
.n-ligne .quoi b { font-size: 15.5px; font-weight: 600; }
.n-ligne .quoi small { color: var(--doux); font-size: 12.5px; }
.n-look { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--doux); white-space: nowrap; }
.n-look i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35); }
.n-etat { flex: none; width: 22px; display: grid; place-items: center; color: var(--accent-texte); font-size: 14px; }
.n-etat svg { width: 20px; height: 20px; }
.n-ligne.mis { border-color: var(--accent-texte); box-shadow: inset 0 0 0 1px var(--accent-texte), 0 18px 40px rgba(0, 0, 0, .42); }
.n-ligne.ferme .n-embleme, .n-ligne.ferme .n-look i { filter: grayscale(1); opacity: .45; }
.n-ligne.ferme .quoi b { color: var(--doux); }

dialog#fete { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; border: 0; padding: 0; background: #050506; color: var(--texte); overflow: hidden; }
dialog#fete[open] { display: grid; }
dialog#fete::backdrop { background: #050506; }
.fe-corps { position: relative; display: grid; align-content: center; justify-items: center; gap: 10px; text-align: center; overflow-y: auto;
  padding: calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 24px); }
.fe-rayons { position: absolute; left: 50%; top: 34%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(var(--arc), .13) 0 5deg, transparent 5deg 20deg);
  -webkit-mask-image: radial-gradient(circle, #000 0, transparent 46%); mask-image: radial-gradient(circle, #000 0, transparent 46%);
  animation: fe-tourne 50s linear infinite, fe-paraitre 1.4s ease both; }
.fe-corps > :not(.fe-rayons) { position: relative; animation: aube .8s cubic-bezier(.2, .8, .2, 1) both; }
.fe-embleme { width: min(190px, 46vw); height: min(190px, 46vw); filter: drop-shadow(0 0 34px rgba(var(--arc), .55)); animation: fe-eclore 1.1s cubic-bezier(.2, 1.3, .3, 1) both !important; }
.fe-embleme .embleme { position: static; width: 100%; height: 100%; display: block; }
.fe-sur { margin-top: 8px; color: var(--accent-texte); font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .22em; animation-delay: .35s !important; }
.fe-corps h2 { font-size: 48px; font-weight: 250; letter-spacing: -.03em; line-height: 1.05; background: var(--accent); -webkit-background-clip: text; background-clip: text; color: transparent; animation-delay: .45s !important; }
#fe-texte { max-width: 320px; color: var(--doux); font-size: 15px; line-height: 1.45; animation-delay: .6s !important; }
.fe-chiffres { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 360px; margin: 14px 0 4px; padding: 0; animation-delay: .75s !important; }
.fe-chiffres li { display: grid; gap: 2px; padding: 12px 6px; border-radius: 16px; background: rgba(255, 255, 255, .05); border: 1px solid var(--trait); }
.fe-chiffres b { font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; }
.fe-chiffres small { color: var(--doux); font-size: 11.5px; }
.fe-suite { color: var(--doux); font-size: 13px; animation-delay: .85s !important; }
.fe-boutons { display: grid; gap: 6px; width: 100%; max-width: 360px; margin-top: 16px; animation-delay: 1s !important; }
.fe-boutons .lien { min-height: 44px; justify-self: center; }
@keyframes fe-tourne { to { transform: rotate(360deg); } }
@keyframes fe-paraitre { from { opacity: 0; } }
@keyframes fe-eclore { from { opacity: 0; transform: scale(.4) rotate(-30deg); } }
@media (prefers-reduced-motion: reduce) { .fe-rayons, .fe-embleme, .fe-corps > :not(.fe-rayons) { animation: none !important; } }
@media (max-height: 620px) { .fe-embleme { width: 110px; height: 110px; } .fe-corps h2 { font-size: 36px; } .fe-chiffres { margin-top: 6px; } }
html.paysage .fe-embleme { width: 90px; height: 90px; }
html.paysage .fe-chiffres { display: none; }
@media (max-width: 359px) { .fe-chiffres b { font-size: 18px; } }
.n-suite { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--doux); font-size: 13.5px; line-height: 1.4; }
.n-suite span:first-child { flex: none; width: 40px; text-align: center; font-size: 26px; font-weight: 300; color: var(--accent-texte); }
/* ===== Refonte (édition 11) : noir profond, verre, platine, arcs de lumière ===== */
:root {
  --fond: #050506;
  --fond-2: #0a0a0c;
  --carte: #101012;
  --carte-2: #17171a;
  --carte-3: #1f1f23;
  --trait: rgba(255, 255, 255, .09);
  --trait-fort: rgba(255, 255, 255, .2);
  --texte: #f5f5f7;
  --doux: #a6a6b0;
  --pale: #878791;
  --bleu: #8e9bff;
  --accent: linear-gradient(135deg, #faf7f2 0%, #ddd5c8 55%, #bdb2a2 100%);
  --sur-accent: #0a0a0c;
  --accent-texte: #e4d3b3;
  --arc: 255, 236, 210;
  --anneau: rgba(255, 255, 255, .42);
  --focus: #ffffff;
  --rayon: 22px;
  --verre: linear-gradient(180deg, rgba(255, 255, 255, .085), rgba(255, 255, 255, .028));
  --lueur: 0 0 0 1px rgba(255, 255, 255, .06), inset 0 1px 0 rgba(255, 255, 255, .14), 0 24px 48px rgba(0, 0, 0, .5);
}
body {
  background-color: var(--fond);
  background-image:
    radial-gradient(circle at 128% -6%, transparent 0 57.6%, rgba(255, 255, 255, .22) 58%, rgba(255, 255, 255, .05) 58.5%, transparent 66%),
    radial-gradient(circle at -40% 118%, transparent 0 63.7%, rgba(var(--arc), .16) 64%, rgba(255, 255, 255, .03) 64.5%, transparent 71%),
    radial-gradient(90% 45% at 100% 0%, rgba(190, 190, 215, .16), transparent 70%),
    radial-gradient(80% 40% at 0% 100%, rgba(var(--arc), .09), transparent 70%);
  font-size: 15px;
  letter-spacing: -.005em;
}

/* ----- Cartes de verre ----- */
