.carte { background: var(--verre); border: 1px solid var(--trait); border-radius: var(--rayon); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 18px 40px rgba(0, 0, 0, .42);
  -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2); }
.vide { font-size: 14px; }

/* ----- En-têtes ----- */
.ecran { gap: 20px; padding-top: calc(var(--haut-sur) + 22px); padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
.tete h1 { font-size: 32px; font-weight: 600; letter-spacing: -.03em; }
.tete p { font-size: 15px; color: var(--doux); margin-top: 5px; letter-spacing: 0; }
.salut h1 { font-size: 26px; font-weight: 500; letter-spacing: -.02em; }
.section-tete h2 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.lien.fort { color: var(--accent-texte); }
.icone-bouton { border-radius: 50%; background: rgba(255, 255, 255, .06); border-color: var(--trait); }
.avatar { width: 46px; height: 46px; background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .28), rgba(255, 255, 255, .05) 60%), #121214; border: 1px solid rgba(255, 255, 255, .28);
  box-shadow: 0 0 0 4px rgba(255, 255, 255, .04), 0 8px 22px rgba(0, 0, 0, .5); font-weight: 600; }

/* ----- Boutons ----- */
.bouton { border-radius: 999px; min-height: 54px; font-weight: 650; letter-spacing: -.01em; color: var(--sur-accent);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 10px 30px rgba(230, 215, 190, .16), 0 2px 8px rgba(0, 0, 0, .5); }
.bouton.secondaire { background: rgba(255, 255, 255, .07); border: 1px solid var(--trait-fort); color: var(--texte); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
.bouton.danger { background: rgba(255, 93, 115, .1); border: 1px solid rgba(255, 93, 115, .4); color: #ff8a9a; box-shadow: none; }
.bouton.petit { min-height: 46px; }
.bouton:active, .onglet:active, .carte.mini:active, .b-entree:active, .pf-b:active { transform: scale(.975); }
.bouton, .onglet, .carte.mini, .b-entree, .pf-b { transition: transform .12s ease; }

/* ----- Segments, interrupteur, coches ----- */
.segments { border-radius: 999px; background: rgba(255, 255, 255, .05); border: 1px solid var(--trait); padding: 4px; }
.segments button, .segments label { border-radius: 999px; }
.segments button[aria-pressed="true"], .segments button[aria-selected="true"] { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 6px 16px rgba(0, 0, 0, .4); }
.interrupteur i { background: rgba(255, 255, 255, .1); border-color: var(--trait-fort); }
.interrupteur i::after { background: #d9d9de; }
.interrupteur input:checked + i { background: linear-gradient(135deg, #7f8dff, #a4aeff); border-color: transparent; box-shadow: 0 0 14px rgba(142, 155, 255, .45); }
.interrupteur input:checked + i::after { background: #fff; }
.rond-coche { border: 2px solid var(--anneau); background: rgba(255, 255, 255, .03); }
.rond-coche[aria-checked="true"] { background: var(--accent); border-color: #fff; color: var(--sur-accent); box-shadow: 0 0 16px rgba(255, 240, 215, .35); }

/* ----- Lignes ----- */
.ligne { min-height: 66px; padding: 13px 16px; }
.ligne .quoi b { font-weight: 600; font-size: 15.5px; letter-spacing: -.01em; }
.ligne .pts { color: var(--accent-texte); font-weight: 600; font-size: 13.5px; }
.tuile { background: color-mix(in srgb, var(--c, #888) 16%, #0c0c0e); border: 1px solid color-mix(in srgb, var(--c, #888) 42%, transparent); border-radius: 13px; }

/* ----- Barre du bas : verre, et le + au centre ----- */
.onglets { grid-template-columns: 1fr 1fr 68px 1fr 1fr; align-items: center; padding: 8px 12px calc(var(--bas-sur) + 8px);
  background: linear-gradient(180deg, rgba(12, 12, 14, .72), rgba(5, 5, 6, .96)); border-top: 1px solid var(--trait); -webkit-backdrop-filter: blur(26px) saturate(1.3); backdrop-filter: blur(26px) saturate(1.3); }
.onglet { color: var(--pale); font-weight: 550; font-size: 10.5px; letter-spacing: .01em; border-radius: 16px; position: relative; }
.onglet svg { width: 23px; height: 23px; }
.onglet[aria-current="page"] { color: #fff; background: none; }
.onglet[aria-current="page"] svg { filter: drop-shadow(0 0 9px rgba(255, 255, 255, .6)); }
.onglet[aria-current="page"]::after { content: ""; position: absolute; bottom: 1px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px #fff; }
.onglet-plus { justify-self: center; width: 58px; height: 58px; border-radius: 50%; padding: 0; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .22), rgba(255, 255, 255, .04) 70%), #0c0c0e; border: 1.5px solid rgba(255, 236, 205, .75);
  box-shadow: 0 0 0 5px rgba(255, 255, 255, .035), 0 0 26px rgba(255, 226, 185, .28), inset 0 1px 0 rgba(255, 255, 255, .3); transition: transform .12s ease; }
.onglet-plus:active { transform: scale(.94); }
.onglet-plus svg { width: 24px; height: 24px; }

/* ----- Accueil : le grand nombre, la vague de lumière ----- */
.points { position: relative; overflow: visible; padding: 6px 0 0; min-height: 0; background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 0; }
.points .total { margin-top: 0; align-items: baseline; gap: 10px; }
.points .total b { font-size: 60px; font-weight: 250; letter-spacing: -.035em; line-height: 1; }
.points .total small { color: var(--pale); font-size: 13px; font-weight: 500; margin-left: -2px; }
.points .total span { font-size: 14px; font-weight: 600; }
.points .courbe { position: relative; display: block; left: auto; right: auto; bottom: auto; width: calc(100% + 40px); margin: -6px -20px -8px; height: 104px; opacity: 1; }
.niveau { display: flex; justify-content: center; }
.niveau > span, .niveau > button { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 14px 0 8px; border-radius: 999px; font-size: 12.5px; font-weight: 550; color: var(--texte);
  background: rgba(255, 255, 255, .06); border: 1px solid var(--trait-fort); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12); }
.niveau .embleme { position: static; width: 22px; height: 22px; }
.niveau small { color: var(--doux); font-size: 12.5px; font-weight: 500; }
.sem-carte { display: grid; gap: 12px; width: 100%; padding: 18px 20px; text-align: left; color: inherit;
  background: linear-gradient(135deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, .06) 55%, rgba(255, 236, 210, .1)); border: 1px solid rgba(255, 255, 255, .26);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 22px 50px rgba(0, 0, 0, .55), 0 0 40px rgba(255, 240, 220, .05); transition: transform .12s ease; }
.sem-carte:active { transform: scale(.985); }
.sem-haut { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.sem-haut span { font-size: 14.5px; font-weight: 500; padding-bottom: 6px; }
.sem-haut b { font-size: 34px; font-weight: 300; letter-spacing: -.03em; line-height: 1; }
.sem-haut b small { font-size: 17px; font-weight: 400; margin-left: 1px; }
.sem-barre { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .14); overflow: hidden; }
.sem-barre i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #fff, #c9d0ff); box-shadow: 0 0 12px rgba(255, 255, 255, .7); }
.sem-bas { font-size: 12.5px; color: var(--doux); }
.sem-bas b { font-weight: 650; }
.sem-bas b.hausse { color: var(--vert); }
.sem-bas b.baisse { color: #ff8a9a; }
.mini b { font-size: 26px; font-weight: 300; letter-spacing: -.02em; }
.mini { border-radius: var(--rayon); padding: 16px; }
.alerte { border-color: rgba(255, 181, 71, .4); }

/* ----- Calendrier ----- */
.jour-m .n { font-weight: 400; }
.jour-m.auj .n { color: var(--accent-texte); font-weight: 700; }
.jour-m[aria-pressed="true"] .n { background: rgba(255, 255, 255, .07); color: #fff; font-weight: 600; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .9), 0 0 20px rgba(255, 255, 255, .35); }
.jour-b.auj b { color: var(--accent-texte); }
.jour-b[aria-pressed="true"] b { background: rgba(255, 255, 255, .07); color: #fff; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .9), 0 0 16px rgba(255, 255, 255, .3); }
.cal-tete h2 { font-weight: 550; font-size: 17px; }
.bloc { border-radius: 14px; background: color-mix(in srgb, var(--c) 18%, #0d0d10); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.bloc.brouillon { --c: #fff; background: rgba(255, 255, 255, .14); }
.fab { background: var(--accent); color: var(--sur-accent); box-shadow: 0 14px 34px rgba(0, 0, 0, .6), 0 0 26px rgba(255, 236, 205, .22), inset 0 1px 0 rgba(255, 255, 255, .7); }
.jauge .barre i, .barre-obj i { background: linear-gradient(90deg, #fff, #c9d0ff); box-shadow: 0 0 10px rgba(255, 255, 255, .5); }

/* ----- Objectifs, Progression ----- */
.serie-carte b { font-size: 34px; font-weight: 300; letter-spacing: -.02em; }
.obj-carte { border-radius: var(--rayon); }
.obj-carte .pc { color: var(--texte); font-weight: 400; font-size: 20px; }
.anneau .val b { font-size: 40px; font-weight: 300; letter-spacing: -.03em; }
.anneau .val b small { font-size: 18px; font-weight: 400; }
.chiffres .evol b { font-size: 24px; font-weight: 500; }
.repart .r-ligne .barre { background: rgba(255, 255, 255, .08); height: 6px; }
.repart .r-ligne .barre i { box-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent); }
.b-pts b { font-weight: 300; font-size: 34px; }
.b-grille .mini b { font-weight: 300; font-size: 24px; }
.b-hero { background: linear-gradient(135deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .04) 60%, rgba(255, 236, 210, .08)); border-color: rgba(255, 255, 255, .2); }
.prio-champ .num { color: var(--sur-accent); }

/* ----- Feuilles et pages ----- */
dialog.feuille { background: linear-gradient(180deg, #151517, #0a0a0c 60%); border-color: var(--trait-fort); }
@media (max-width: 639px), (orientation: landscape) and (max-height: 520px) {
  html dialog.feuille.page { background:
    radial-gradient(circle at 125% -12%, transparent 0 57.6%, rgba(255, 255, 255, .2) 58%, rgba(255, 255, 255, .04) 58.5%, transparent 66%),
    radial-gradient(90% 40% at 100% 0%, rgba(190, 190, 215, .14), transparent 70%), #050506; }
  html dialog.feuille.page::backdrop { background: #050506; }
  html dialog.feuille.page .f-haut h2 { font-size: 18px; font-weight: 600; }
}
.groupe { background: rgba(255, 255, 255, .045); border-color: var(--trait); border-radius: 18px; }
.champ-nom { background: rgba(255, 255, 255, .045); border-color: var(--trait); border-radius: 18px; }
.toast { background: rgba(28, 28, 32, .92); border-color: var(--trait-fort); border-radius: 999px; padding: 12px 20px; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }

/* ----- Lancement ----- */
.lancement { background: #030304; background-image: none; overflow: hidden; }
.lancement .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.marque { position: absolute; left: 0; right: 0; top: 17%; gap: 22px; }
.marque svg { width: 64px; height: 64px; filter: drop-shadow(0 0 22px rgba(255, 255, 255, .5)); }
.marque b { font-size: 27px; font-weight: 300; letter-spacing: .62em; margin-right: -.62em; color: #f5f5f7; }
.marque small { color: #b9b9c2; font-size: 10px; font-weight: 500; letter-spacing: .42em; margin-right: -.42em; text-transform: uppercase; }
@media (orientation: landscape) and (max-height: 520px) { .marque { top: 12%; gap: 12px; } .marque svg { width: 44px; height: 44px; } }
@keyframes aube { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.marque > * { animation: aube .9s cubic-bezier(.2, .8, .2, 1) both; }
.marque > b { animation-delay: .12s; }
.marque > small { animation-delay: .24s; }
.points { min-width: 0; }
.niveau > span, .niveau > button { max-width: 100%; min-width: 0; }
.niveau b { white-space: nowrap; font-weight: 550; }
.niveau small { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 359px) { .niveau > span, .niveau > button { font-size: 12px; gap: 6px; padding-right: 12px; } .points .total b { font-size: 52px; } }
.points .courbe { width: min(100vw, 640px); margin: -6px 0 -8px calc(50% - min(50vw, 320px)); }
.points .total { flex-wrap: wrap; }
.app { grid-template-columns: minmax(0, 1fr); }
.onglets { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 68px minmax(0, 1fr) minmax(0, 1fr); }
.onglet span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 359px) { .onglets { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 58px minmax(0, 1fr) minmax(0, 1fr); padding-left: 6px; padding-right: 6px; gap: 2px; } .onglet { font-size: 9.5px; } .onglet-plus { width: 52px; height: 52px; } }

/* ===== Accueil resserré (édition 20) ===== */
.ecran:has(> .salut) { gap: 14px; padding-top: calc(var(--haut-sur) + 14px); }
.salut h1 { font-size: 22px; }
.salut p { font-size: 13.5px; margin-top: 2px; }
.salut .avatar { width: 40px; height: 40px; font-size: 13px; }
.points .total b { font-size: 48px; }
.points .courbe { height: 58px; margin-top: -10px; margin-bottom: -4px; }
.niveau-rang { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.niveau-rang .niveau { min-width: 0; margin: 0; }
.niveau-rang .niveau > span, .niveau-rang .niveau > button, .niveau-rang .rec-pastille { min-height: 32px; font-size: 12px; }
.niveau-rang .niveau small { display: none; }
.mnt { padding: 10px 14px; gap: 4px; }
.mnt-ligne .quoi b { font-size: 16.5px; }
/* Énergie : une seule ligne */
.ecran > .energie { grid-template-columns: auto 1fr; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; }
.ecran > .energie h2 { font-size: 13.5px; font-weight: 550; color: var(--doux); }
.ecran > .energie .en-choix { gap: 4px; }
.ecran > .energie .en-choix button { min-height: 44px; padding: 2px; border-radius: 12px; border-color: transparent; background: none; }
.ecran > .energie .en-choix button small { display: none; }
.ecran > .energie .en-choix button[aria-checked="true"] { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .6); }
/* Coach, alertes, entrées : plus bas */
.ecran > .coach { gap: 8px; padding: 12px 14px; }
.ecran > .coach p { font-size: 14px; line-height: 1.4; }
.ecran > .coach .bouton.petit, .ecran > .difficile .bouton.petit { min-height: 40px; }
.ecran > .difficile { gap: 8px; padding: 12px 14px; }
.ecran > .b-entree { min-height: 52px; padding: 8px 12px; }
.ecran > .b-entree .tuile { width: 34px; height: 34px; font-size: 16px; }
.ecran > .b-entree .quoi b { font-size: 14.5px; }
.ecran > .b-entree .quoi small { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Aujourd'hui : lignes plus basses */
.ecran:has(> .salut) .lignes .ligne { min-height: 56px; padding: 9px 14px; }
.ecran:has(> .salut) .section-tete { margin-bottom: 8px; }
.dur-lien { min-height: 36px; margin-top: 2px; font-size: 12.5px; }
/* Priorités, identités : rangs compacts */
.prio.pad, .idt.pad { padding: 10px 14px; }
.prio .section-tete h2, .idt .section-tete h2 { font-size: 15px; }
.prio-ligne { min-height: 40px; }
.prio-ligne span { font-size: 14.5px; }
.refl-rappel { padding: 8px 14px; font-size: 14px; }
.idt .idt-ligne { min-height: 44px; padding: 4px 0; }
.idt .idt-ligne .tuile { width: 32px; height: 32px; font-size: 16px; }
.idt .idt-ligne .barre-obj, .idt .idt-ligne:not(.dort) .quoi small { display: none; }
.idt .idt-ligne .quoi b { font-size: 14.5px; }
.idt .idt-val { display: flex; align-items: baseline; gap: 4px; }
.idt .idt-val b { font-size: 18px; font-weight: 400; }
/* Semaine · Série · Concentration sur une ligne */
.duo.trio { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.duo .mini { padding: 10px 12px; min-height: 0; gap: 2px; text-align: left; }
.duo .mini b { font-size: 22px; }
.duo .mini b small { font-size: 12px; font-weight: 400; color: var(--doux); }
.duo .mini .titre-mini { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.duo .mini > small { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.duo.trio .mini { padding: 10px 10px; }
.mini.sem-carte { display: grid; background: var(--verre); border: 1px solid var(--trait); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 18px 40px rgba(0, 0, 0, .42); width: auto; }
.mini.sem-carte small b { font-size: 11px; font-weight: 700; }
.mini.sem-carte small b.hausse { color: var(--vert); }
.mini.sem-carte small b.baisse { color: #ff8a9a; }

/* ===== Rectangle d'une tâche dans la grille (édition 25) : verre teinté, barre de couleur, texte net, case facile à toucher ===== */
.bloc { border-radius: 14px; border: 1px solid color-mix(in srgb, var(--c) 38%, rgba(255, 255, 255, .06));
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 30%, #17171c) 0%, color-mix(in srgb, var(--c) 13%, #0c0c10) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 6px 16px rgba(0, 0, 0, .35); container-type: inline-size; }
.bloc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); border-radius: 14px 0 0 14px; box-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent); pointer-events: none; }
.bloc .b-texte { gap: 2px; padding: 7px 46px 0 13px; }
.bloc .b-texte b { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; color: #fff; }
.bloc .b-texte .b-ic { font-style: normal; font-size: 13px; margin-right: 1px; }
.bloc .b-texte small { font-size: 12px; font-variant-numeric: tabular-nums; color: color-mix(in srgb, var(--c) 35%, #d6d6dc); }
.bloc.grand .b-texte { padding-top: 10px; gap: 3px; }
.bloc.grand .b-texte b { font-size: 15.5px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bloc.court .b-texte { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 46px 0 13px; }
.bloc.court .b-texte b { flex: 0 1 auto; min-width: 0; font-size: 13.5px; }
.bloc.court .b-texte small { flex: none; }
.bloc .b-pied { position: absolute; left: 13px; bottom: 8px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: #e9e9ee;
  background: rgba(0, 0, 0, .32); border: 1px solid rgba(255, 255, 255, .08); pointer-events: none; }
.bloc .gain { right: 12px; bottom: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(0, 0, 0, .32); font-size: 11.5px; }
/* La case : 30 px à l'œil, 46 px sous le doigt */
.bloc .rond-coche { right: 9px; top: 8px; width: 30px; height: 30px; border-color: color-mix(in srgb, var(--c) 55%, #fff); background: rgba(0, 0, 0, .28); }
.bloc .rond-coche::before { inset: -8px; }
.bloc.court .rond-coche { top: 50%; margin-top: 0; transform: translateY(-50%); width: 24px; height: 24px; }
.bloc.court .rond-coche::before { inset: -11px; }
.bloc .rond-coche[aria-checked="true"] { background: var(--c); border-color: #fff; color: #0a0a0c; box-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent); }
/* Faite : elle s'efface */
.bloc.fait { background: linear-gradient(135deg, color-mix(in srgb, var(--c) 10%, #121215), #0b0b0e); border-color: rgba(255, 255, 255, .08); box-shadow: none; }
.bloc.fait::before { opacity: .45; box-shadow: none; }
.bloc.fait .b-texte b { color: var(--doux); }
.bloc.fait .b-texte small { color: var(--pale); }
/* En cours : elle respire */
.bloc.encours { border-color: var(--c); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 0 0 1px var(--c), 0 0 22px color-mix(in srgb, var(--c) 55%, transparent); animation: bloc-pouls 2.4s ease-in-out infinite; z-index: 2; }
.bloc.encours .b-texte small { color: #fff; font-weight: 600; }
@keyframes bloc-pouls { 50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 0 0 1px var(--c), 0 0 34px color-mix(in srgb, var(--c) 75%, transparent); } }
/* Moments JOMO et événements : même verre, motif discret */
.bloc.libre { background: repeating-linear-gradient(135deg, rgba(47, 211, 197, .17) 0 8px, rgba(47, 211, 197, .07) 8px 16px), #0d1213; }
.bloc.sansecran { background: repeating-linear-gradient(135deg, rgba(87, 195, 255, .17) 0 8px, rgba(87, 195, 255, .06) 8px 16px), #0d1014; }
.bloc.libre .b-texte, .bloc.sansecran .b-texte, .bloc.evenement .b-texte { padding-right: 12px; }
.bloc.brouillon { --c: #fff; background: rgba(255, 255, 255, .14); box-shadow: none; }
.bloc.brouillon::before { display: none; }
/* Choisie ou soulevée : contour clair, poignées larges */
.bloc.choisi { box-shadow: 0 0 0 2px #fff, 0 0 22px rgba(255, 255, 255, .28); }
.bloc.leve { box-shadow: 0 16px 34px rgba(0, 0, 0, .6), 0 0 0 2px #fff; transform: scale(1.015); }
.bloc .bord { height: 12px; }
.bloc .poignee { width: 56px; height: 30px; margin-left: -28px; }
.bloc .poignee::after { width: 36px; height: 6px; }
.bloc .poignee.haut { top: -15px; }
.bloc .poignee.bas { bottom: -15px; }
/* Colonnes étroites (tâches côte à côte) : l'essentiel seulement */
@container (max-width: 124px) { .b-texte small, .b-pied { display: none; } .bloc .b-texte { padding-right: 40px; } }
@container (max-width: 96px) { .bloc .rond-coche { display: none; } .bloc .b-texte, .bloc.court .b-texte { padding-right: 6px; padding-left: 10px; } .b-texte .b-ic { display: none; } }
/* Téléphone couché : rectangles serrés */
.ajuste .bloc { border-radius: 8px; box-shadow: none; }
.ajuste .bloc::before { width: 3px; border-radius: 8px 0 0 8px; box-shadow: none; }
.ajuste .bloc .b-pied { display: none; }
.ajuste .bloc .b-texte { padding: 3px 44px 0 9px; }
.ajuste .bloc.court .b-texte { padding: 0 44px 0 9px; }
.sem7 .bloc { border-radius: 6px; }
.sem7 .bloc::before { width: 2px; }
.sem7 .bloc .b-texte, .sem7 .bloc.court .b-texte { padding: 0 3px 0 6px; }
.sem7 .bloc .b-texte .b-ic { display: none; }
@media (prefers-reduced-motion: reduce) { .bloc.encours { animation: none; } }

/* ===== Moments et « Je commence » ===== */
.mnt-go { flex: none; width: auto; min-height: 40px; padding: 0 14px; font-size: 14px; white-space: nowrap; }
.mnt-go svg { width: 16px; height: 16px; }
.mnt.encours { border-left-color: var(--c); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent), 0 18px 40px rgba(0, 0, 0, .42); }
.mnt-pouls { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); animation: pouls 1.6s ease-in-out infinite; }
@keyframes pouls { 50% { opacity: .35; } }

<script>
(() => {
  'use strict';
  // ASCEND : développement personnel et JOMO. Une seule page, données sur l'appareil (localStorage).
  const VERSION = 1;                       // format des données (export, sauvegarde)
  const EDITION = 25;                      // édition de l'app, comme le cache du service worker (ascend-21)
  const CLE = 'ascend-v1';

  // ---------- Réglages fixes ----------
  const CONFIG = {
    pardon: 7,             // la série pardonne un jour raté tous les 7 jours
    difficilesParSemaine: 2,
    courage: { reports: 2, bonus: .5 },   // une tâche repoussée 2 fois ou plus rapporte 50 % de plus une fois faite
    absence: 3,            // jours sans ouvrir l'app avant l'accueil « content de te revoir »
    heure: 60,             // px par heure dans la grille (= --H)
    pas: 15,               // minutes : les plages se calent au quart d'heure
    duree: 60,             // durée proposée pour une nouvelle plage
    ouverture: 7,          // heure en haut de la grille à l'ouverture
    appuiLong: 450,        // ms : appui long sur l'écran tactile
    points: { libre: 30, sansecran: 40, evenement: 0, libresParJour: 2, libreMin: 30, bonusObjectif: 5, bonusSemaine: .5 },
    validation: 3,         // jours pour dire si un moment sans écran a été tenu
    rappels: { horizon: 14, heureSauvegarde: 19 * 60 },
    // Dix niveaux. Chacun débloque un look : c = dégradé de l'accent, texte = couleur des textes d'accent, arc = teinte des arcs de lumière
    // Planifier par moment : la tâche se fait « le matin », sans heure précise (a, b = bornes du moment, en minutes)
    moments: { matin: { nom: 'Matin', ce: 'Ce matin', icone: '🌅', a: 6 * 60, b: 12 * 60 }, aprem: { nom: 'Après-midi', ce: 'Cet après-midi', icone: '☀️', a: 12 * 60, b: 18 * 60 }, soir: { nom: 'Soir', ce: 'Ce soir', icone: '🌙', a: 18 * 60, b: 24 * 60 } },
    sansFin: 5000,         // après le dernier niveau, un niveau de plus tous les 5 000 points (Zénith II, III…)
    paliers: [
      { id: 'eclat', nom: 'Éclat', seuil: 0, look: 'Platine', c: ['#faf7f2', '#ddd5c8', '#bdb2a2'], texte: '#e4d3b3', arc: '255, 236, 210' },
      { id: 'lueur', nom: 'Lueur', seuil: 250, look: 'Argent', c: ['#ffffff', '#dbe0ea', '#aab2c2'], texte: '#d3dae8', arc: '214, 224, 245' },
      { id: 'cristal', nom: 'Cristal', seuil: 500, look: 'Glacier', c: ['#f1f9ff', '#bfdcf5', '#8db9e2'], texte: '#b9d8f5', arc: '170, 212, 255' },
      { id: 'prisme', nom: 'Prisme', seuil: 1000, look: 'Améthyste', c: ['#f7f1ff', '#d6c4f8', '#aa94e2'], texte: '#d5c4f8', arc: '200, 170, 255' },
      { id: 'etoile', nom: 'Étoile', seuil: 1500, look: 'Or', c: ['#fff7dc', '#f1d68c', '#d0aa52'], texte: '#f1d68c', arc: '255, 214, 130' },
      { id: 'comete', nom: 'Comète', seuil: 2500, look: 'Jade', c: ['#ecfff8', '#a9ecd7', '#70ceb3'], texte: '#a9ecd7', arc: '130, 235, 200' },
      { id: 'constellation', nom: 'Constellation', seuil: 4000, look: 'Saphir', c: ['#eff3ff', '#b6c5ff', '#8498ee'], texte: '#bac8ff', arc: '140, 165, 255' },
      { id: 'aurore', nom: 'Aurore', seuil: 6000, look: 'Or rose', c: ['#fff1ee', '#f8c5be', '#e29c99'], texte: '#f8c5be', arc: '255, 170, 165' },
      { id: 'nova', nom: 'Nova', seuil: 10000, look: 'Ambre', c: ['#fff2de', '#ffca8c', '#f19c54'], texte: '#ffca8c', arc: '255, 170, 90' },
      { id: 'zenith', nom: 'Zénith', seuil: 15000, look: 'Iris', c: ['#ffffff', '#ffe7b3', '#f6bbd9', '#b9c5ff'], texte: '#ffe7b3', arc: '225, 185, 255' }
    ]
  };
  let H = CONFIG.heure;                    // px par heure ; téléphone couché, la vue Jour l'ajuste pour montrer toute la journée
  let HMIN = 30;                           // hauteur minimale d'un bloc
  const PLAGE = { a: 0, b: 24, dispo: 0, ajuste: false };
  const PALETTE = ['#ff4d6d', '#ffb547', '#7b6cff', '#d78bff', '#ff5e7a', '#4f8bff', '#3ee08f', '#2fd3c5', '#57c3ff', '#ff8a3d', '#f5d547', '#9aa3d9'];
  const NOMS_COULEURS = { '#ff4d6d': 'Rouge', '#ffb547': 'Orange', '#7b6cff': 'Violet', '#d78bff': 'Mauve', '#ff5e7a': 'Rose', '#4f8bff': 'Bleu', '#3ee08f': 'Vert', '#2fd3c5': 'Turquoise', '#57c3ff': 'Ciel', '#ff8a3d': 'Mandarine', '#f5d547': 'Jaune', '#9aa3d9': 'Gris' };
  const ICONES_CAT = ['🏋️', '💼', '📘', '👥', '❤️', '⭐', '🧘', '🏃', '🚴', '⚽', '🎯', '🧠', '💡', '📝', '🎨', '🎵', '🍎', '💰', '🏠', '✈️', '🌱', '🛠️', '📷', '🎮'];
  const CATS = () => [
    { id: 'sport', nom: 'Sport', icone: '🏋️', couleur: '#ff4d6d', points: 50, objectif: 2, active: true },
    { id: 'travail', nom: 'Travail', icone: '💼', couleur: '#ffb547', points: 30, objectif: 5, active: true },
    { id: 'lecture', nom: 'Lecture', icone: '📘', couleur: '#7b6cff', points: 20, objectif: 3, active: true },
    { id: 'social', nom: 'Social', icone: '👥', couleur: '#d78bff', points: 20, objectif: 1, active: true },
    { id: 'sante', nom: 'Santé', icone: '❤️', couleur: '#ff5e7a', points: 40, objectif: 4, active: true },
    { id: 'autre', nom: 'Autre', icone: '⭐', couleur: '#9aa3d9', points: 10, objectif: 0, active: true }
  ];
  // Les deux types JOMO : pas de catégorie, des points fixes
  const JOMO = {
    libre: { nom: 'Temps pour moi', court: 'Pour moi', icone: '🌿', couleur: '#2fd3c5' },
    sansecran: { nom: 'Sans écran', court: 'Sans écran', icone: '📵', couleur: '#57c3ff' },
    // Événement : un rendez-vous, un cours, un dîner. Il occupe du temps, ne se coche pas et ne rapporte pas de points.
    evenement: { nom: 'Événement', court: 'Événement', icone: '📅', couleur: '#a9b0c4' }
  };
  const REPET = { jour: 'Chaque jour', ouvres: 'En semaine', semaine: 'Chaque semaine', mois: 'Chaque mois' };
  const JOURS_COURTS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  const JOURS_LONGS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];

  // ---------- Données ----------
  // elements : { id, type: 'tache' | 'libre' | 'sansecran', titre, cat, date, debut, fin (minutes), rep: null | { freq, jusqua },
  //              exceptions: { date: true }, faits: { date: true }, objectif: id | null, creeLe }
  // habitudes : { id, titre, cat, jours: [0..6] (0 = lundi), debut (date), fin (date de retrait ou null), faits: { date: true } }
  // objectifs : { id, titre, cat, echeance, etapes: [{ id, titre, faitLe }], creeLe, atteintLe }
  // payes : { clé : { pts, jour, type, cat, raison? } } ; gains : { jour : { total, cats: { id: pts }, src: { type: pts } } }
  // priorites : { lundi : [{ id, titre, fait }] } (1 à 3 par semaine) ; bilanVu : lundi de la semaine où le bilan s'est ouvert de lui-même
  // partis : { clé d'une tâche pas faite : jour où on l'a laissée partir }
  // difficiles : { jour : true } (jours difficiles : habitudes en version minimale) ; vu : dernier jour où l'app a été ouverte
  function rappelsVides() {
    return { actif: false, jeton: null, service: null, avant: true, delai: 30, matin: true, heureMatin: 8 * 60, sauvegarde: true, signature: null, majLe: null, erreur: null };
  }
  function coffreVide() { return { actif: false, derniere: null, envoiLe: null, jours: [], erreur: null, signature: null }; }
  const vide = () => ({
    app: 'ascend', version: VERSION,
    profil: { prenom: 'Mehdi', initiales: 'MB' },
    categories: CATS(),
    elements: [], habitudes: [], objectifs: [],
    tenus: {}, payes: {}, gains: {}, points: 0,
    focus: [],                 // sessions de concentration : { jour, cat, min, cle, le }
    minuteur: null,            // { phase: 'travail' | 'pause' | 'pret', fin, reste, cle, cat, titre, cycle, debut }
    reglages: { plafond: 9 * 60, travail: 25, pause: 5 },
    meilleureSerie: 0, meilleureSansEcran: 0,
    priorites: {}, bilanVu: null, partis: {}, difficiles: {}, vu: null, identites: [], aCaser: [], recompenses: [], achats: [], energie: {}, reflexions: {}, conseilsVus: {},
    enCours: null,                              // la tâche commencée (« Je commence ») : { cle, debut }
    look: null, niveauMax: 0, niveauFete: 0,   // look choisi (null = celui du niveau), plus haut niveau atteint, dernier niveau fêté
    onglet: 'accueil', vueCal: 'semaine', semaineVue: true, vueObj: 'habitudes', periode: 30,
    derniereExport: null, depuis: null,
    rappels: null, coffre: null
  });
  let S;
  try { S = Object.assign(vide(), JSON.parse(localStorage.getItem(CLE)) || {}); }
  catch (e) { S = vide(); }
  const estObjet = v => v && typeof v === 'object' && !Array.isArray(v);
  function nettoyer() {
    ['elements', 'habitudes', 'objectifs', 'focus'].forEach(c => { if (!Array.isArray(S[c])) S[c] = []; });
    ['tenus', 'payes', 'gains', 'priorites', 'partis', 'difficiles', 'energie', 'reflexions', 'conseilsVus'].forEach(c => { if (!estObjet(S[c])) S[c] = {}; });
    Object.keys(S.priorites).forEach(k => {
      const l = Array.isArray(S.priorites[k]) ? S.priorites[k].filter(p => p && p.id && typeof p.titre === 'string' && p.titre.trim()).slice(0, 3) : [];
      l.forEach(p => { p.titre = p.titre.slice(0, 60); p.fait = !!p.fait; });
      if (l.length && /^\d{4}-\d{2}-\d{2}$/.test(k)) S.priorites[k] = l; else delete S.priorites[k];
    });
    if (typeof S.bilanVu !== 'string') S.bilanVu = null;
    if (typeof S.vu !== 'string') S.vu = null;
    ['recompenses', 'achats'].forEach(c => { S[c] = (Array.isArray(S[c]) ? S[c] : []).filter(x => x && x.id && typeof x.titre === 'string' && x.prix > 0); });
    S.aCaser = (Array.isArray(S.aCaser) ? S.aCaser : []).filter(x => x && x.id && typeof x.titre === 'string' && x.titre.trim()).slice(0, 50);
    S.aCaser.forEach(x => { x.duree = Math.min(Math.max(+x.duree || 60, 15), 240); if (!S.categories.some(c => c.id === x.cat)) x.cat = S.categories[0].id; });
    if (!S.semaineVue) { S.semaineVue = true; S.vueCal = 'semaine'; }      // édition 16 : la Semaine devient la vue par défaut, une fois
    if (!['semaine', 'jour', 'mois'].includes(S.vueCal)) S.vueCal = 'semaine';
    S.niveauMax = Math.max(CONFIG.paliers.reduce((a, p, i) => (S.points >= p.seuil ? i : a), 0), Math.min(+S.niveauMax || 0, 9999));
    S.niveauFete = Math.max(0, +S.niveauFete || 0);
    if (!CONFIG.paliers.some((p, i) => p.id === S.look && i <= S.niveauMax)) S.look = null;
    Object.keys(S.energie).forEach(k => { const n = +S.energie[k]; if (n >= 1 && n <= 5) S.energie[k] = Math.round(n); else delete S.energie[k]; });
    if (!Array.isArray(S.categories) || !S.categories.length) S.categories = CATS();
    S.identites = (Array.isArray(S.identites) ? S.identites : []).filter(x => x && x.id && typeof x.nom === 'string' && x.nom.trim()).slice(0, 4);
    S.identites.forEach(x => { x.icone = typeof x.icone === 'string' && x.icone ? x.icone : '🎯'; x.phrase = typeof x.phrase === 'string' ? x.phrase : ''; });
    S.categories.forEach(c => { if (c && !S.identites.some(x => x.id === c.identite)) c.identite = null; });
    S.categories.forEach(c => {
      c.points = Math.max(0, Math.min(1000, Math.round(Number(c.points) || 0)));
      c.objectif = Math.max(0, Math.min(21, Math.round(Number(c.objectif) || 0)));
      if (typeof c.active !== 'boolean') c.active = true;
      if (!c.icone) c.icone = '⭐';
      if (!/^#[0-9a-f]{6}$/i.test(c.couleur || '')) c.couleur = '#9aa3d9';
    });
    S.profil = Object.assign({ prenom: 'Mehdi', initiales: 'MB' }, estObjet(S.profil) ? S.profil : {});
    S.reglages = Object.assign({ plafond: 9 * 60, travail: 25, pause: 5 }, estObjet(S.reglages) ? S.reglages : {});
    S.rappels = Object.assign(rappelsVides(), estObjet(S.rappels) ? S.rappels : {});
    S.coffre = Object.assign(coffreVide(), estObjet(S.coffre) ? S.coffre : {});
    S.elements = S.elements.filter(el => el && el.id && typeof el.date === 'string' && el.debut != null && el.fin != null);
    S.elements.forEach(el => {
      el.exceptions = estObjet(el.exceptions) ? el.exceptions : {};
      el.faits = estObjet(el.faits) ? el.faits : {};
      if (!['tache', 'libre', 'sansecran', 'evenement'].includes(el.type)) el.type = 'tache';
      if (el.objectif === undefined) el.objectif = null;
      if (el.moment && !(el.type === 'tache' && el.flou && CONFIG.moments[el.moment])) delete el.moment;
      if (el.finLe && !(el.type === 'evenement' && el.flou && !el.rep && typeof el.finLe === 'string' && el.finLe > el.date)) delete el.finLe;
    });
    S.elements = S.elements.filter(el => !el.rep || !el.rep.jusqua || el.rep.jusqua >= el.date);
    S.habitudes = S.habitudes.filter(h => h && h.id && h.titre);
    S.habitudes.forEach(h => {
      h.faits = estObjet(h.faits) ? h.faits : {};

  const dk = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  function tombe(el, k) {

  }
  const occ = (el, k) => ({ el, k, cle: el.id + '|' + k, fait: !!el.faits[k] });
  const ordre = (a, b) => a.el.debut - b.el.debut || a.el.fin - b.el.fin || a.el.titre.localeCompare(b.el.titre, 'fr');

  function transferer(ancienne, nouvelle) {

  // Modifie une occurrence. portee : 'une' (cette fois seulement) ou 'suivantes'. Renvoie la nouvelle clé.

  // Service de rappels, sauvegarde automatique : états en mémoire

  const U = {

  const DERNIER = CONFIG.paliers.length - 1;

  // Tout gain ou retrait passe par ici : le total, le journal par jour et par catégorie restent d'accord.
  function noterGain(pts, jour, type, catId) {

  // Cocher ou décocher une tâche. Renvoie le message à afficher.

  // Moments sans écran tenus d'affilée (du plus récent au plus ancien ; un « pas tenu » ou un oubli coupe la série)
  function serieSansEcran() {
    const fins = [];
    const auj = aujourdhui();
    for (let i = 0; i <= 120; i++) {
      const k = decaler(auj, -i);
      duJour(k).filter(o => o.el.type === 'sansecran').forEach(o => {
        const e = etatSansEcran(o);
        if (['tenu', 'tenu-tard', 'pas-tenu', 'oublie'].includes(e)) fins.push({ f: finOcc(o), ok: e === 'tenu' || e === 'tenu-tard' });
      });
    }
    fins.sort((a, b) => b.f - a.f);
    let n = 0;
    for (const x of fins) { if (!x.ok) break; n++; }
    return n;
  }

  // ---------- Habitudes et série ----------
  const habitudeDue = (h, k) => k >= h.debut && (!h.fin || k < h.fin) && h.jours.includes(indexJour(k));
  const habitudesActives = () => S.habitudes.filter(h => !h.fin);
  const cleHab = (h, k) => 'h:' + h.id + '|' + k;
  function basculerHabitude(h, k) {
    const cle = cleHab(h, k);
    if (h.faits[k]) {
      delete h.faits[k];
      const pts = reprendre(cle);
      return pts ? `Décochée : −${pts} pts.` : 'Décochée.';
    }
    h.faits[k] = true;
    const c = cat(h.cat);
    const pts = gagner(cle, ptsHabitude(h, k), k, 'habitude', c.id);
    const s = serie();
    if (s > S.meilleureSerie) S.meilleureSerie = s;
    const toutes = S.habitudes.filter(x => habitudeDue(x, k));
    const reste = toutes.filter(x => !x.faits[k]).length;
    return `+${pts} pts` + (k === aujourdhui() ? (reste ? ` · encore ${pluriel(reste, 'habitude')} aujourd'hui` : ` · série : ${pluriel(s, 'jour')} 🔥`) : '') + echoIdentite(h.cat);
  }
  // Un jour compte si toutes les habitudes prévues ce jour-là sont faites ; null si aucune n'était prévue.
  function jourComplet(k) {
    const d = S.habitudes.filter(h => habitudeDue(h, k));
    if (!d.length) return null;
    return d.every(h => h.faits[k]);
  }
  // Série actuelle : aujourd'hui compte dès qu'il est complet.
  // Elle pardonne : un jour raté ne la casse pas, s'il n'y en a pas eu d'autre dans les 7 jours (il ne compte pas, c'est tout).
  // Deux ratés en 7 jours, et elle repart de zéro.
  function parcourirSerie(premier, etat) {
    const auj = aujourdhui(), pardons = [];
    let n = etat(auj) === true ? 1 : 0, dernier = null;
    for (let k = decaler(auj, -1), i = 0; k >= premier && i < 3700; k = decaler(k, -1), i++) {
      const c = etat(k);
      if (c === true) { n++; continue; }
      if (c !== false) continue;
      if (dernier && ecart(k, dernier) < CONFIG.pardon) break;
      dernier = k; pardons.push(k);
    }
    // Un pardon tout au bout (rien de fait avant lui) n'en est pas un
    while (pardons.length) { const k = pardons[pardons.length - 1]; let avant = false; for (let q = decaler(k, -1), i = 0; q >= premier && i < 3700; q = decaler(q, -1), i++) { const c = etat(q); if (c === true) { avant = true; break; } if (c === false) break; } if (avant) break; pardons.pop(); }
    return { n, pardons: n ? pardons : [] };
  }
  function serieDetail() {
    if (!S.habitudes.length) return { n: 0, pardons: [] };
    return parcourirSerie(S.habitudes.reduce((m, h) => (h.debut < m ? h.debut : m), '9999-12-31'), jourComplet);
  }
  const serie = () => serieDetail().n;
  const serieHabitude = h => parcourirSerie(h.debut, k => habitudeDue(h, k) ? !!h.faits[k] : null).n;
  // Le joker de la semaine est-il encore là ? (aucun jour pardonné dans les 7 derniers jours)
  const jokerDispo = () => !serieDetail().pardons.some(k => ecart(k, aujourdhui()) < CONFIG.pardon);

  // ---------- Jour difficile ----------
  // Un mauvais jour : les habitudes passent en version minimale (moitié des points, la série continue). 2 par semaine au plus.
  const difficile = k => !!S.difficiles[k];
  const ptsHabitude = (h, k) => { const p = cat(h.cat).points; return difficile(k) ? Math.max(5, Math.round(p / 10) * 5) : p; };
  const titreHabitude = (h, k) => difficile(k) ? (h.mini || h.titre + ' (version mini)') : h.titre;
  function difficilesSemaine(k) { const l = lundiDe(k); return Object.keys(S.difficiles).filter(x => x >= l && x <= decaler(l, 6)).length; }

  // ---------- Objectifs à long terme ----------
  // Avancement : étapes cochées + tâches rattachées faites. Une tâche répétée compte ses fois jusqu'à l'échéance
  // (ou jusqu'à aujourd'hui sans échéance).
  function tachesLiees(ob) {
    const res = [];
    const limite = ob.echeance && ob.echeance > aujourdhui() ? ob.echeance : aujourdhui();
    S.elements.filter(el => el.type === 'tache' && el.objectif === ob.id).forEach(el => {
      if (!el.rep) { res.push(occ(el, el.date)); return; }
      for (let k = el.date, i = 0; k <= limite && i < 800; k = decaler(k, 1), i++) {
        if (el.rep.jusqua && k > el.rep.jusqua) break;
        if (tombe(el, k)) res.push(occ(el, k));
      }
    });
    return res.sort((a, b) => a.k.localeCompare(b.k) || ordre(a, b));
  }
  function avancement(ob) {
    const t = tachesLiees(ob);
    const total = ob.etapes.length + t.length;
    const faits = ob.etapes.filter(e => e.faitLe).length + t.filter(o => o.fait).length;
    return { total, faits, taches: t, pc: total ? Math.round(faits / total * 100) : 0 };
  }
  const cleEtape = (ob, e) => 'e:' + ob.id + ':' + e.id;
  function basculerEtape(ob, e) {
    const cle = cleEtape(ob, e);
    if (e.faitLe) { e.faitLe = null; U.decoche = true; const pts = reprendre(cle); return pts ? `Étape décochée : −${pts} pts.` : 'Étape décochée.'; }
    e.faitLe = Date.now();
    const c = cat(ob.cat);
    return `Étape franchie : +${gagner(cle, c.points, aujourdhui(), 'etape', c.id)} pts.`;
  }
  // Objectif atteint (100 %) : bonus de 5 fois la valeur de sa catégorie. Repris seulement si on décoche quelque chose.
  function verifierObjectifs() {
    const decoche = U.decoche;
    U.decoche = false;
    S.objectifs.forEach(ob => {
      const a = avancement(ob);
      const cle = 'o:' + ob.id;
      if (a.total && a.faits === a.total) {
        if (!ob.atteintLe) {
          ob.atteintLe = Date.now();
          const c = cat(ob.cat);
          gagner(cle, c.points * CONFIG.points.bonusObjectif, aujourdhui(), 'objectif', c.id);

    });

  // ---------- Statistiques ----------
  // Nombre de choses faites dans une catégorie entre deux jours (inclus) : tâches cochées et habitudes faites
  function faitsCat(catId, de, a) {
    let n = 0;
    S.elements.forEach(el => {
      if (el.type !== 'tache' || el.cat !== catId) return;
      Object.keys(el.faits).forEach(k => { if (k >= de && k <= a && tombe(el, k)) n++; });
    });
    S.habitudes.forEach(h => { if (h.cat !== catId) return; Object.keys(h.faits).forEach(k => { if (k >= de && k <= a) n++; }); });
    return n;
  }
  // Part des objectifs par semaine atteinte sur une fenêtre de « jours » jours finissant le jour « fin »
  function tauxObjectifs(jours, fin) {
    const de = decaler(fin, -(jours - 1));
    let cible = 0, atteint = 0;
    S.categories.filter(c => c.active && c.objectif > 0).forEach(c => {
      const ci = c.objectif * jours / 7;
      cible += ci;
      atteint += Math.min(faitsCat(c.id, de, fin), ci);
    });
    return cible ? atteint / cible : null;
  }
  function gainsEntre(de, a) {
    const r = { total: 0, cats: {}, src: {} };
    Object.keys(S.gains).forEach(k => {
      if (k < de || k > a) return;
      const g = S.gains[k];
      r.total += g.total || 0;
      Object.keys(g.cats || {}).forEach(c => { r.cats[c] = (r.cats[c] || 0) + g.cats[c]; });
      Object.keys(g.src || {}).forEach(c => { r.src[c] = (r.src[c] || 0) + g.src[c]; });
    });
    return r;
  }
  const gainDuJour = k => (S.gains[k] && S.gains[k].total) || 0;
  function focusEntre(de, a) {
    const r = { total: 0, sessions: 0, cats: {} };
    S.focus.forEach(f => { if (f.jour < de || f.jour > a) return; r.total += f.min; r.sessions++; r.cats[f.cat] = (r.cats[f.cat] || 0) + f.min; });

  // JOMO sur une fenêtre : temps pour moi gardés, moments sans écran tenus, jours sous le plafond (parmi les jours avec des tâches)
  function jomoEntre(de, a) {
    let libres = 0, libresTotal = 0, tenus = 0, ecransTotal = 0, sous = 0, joursPrevus = 0;
    const auj = aujourdhui();
    for (let k = de; k <= a; k = decaler(k, 1)) {
      duJour(k).forEach(o => {
        if (o.el.type === 'libre' && finOcc(o) <= Date.now()) { libresTotal++; if (S.payes[o.cle] && S.payes[o.cle].pts > 0) libres++; }
        if (o.el.type === 'sansecran' && finOcc(o) <= Date.now()) { ecransTotal++; if (S.tenus[o.cle] === true) tenus++; }
      });
      if (k <= auj) { const m = minutesPrevues(k); if (m) { joursPrevus++; if (m <= S.reglages.plafond) sous++; } }
    }
    return { libres, libresTotal, tenus, ecransTotal, sous, joursPrevus };
  }

  // ---------- Minuteur de concentration (Pomodoro) ----------
  // État enregistré : il survit à la fermeture de l'app. Les phases se suivent sur des horodatages.
  function demarrerMinuteur(o, catId) {
    const el = o ? o.el : null;
    S.minuteur = { phase: 'travail', debut: Date.now(), fin: Date.now() + S.reglages.travail * 6e4, reste: null, cle: o ? o.cle : null,
      cat: el ? cat(el.cat).id : (catId || catsActives()[0].id), titre: el ? el.titre : null, cycle: 1 };
  }
  function noterFocus(min) {
    const M = S.minuteur;
    if (!M || min < 1) return;
    S.focus.push({ jour: aujourdhui(), cat: M.cat, min: Math.round(min), cle: M.cle, le: Date.now() });
  }
  // Fait avancer le minuteur : fin de travail (le temps est compté, la pause démarre), fin de pause (on attend le feu vert)
  function avancerMinuteur() {
    const M = S.minuteur;
    if (!M || M.reste != null || !M.fin || Date.now() < M.fin) return null;
    if (M.phase === 'travail') {
      noterFocus((M.fin - M.debut) / 6e4);
      M.phase = 'pause'; M.debut = M.fin; M.fin = M.fin + S.reglages.pause * 6e4;
      if (Date.now() >= M.fin) { M.phase = 'pret'; M.fin = null; }
      return 'pause';
    }
    if (M.phase === 'pause') { M.phase = 'pret'; M.fin = null; return 'pret'; }
    return null;
  }

    if (M && M.phase === 'travail') noterFocus(((M.reste != null ? (M.fin - M.debut) - M.reste : Date.now() - M.debut)) / 6e4);

    const etoile = (cx, cy, R, r) => {
      const p = [];
      for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + i * Math.PI / 4, d = i % 2 ? r : R; p.push([cx + d * Math.cos(a), cy + d * Math.sin(a)]); }
      return p;
    };
    const facettes = (cx, cy, R, r) => {
      const p = etoile(cx, cy, R, r);
      return p.map((pt, i) => { const q = p[(i + 1) % 8]; return `<path d="M${cx} ${cy}L${pt[0].toFixed(1)} ${pt[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}z" fill="${i % 2 ? `url(#ec${n})` : `url(#ef${n})`}"/>`; }).join('');
    };
    const simple = (cx, cy, R, r, c) => `<path d="M${etoile(cx, cy, R, r).map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L')}z" fill="${c}"/>`;
    const rang = Math.max(0, CONFIG.paliers.findIndex(p => p.id === id)), P = CONFIG.paliers[rang];
    const niveau = Math.floor(rang / 2);                 // cinq formes ; les deux niveaux d'une même forme se distinguent par la couleur et un anneau
    const c0 = P.c[0], c1 = P.c[1], c2 = P.c[P.c.length - 1];
    const R = [26, 32, 34, 30, 32][niveau] || 26;
    let fond = '', extra = '';
    if (rang % 2) fond += `<circle cx="50" cy="50" r="46" fill="none" stroke="${c1}" stroke-width="1" opacity=".5" stroke-dasharray="1.5 5" stroke-linecap="round"/>`;
    if (niveau >= 2) extra += [0, 1, 2, 3].map(i => { const a = Math.PI / 4 + i * Math.PI / 2; return `<path d="M${50 + 14 * Math.cos(a)} ${50 + 14 * Math.sin(a)}L${50 + 30 * Math.cos(a)} ${50 + 30 * Math.sin(a)}" stroke="${c0}" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>`; }).join('');
    if (niveau >= 3) {
      const pts = [[18, 24], [84, 30], [78, 82]];
      extra += `<path d="M18 24L50 50L84 30M50 50L78 82" stroke="${c1}" stroke-width=".9" opacity=".55" fill="none"/>` + pts.map(([x, y]) => simple(x, y, 6, 1.8, c0)).join('');
    }
    if (niveau >= 4) fond += `<circle cx="50" cy="50" r="44" fill="url(#eh${n})"/><circle cx="50" cy="50" r="40" fill="none" stroke="${c0}" stroke-width="1" opacity=".5"/>`;
    const coeur = niveau === 0 ? simple(50, 50, R, R * .32, `url(#ef${n})`) : facettes(50, 50, R, R * .3);
    return `<svg viewBox="0 0 100 100" aria-hidden="true" class="embleme"><defs>
      <linearGradient id="ef${n}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c0}"/><stop offset=".55" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>
      <linearGradient id="ec${n}" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="#2a2a2e"/></linearGradient>
      <radialGradient id="eg${n}"><stop offset="0" stop-color="${c1}" stop-opacity=".7"/><stop offset="1" stop-color="${c1}" stop-opacity="0"/></radialGradient>
      <radialGradient id="eh${n}"><stop offset=".55" stop-color="${c1}" stop-opacity="0"/><stop offset=".85" stop-color="${c1}" stop-opacity=".35"/><stop offset="1" stop-color="${c1}" stop-opacity="0"/></radialGradient></defs>
      ${fond}<circle cx="50" cy="50" r="${R * 0.9}" fill="url(#eg${n})"/>${extra}${coeur}</svg>`;
  }
  // ---------- Morceaux communs ----------
  // Événement sur la journée (flou) : « Toute la journée », ou sa période s'il dure plusieurs jours (finLe)
  const jourCourt = k => fmt(k, { day: 'numeric', month: 'short' });
  const periode = el => el.date.slice(0, 7) === el.finLe.slice(0, 7) ? `Du ${parse(el.date).getDate()} au ${jourCourt(el.finLe)}` : `Du ${jourCourt(el.date)} au ${jourCourt(el.finLe)}`;
  const plage = el => el.type === 'evenement' && el.flou ? (el.finLe ? periode(el) : 'Toute la journée') : el.flou ? `${el.moment ? CONFIG.moments[el.moment].nom : 'Dans la journée'} · ${duree(el.fin - el.debut)}` : `${hhmm(el.debut)} – ${finTexte(el.fin)}`;
  const ptsTexte = n => `${n > 0 ? '+' : ''}${n} pt${Math.abs(n) > 1 ? 's' : ''}`;
  function description(o) {
    const el = o.el, l = look(el);
    let d = `${el.titre}, ${o.k === aujourdhui() ? '' : jourLong(o.k) + ', '}${el.type === 'evenement' && el.flou ? (el.finLe ? `du ${jourLong(el.date).toLowerCase()} au ${jourLong(el.finLe).toLowerCase()}, jour ${ecart(el.date, o.k) + 1} sur ${ecart(el.date, el.finLe) + 1}` : 'toute la journée') : el.flou ? (el.moment ? CONFIG.moments[el.moment].ce.toLowerCase() : 'dans la journée') : `de ${hhmm(el.debut)} à ${finTexte(el.fin)}`}, ${l.nom}`;
    if (el.rep) d += ', ' + REPET[el.rep.freq].toLowerCase();
    if (el.type === 'libre') d += ', ' + ETAT_LIBRE[etatLibre(o)];
    if (el.type === 'sansecran') d += ', ' + ETAT_ECRAN[etatSansEcran(o)];
    if (el.type === 'tache') d += o.fait ? ', faite' : S.partis[o.cle] ? ', laissée partir' : ', à faire';
    const p = S.payes[o.cle];
    if (p && p.pts) d += `, +${p.pts} points gagnés`;
    else if (el.type === 'tache' && !prevue(o)) d += ', ne rapporte pas de points (ajoutée le jour même)';
    else if (el.type === 'tache') d += `, rapporte ${valeur(el)} points`;
    return d;
  }
  // Ce que rapporte un élément, à droite de sa ligne
  function ptsElement(o) {
    if (o.el.type === 'evenement') return '';
    const p = S.payes[o.cle];
    if (p) return p.pts ? `<span class="pts gagne" aria-hidden="true">+${p.pts}</span>` : `<span class="pts nul" aria-hidden="true">0 pt</span>`;
    if (o.el.type === 'tache' && !o.fait && S.partis[o.cle]) return `<span class="pts nul" aria-hidden="true">🍃</span>`;
    if (o.el.type === 'tache' && !prevue(o)) return `<span class="pts nul" aria-hidden="true">0 pt</span>`;
    if (o.el.type === 'libre' && etatLibre(o) === 'grignote') return `<span class="pts nul" aria-hidden="true">grignoté</span>`;
    return `<span class="pts" aria-hidden="true">+${valeur(o.el)} pts</span>`;
  }
  const rondCoche = (cle, coche, label, attr) => `<button type="button" class="rond-coche" role="checkbox" aria-checked="${coche}" ${attr}="${esc(cle)}" aria-label="${esc(label)}" data-focus="${attr.replace('data-', '')}${esc(cle)}">${ICONE.coche}</button>`;
  function sousTitre(o) {
    const el = o.el;
    if (el.type === 'libre') return `${plage(el)} · Pour moi · ${ETAT_LIBRE[etatLibre(o)]}`;
    if (el.type === 'sansecran') return `${plage(el)} · Sans écran · ${ETAT_ECRAN[etatSansEcran(o)]}`;
    if (el.type === 'evenement') return `${plage(el)}${el.finLe ? ` · jour ${ecart(el.date, o.k) + 1}/${ecart(el.date, el.finLe) + 1}` : ''} · Événement`;
    const ob = el.objectif && S.objectifs.find(x => x.id === el.objectif);
    return `${plage(el)} · ${cat(el.cat).nom}${!o.fait && courage(el) ? ` · 🔥 repoussée ${el.reports} fois` : ''}${!o.fait && S.partis[o.cle] ? ' · laissée partir' : ''}${ob ? ' · 🎯 ' + ob.titre : ''}`;
  }
  // Ligne d'un élément. cocheGauche : la case à gauche (accueil), sinon à droite après l'icône (calendrier)
  function ligneOcc(o, cocheGauche) {
    const el = o.el, l = look(el);
    const coche = el.type === 'tache' ? rondCoche(o.cle, o.fait, `${el.titre} : ${o.fait ? 'faite' : 'à faire'}`, 'data-cocher') : '';
    const ouvrir = `<button type="button" class="ouvrir" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}" data-focus="o${o.cle}">
        ${cocheGauche ? '' : `<span class="tuile" style="--c:${l.couleur}" aria-hidden="true">${l.icone}</span>`}
        <span class="quoi" aria-hidden="true"><b>${esc(el.titre)}</b><small>${esc(sousTitre(o))}</small></span>${ptsElement(o)}</button>`;
    return `<div class="carte ligne${o.fait ? ' faite' : ''}${U.repere === o.cle ? ' repere' : ''}" style="--c:${l.couleur}"${el.type === 'tache' ? ` data-glisse="${o.cle}"` : ''}>
      ${cocheGauche ? (coche || `<span class="tuile petite" style="--c:${l.couleur}" aria-hidden="true">${l.icone}</span>`) : ''}${ouvrir}${cocheGauche ? '' : coche}</div>`;
  }
  function ligneHabitude(h, k, cocheGauche) {
    const fait = !!h.faits[k], c = cat(h.cat), s = serieHabitude(h);
    const p = S.payes[cleHab(h, k)];
    const pts = p && p.pts ? `<span class="pts gagne" aria-hidden="true">+${p.pts}</span>` : `<span class="pts" aria-hidden="true">+${ptsHabitude(h, k)} pts</span>`;
    const coche = rondCoche(h.id + '|' + k, fait, `${titreHabitude(h, k)}, habitude : ${fait ? 'faite' : 'à faire'}`, 'data-habitude');
    return `<div class="carte ligne${fait ? ' faite' : ''}" style="--c:${c.couleur}">
      ${cocheGauche ? coche : ''}
      <button type="button" class="ouvrir" data-ouvrir-hab="${h.id}" aria-label="${esc(h.titre)}, habitude ${esc(c.nom)}, série de ${pluriel(s, 'jour')}, ${fait ? 'faite' : 'à faire'} : ouvrir" data-focus="oh${h.id}">
        ${cocheGauche ? '' : `<span class="tuile" style="--c:${c.couleur}" aria-hidden="true">${c.icone}</span>`}
        <span class="quoi" aria-hidden="true"><b>${esc(titreHabitude(h, k))}</b><small>${difficile(k) ? 'Version mini' : 'Habitude'} · ${esc(c.nom)}${s ? ` · 🔥 ${s} j` : ''}</small></span>${pts}</button>
      ${cocheGauche ? '' : coche}</div>`;
  }

  // ---------- Accueil ----------
  // Petite courbe du total de points sur 14 jours (décor : le nombre est écrit à côté)
  function courbePoints() {
    const auj = aujourdhui(), jours = Array.from({ length: 14 }, (_, i) => decaler(auj, i - 13));
    let total = S.points;
    const valeurs = [];
    for (let i = jours.length - 1; i >= 0; i--) { valeurs[i] = total; total -= gainDuJour(jours[i]); }
    const min = Math.min(...valeurs), max = Math.max(...valeurs), et = max - min || 1;
    const plat = max === min;
    const pts = valeurs.map((v, i) => [3 + i / 13 * 194, plat ? 46 - 10 * Math.sin(i / 13 * Math.PI * 1.6) - i * 1.2 : 62 - (v - min) / et * 46]);
    const ligne = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
    const doux = pts.map((p, i) => { if (!i) return `M${p[0].toFixed(1)} ${p[1].toFixed(1)}`; const q = pts[i - 1], m = (q[0] + p[0]) / 2; return `C${m.toFixed(1)} ${q[1].toFixed(1)} ${m.toFixed(1)} ${p[1].toFixed(1)} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`; }).join('');
    const fin = pts[13];
    return `<svg class="courbe" viewBox="0 -8 200 86" preserveAspectRatio="none" aria-hidden="true"><defs>
      <linearGradient id="cp-f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="cp-l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff"/></linearGradient>
      <filter id="cp-g" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
      <path d="${doux}L197 78L3 78z" fill="url(#cp-f)"/>
      <path d="${doux}" fill="none" stroke="url(#cp-l)" stroke-width="5" filter="url(#cp-g)" opacity=".8" vector-effect="non-scaling-stroke"/>
      <path d="${doux}" fill="none" stroke="url(#cp-l)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      <circle cx="${fin[0].toFixed(1)}" cy="${fin[1].toFixed(1)}" r="1.6" fill="#fff"/></svg>`;
  }
  function aValider() {
    const auj = aujourdhui(), res = [];
    for (let i = CONFIG.validation; i >= 0; i--) duJour(decaler(auj, -i)).forEach(o => { if (o.el.type === 'sansecran' && etatSansEcran(o) === 'a-valider') res.push(o); });
    return res;
  }
  // « Ta progression cette semaine » : part des objectifs de la semaine déjà atteinte ; ouvre le bilan en cours
  function carteSemaine() {
    const st = statsSemaine(lundiDe(aujourdhui()));
    if (st.taux == null) return '';
    const pc = Math.round(st.taux * 100), d = st.diff;
    return `<button type="button" class="carte mini sem-carte" data-action="bilan-semaine" data-focus="sem" aria-label="Ta progression cette semaine : ${pc} % de tes objectifs${d == null ? '' : `, ${d > 0 ? '+' : ''}${Math.round(d * 100)} % de points par rapport à la semaine dernière`}. Ouvrir le bilan">
        <span class="titre-mini" aria-hidden="true">📈 Semaine</span><b aria-hidden="true">${pc}<small> %</small></b>
        <small aria-hidden="true">${d == null ? 'des objectifs' : `<b class="${d > .005 ? 'hausse' : d < -.005 ? 'baisse' : ''}">${d > 0 ? '+' : ''}${Math.round(d * 100)} %</b> de points`}</small></button>`;
  }
  function vueAccueil() {
    const auj = aujourdhui(), P = palier(), suiv = palierSuivant(), g = gainDuJour(auj);
    const occs = duJour(auj), habs = S.habitudes.filter(h => habitudeDue(h, auj));
    const prevues = minutesPrevues(auj), plafond = S.reglages.plafond;
    const M = S.minuteur, sd = serieDetail(), s = sd.n, foc = focusEntre(auj, auj);
    const dur = difficile(auj), resteT = occs.filter(o => o.el.type === 'tache' && !o.fait && o.el.debut > minNow()).length;
    const val = aValider();
    return `
      <header class="tete salut">
        <div><h1>Bonjour ${esc(S.profil.prenom || '')}</h1><p>Continue d'avancer.</p></div>
        <button type="button" class="avatar" data-action="profil" aria-label="Profil et réglages" data-focus="profil">${esc((S.profil.initiales || '?').slice(0, 2))}</button>
      </header>
      <section class="points" aria-labelledby="tes-points">
        <h2 class="masque" id="tes-points">Tes points</h2>
        <p class="total"><b class="${U.reaction ? 'monte' : ''}">${nombre(S.points)}</b><small>pts</small>
          <span class="${g ? '' : 'zero'}">${g > 0 ? ICONE.hausse : ''}${g ? (g > 0 ? '+' : '') + nombre(g) : '+0'}<span class="masque"> aujourd'hui</span></span></p>

        <div class="niveau-rang"><p class="niveau palier"><button type="button" data-action="niveaux" data-focus="niveaux" aria-label="Niveau ${niveauIdx() + 1}, ${P.nom}${suiv ? `, encore ${nombre(suiv.seuil - S.points)} points avant ${suiv.nom}` : ''}. Voir les niveaux et les looks">${embleme(P.id)}<b aria-hidden="true">Niveau ${niveauIdx() + 1} · ${P.nom}</b>${suiv ? `<small aria-hidden="true">encore ${nombre(suiv.seuil - S.points)} pts</small>` : ''}</button></p>
        <p class="niveau">${pastilleRecompenses()}</p></div>
      </section>
      ${carteMaintenant()}
      ${carteEnergie(false)}
      ${carteCoach()}
      ${prevues > plafond ? `<div class="carte alerte" role="note"><span class="ic" aria-hidden="true">⚠️</span><p><b>Journée chargée : ${duree(prevues)} prévues</b> pour un plafond de ${duree(plafond)}. Allège ta journée ou garde un moment pour toi.</p></div>` : ''}
      ${val.map(o => `<div class="carte a-valider" style="--c:${JOMO.sansecran.couleur}">
        <p>📵 Moment sans écran terminé : <b>${esc(o.el.titre)}</b>. Tu l'as tenu ?<small>${o.k === auj ? '' : cap(quandJour(o.k)) + ', '}${plage(o.el)} · +${CONFIG.points.sansecran} pts si tenu</small></p>
        <div class="boutons deux"><button type="button" class="bouton petit" data-tenu="${o.cle}" data-focus="tenu${o.cle}">Tenu</button><button type="button" class="bouton petit secondaire" data-pas-tenu="${o.cle}" data-focus="pas${o.cle}">Pas tenu</button></div></div>`).join('')}
      ${dur ? `<section class="carte difficile" aria-labelledby="dur-titre"><h2 id="dur-titre"><span aria-hidden="true">🌧️</span> Jour difficile</h2>
        <p>Fais le minimum : tes habitudes sont en version mini, et ta série continue. Le reste peut attendre.</p>
        <div class="boutons${resteT ? ' deux' : ''}">${resteT ? `<button type="button" class="bouton petit" data-action="alleger" data-focus="alleger">Reporter ${resteT > 1 ? 'mes ' + resteT + ' tâches' : 'ma tâche'} à demain</button>` : ''}
          <button type="button" class="bouton petit secondaire" data-action="fin-difficile" data-focus="dur">Finalement, ça va</button></div></section>` : ''}
      ${cartePasFaites()}
      <section aria-labelledby="auj-titre">
        <div class="section-tete"><h2 id="auj-titre">Aujourd'hui</h2><button type="button" class="lien" data-action="voir-tout" data-focus="voir-tout">Voir tout ${ICONE.fleche}</button></div>
        <div class="lignes">
          ${occs.map(o => ligneOcc(o, true)).join('')}
          ${habs.map(h => ligneHabitude(h, auj, true)).join('')}
          ${!occs.length && !habs.length ? '<p class="carte vide">Rien de prévu aujourd\'hui. Ajoute une tâche, une habitude… ou garde la journée pour toi.</p>' : ''}
        </div>
        ${!dur && (habs.some(h => !h.faits[auj]) || resteT) ? `<button type="button" class="lien dur-lien" data-action="difficile" data-focus="dur">🌧️ Journée difficile ? Passe en version mini</button>` : ''}
      </section>
      ${cartePriorites()}
      ${rappelChange()}
      <div class="duo${carteSemaine() ? ' trio' : ''}">
        ${carteSemaine()}
        <button type="button" class="carte mini" data-action="serie" data-focus="serie" aria-label="Série actuelle : ${pluriel(s, 'jour')} d'affilée avec toutes tes habitudes. Meilleure : ${pluriel(Math.max(S.meilleureSerie, s), 'jour')}.">
          <span class="titre-mini" aria-hidden="true">🔥 Série</span><b aria-hidden="true">${s} j</b><small aria-hidden="true">${sd.pardons.length && ecart(sd.pardons[0], auj) < CONFIG.pardon ? '🛟 1 jour pardonné' : 'Meilleure : ' + Math.max(S.meilleureSerie, s) + ' j'}</small></button>
        <button type="button" class="carte mini" data-action="minuteur" data-focus="minuteur" aria-label="${M ? 'Concentration en cours : ouvrir le minuteur' : `Concentration : ${duree(foc.total)} aujourd'hui. Lancer une session`}">
          <span class="titre-mini" aria-hidden="true">⏱️ Focus</span>
          <b aria-hidden="true" ${M ? 'data-reste-mini' : ''}>${M ? texteMinuteurCourt() : duree(foc.total)}</b>
          <small aria-hidden="true">${M ? ({ travail: 'Session en cours', pause: 'Pause', pret: 'Prêt à reprendre' }[M.phase]) : 'Lancer une session'}</small></button>
      </div>
      ${carteIdentites()}
      ${carteEnergie(true)}`;
  }
  // ---------- Calendrier ----------
  function vueCalendrier() {
    const v = S.vueCal === 'jour' ? 'jour' : S.vueCal === 'mois' ? 'mois' : 'semaine';
    return `
      <header class="tete">
        <div><h1>Calendrier</h1><p>Planifie. Organise. Réussis.</p></div>
        <div class="actions-tete">
          <button type="button" class="icone-bouton" data-action="chercher" aria-label="Chercher" aria-keyshortcuts="/" data-focus="chercher">${ICONE.loupe}</button>
          <button type="button" class="icone-bouton" data-action="aujourdhui" aria-label="Aujourd'hui" data-focus="auj">${ICONE.calendrier}</button>
        </div>
      </header>
      <div class="segments" role="group" aria-label="Affichage">
        <button type="button" aria-pressed="${v === 'semaine'}" data-vue-cal="semaine" data-focus="vc-semaine">Semaine</button>
        <button type="button" aria-pressed="${v === 'jour'}" data-vue-cal="jour" data-focus="vc-jour">Jour</button>
        <button type="button" aria-pressed="${v === 'mois'}" data-vue-cal="mois" data-focus="vc-mois">Mois</button>
      </div>
      ${v === 'mois' ? vueMois() : v === 'jour' ? vueJour() : vueSemaine()}`;
  }

  // Mois : la grille de la maquette, avec des points sous les jours, et la liste du jour choisi en dessous
  function vueMois() {
    const k = U.date, d = parse(k), auj = aujourdhui();
    const premier = dk(new Date(d.getFullYear(), d.getMonth(), 1));
    const debut = lundiDe(premier);
    const nom = cap(d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }));
    let cases = '';
    for (let i = 0; i < 42; i++) {
      const j = decaler(debut, i);
      if (i === 35 && j.slice(0, 7) !== k.slice(0, 7)) break;      // pas de 6e ligne vide
      const occs = duJour(j);
      const couleurs = [];
      occs.forEach(o => { const c = look(o.el).couleur; if (!couleurs.includes(c)) couleurs.push(c); });
      const charge = minutesPrevues(j) > S.reglages.plafond;
      const n = occs.length;
      cases += `<button type="button" class="jour-m${j.slice(0, 7) !== k.slice(0, 7) ? ' dehors' : ''}${j === auj ? ' auj' : ''}${charge ? ' charge' : ''}" data-choisir="${j}" aria-pressed="${j === k}" data-focus="m${j}"
        aria-label="${jourLong(j)}${j === auj ? ", aujourd'hui" : ''}${n ? ', ' + pluriel(n, 'élément') : ''}${charge ? ', journée chargée' : ''}">
        <span class="n" aria-hidden="true">${parse(j).getDate()}</span>${couleurs.length ? `<span class="pts-j" aria-hidden="true">${couleurs.slice(0, 3).map(c => `<i style="--c:${c}"></i>`).join('')}</span>` : ''}</button>`;
    }
    const occs = duJour(k), habs = S.habitudes.filter(h => habitudeDue(h, k));
    const m = minutesPrevues(k);
    return `
      <section class="carte" aria-labelledby="mois-nom">
        <div class="cal-tete">
          <button type="button" class="icone-bouton" data-nav="-1" aria-label="Mois précédent" data-focus="nav-1">${ICONE.gauche}</button>
          <h2 id="mois-nom" aria-live="polite">${esc(nom)}</h2>
          <button type="button" class="icone-bouton" data-nav="1" aria-label="Mois suivant" data-focus="nav1">${ICONE.droite}</button>

        <div class="lignes">
          ${occs.map(o => ligneOcc(o, false)).join('')}

  }

  // Jour : la grille horaire, avec les gestes (toucher un vide, appui long, glisser, poignées)
  function disposer(liste) {
    const items = liste.map(o => ({ o, d: o.el.debut, f: Math.max(o.el.fin, o.el.debut + Math.ceil(HMIN / H * 60)) })).sort((a, b) => a.d - b.d || b.f - a.f);
    const res = [];
    let groupe = [], finGroupe = -1;
    const fermer = () => { const n = Math.max(...groupe.map(g => g.col)) + 1; groupe.forEach(g => { g.n = n; res.push(g); }); groupe = []; };
    items.forEach(it => {
      if (groupe.length && it.d >= finGroupe) fermer();
      const fins = [];
      groupe.forEach(g => { fins[g.col] = Math.max(fins[g.col] || 0, g.f); });
      let c = 0;
      while (fins[c] != null && fins[c] > it.d) c++;
      it.col = c;
      groupe.push(it);
      finGroupe = Math.max(finGroupe, it.f);
    });
    if (groupe.length) fermer();
    return res;
  }
  // Le rectangle d'un élément dans la grille : barre de couleur, titre, heures ; grand, il montre aussi la durée et les points
  function bloc(g) {
    const o = g.o, el = o.el, l = look(el);
    const haut = el.debut / 60 * H, hauteur = Math.max((el.fin - el.debut) / 60 * H, HMIN);
    const court = hauteur < 42, grand = hauteur >= 76;
    const choisi = U.selection === o.cle;
    const etat = el.type === 'libre' ? etatLibre(o) : el.type === 'sansecran' ? etatSansEcran(o) : null;
    const p = S.payes[o.cle], e = S.enCours && S.enCours.cle === o.cle && !o.fait;
    const pied = el.type === 'tache' && !o.fait ? `${duree(el.fin - el.debut)}${prevue(o) ? ` · +${valeur(el)} pts` : ''}` : el.type !== 'tache' ? duree(el.fin - el.debut) : '';
    return `<div class="bloc ${el.type}${etat === 'grignote' ? ' grignote' : ''}${o.fait ? ' fait' : ''}${court ? ' court' : ''}${grand ? ' grand' : ''}${e ? ' encours' : ''}${choisi ? ' choisi' : ''}${U.repere === o.cle ? ' repere' : ''}" data-cle="${o.cle}"
        style="top:${haut}px;height:${hauteur}px;left:calc(${g.col / g.n * 100}% + 2px);width:calc(${100 / g.n}% - 4px);--c:${l.couleur}">
      <button type="button" class="b-ouvrir" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}${e ? ', en cours' : ''}" data-focus="o${o.cle}"></button>
      ${el.type === 'tache' ? rondCoche(o.cle, o.fait, `${el.titre} : ${o.fait ? 'faite' : 'à faire'}`, 'data-cocher') : ''}
      <span class="b-texte" aria-hidden="true"><b><i class="b-ic">${l.icone}</i> ${esc(el.titre)}</b><small>${e ? 'En cours · depuis ' + hhmm(el.debut) : `${hhmm(el.debut)}${court ? '' : ' – ' + finTexte(el.fin)}${etat ? ' · ' + (el.type === 'libre' ? ETAT_LIBRE[etat] : ETAT_ECRAN[etat]) : ''}${!court && !grand && el.type === 'tache' && !o.fait && prevue(o) ? `<i class="b-plus"> · +${valeur(el)} pts</i>` : ''}`}</small></span>
      ${grand && pied && !(p && p.pts) ? `<span class="b-pied" aria-hidden="true">${pied}</span>` : ''}
      ${p && p.pts ? `<span class="gain" aria-hidden="true">+${p.pts}</span>` : ''}
      <span class="bord" data-bord="bas" aria-hidden="true"></span>
      ${choisi ? '<span class="poignee haut" data-bord="haut" aria-hidden="true"></span><span class="poignee bas" data-bord="bas" aria-hidden="true"></span>' : ''}
    </div>`;
  }
  function blocBrouillon(b) {
    const hauteur = Math.max((b.fin - b.debut) / 60 * H, HMIN);
    return `<div class="bloc brouillon${hauteur < 42 ? ' court' : ''}" data-brouillon="1" style="top:${b.debut / 60 * H}px;height:${hauteur}px;left:2px;width:calc(100% - 4px)">
      <button type="button" class="b-ouvrir" data-action="remplir" aria-label="Nouvelle plage de ${hhmm(b.debut)} à ${finTexte(b.fin)} : toucher pour la remplir" data-focus="brouillon"></button>
      <span class="b-texte" aria-hidden="true"><b>Nouvelle</b><small>${hhmm(b.debut)} – ${finTexte(b.fin)}</small></span>
      <span class="poignee haut" data-bord="haut" aria-hidden="true"></span><span class="poignee bas" data-bord="bas" aria-hidden="true"></span>
    </div>`;
  }
  function grille(jours) {
    const auj = aujourdhui(), mn = jours.includes(auj) ? minNow() : -99;
    let h = '';
    for (let i = 1; i < 24; i++) h += `${Math.abs(i * 60 - mn) < 14 ? '' : `<div class="heure" style="top:${i * H}px">${hhmm(i * 60)}</div>`}<div class="trait-h" style="top:${i * H}px"></div>`;
    const cols = jours.map(k => {
      const blocs = disposer(duJour(k).filter(o => !o.el.flou)).map(bloc).join('');
      const br = U.brouillon && U.brouillon.k === k ? blocBrouillon(U.brouillon) : '';
      return `<div class="colonne${k === auj ? ' auj' : ''}" data-jour="${k}">${blocs}${br}</div>`;
    }).join('');
    const ligne = mn < 0 ? '' : `<div class="maintenant" style="top:${mn / 60 * H}px"><span>${hhmm(mn)}</span></div>`;
    return `<div class="grille">${h}<div class="colonnes" style="--n:${jours.length}" role="group" aria-label="Grille horaire : toucher un créneau vide pour y poser une plage">${cols}</div>${ligne}</div><div class="bas-espace"></div>`;
  }
  function bandeSemaine(k) {
    const l = lundiDe(k), auj = aujourdhui();
    return Array.from({ length: 7 }, (_, i) => {
      const d = decaler(l, i), n = duJour(d).length;
      return `<button type="button" class="jour-b${d === auj ? ' auj' : ''}" data-aller="${d}" aria-pressed="${d === k}" data-focus="j${d}"

  function vueJour() {

      <button type="button" class="fab" data-action="ajouter" aria-label="Ajouter une tâche" data-focus="fab">${ICONE.plus}</button>
    </div>`;
  }

  // ---------- Paysage : le calendrier seul, en plein écran (la vue en cours, en grand) ----------
  const MQ_PAYSAGE = window.matchMedia('(orientation: landscape) and (max-height: 520px)');
  const paysage = () => MQ_PAYSAGE.matches;
  function moisPaysage() {
    const k = U.date, d = parse(k), auj = aujourdhui();
    const debut = lundiDe(dk(new Date(d.getFullYear(), d.getMonth(), 1)));
    const jours = [];
    for (let i = 0; i < 42; i++) { const j = decaler(debut, i); if (i === 35 && j.slice(0, 7) !== k.slice(0, 7)) break; jours.push(j); }
    const rangs = jours.length / 7;

    const hApp = ($('.app') || {}).clientHeight || window.innerHeight;
    const place = Math.max(1, Math.floor(((hApp - 78) / rangs - 4 - 8 - 18) / 17));
    const cases = jours.map(j => {
      const occs = duJour(j), charge = minutesPrevues(j) > S.reglages.plafond;
      const montrees = occs.slice(0, place);
      const reste = occs.length - montrees.length;
      return `<button type="button" class="case-m${j.slice(0, 7) !== k.slice(0, 7) ? ' dehors' : ''}${j === auj ? ' auj' : ''}"${j === k ? ' aria-current="date"' : ''} data-ouvrir-jour="${j}" data-focus="pm${j}"
          aria-label="${jourLong(j)}${j === auj ? ", aujourd'hui" : ''}${occs.length ? ' : ' + occs.map(o => `${o.el.titre} à ${hhmm(o.el.debut)}${o.fait ? ', faite' : ''}`).join(' ; ') : ', rien de prévu'}${charge ? ', journée chargée' : ''}. Voir la journée">
        <span class="n" aria-hidden="true"><span>${parse(j).getDate()}</span>${reste ? `<em class="encore">+${reste}</em>` : ''}${charge ? '<i>⚠︎</i>' : ''}</span>
        ${montrees.map(o => `<span class="chip${o.fait ? ' fait' : ''}" style="--c:${look(o.el).couleur}" aria-hidden="true">${o.el.type === 'tache' ? '' : look(o.el).icone + ' '}${esc(o.el.titre)}</span>`).join('')}</button>`;
    }).join('');
    return `<div class="pay-mois" style="--rangs:${rangs}" data-balayage="mois">${JOURS_LONGS.map(n => `<span class="jsem" aria-hidden="true">${n.slice(0, 3)}</span>`).join('')}${cases}</div>`;
  }
  // Téléphone couché, vue Jour : toute la journée tient à l'écran, sans défiler.
  // De 7 h à 23 h, élargi si une plage commence plus tôt ou finit plus tard ; la hauteur d'une heure s'y ajuste.
  const joursPaysage = () => S.vueCal === 'semaine' ? Array.from({ length: 7 }, (_, i) => decaler(lundiDe(U.date), i)) : [U.date];
  function reglerHeure(ajuste) {
    PLAGE.ajuste = ajuste;
    if (!ajuste) { H = CONFIG.heure; HMIN = 30; }
    else {
      const jours = joursPaysage();
      const l = [].concat(...jours.map(k => duJour(k).filter(o => !o.el.flou).map(o => o.el)));
      if (U.brouillon && jours.includes(U.brouillon.k)) l.push(U.brouillon);
      PLAGE.a = Math.min(7, ...l.map(e => Math.floor(e.debut / 60)));
      PLAGE.b = Math.max(23, ...l.map(e => Math.ceil(e.fin / 60)));
      const dispo = PLAGE.dispo || (($('.app') || {}).clientHeight || window.innerHeight) - 66;
      H = Math.max(12, (dispo - 14) / (PLAGE.b - PLAGE.a));
      HMIN = 14;
    }
    document.documentElement.style.setProperty('--H', H + 'px');
  }
  function vuePaysage() {
    const sem = S.vueCal === 'semaine', jour = S.vueCal === 'jour', k = U.date, auj = aujourdhui();
    const titre = sem ? 'Semaine ' + texteSemaine(lundiDe(k)) : jour ? (k === auj ? "Aujourd'hui · " : '') + jourLong(k) : cap(parse(k).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }));
    const nomNav = sem ? 'Semaine' : jour ? 'Jour' : 'Mois';
    const m = minutesPrevues(k), pl = S.reglages.plafond;
    return `<h1 class="masque">Calendrier</h1>
      <div class="pay"${jour ? ' data-balayage="jour"' : ''}>
        <div class="pay-barre">
          <button type="button" class="icone-bouton" data-nav="-1" aria-label="${nomNav} précédent${sem ? 'e' : ''}" data-focus="nav-1">${ICONE.gauche}</button>
          <h2 aria-live="polite">${esc(titre)}</h2>
          <button type="button" class="icone-bouton" data-nav="1" aria-label="${nomNav} suivant${sem ? 'e' : ''}" data-focus="nav1">${ICONE.droite}</button>
          ${jour ? `<div class="jauge${m > pl ? ' depasse' : ''}" role="img" aria-label="${duree(m)} de tâches prévues sur un plafond de ${duree(pl)}${m > pl ? ' : journée chargée' : ''}"><small aria-hidden="true"><b>${duree(m)}</b> / ${duree(pl)}</small><span class="barre" aria-hidden="true"><i style="width:${Math.min(100, m / pl * 100)}%"></i></span></div>` : ''}

            <button type="button" aria-pressed="${jour}" data-vue-cal="jour" data-focus="vc-jour">Jour</button>

          <button type="button" class="icone-bouton" data-action="chercher" aria-label="Chercher" data-focus="chercher">${ICONE.loupe}</button>
        </div>
        ${sem ? `<div class="sem7-tete" aria-hidden="true">${joursPaysage().map((j, i) => { const m7 = minutesPrevues(j), fl = duJour(j).filter(o => o.el.flou).length; return `<span class="${j === auj ? 'auj' : ''}${m7 > pl ? ' charge' : ''}">${JOURS_COURTS_3[i]} <b>${parse(j).getDate()}</b>${fl ? `<i>+${fl}</i>` : ''}</span>`; }).join('')}</div>
          <div class="defile ajuste sem7" data-defile="jour">${grille(joursPaysage())}</div>`
          : jour ? `<div class="defile ajuste" data-defile="jour">${grille([k])}</div>

  // ---------- Objectifs : habitudes et long terme ----------
  function joursTexte(h) {

    if (j.join() === '0,1,2,3,4') return 'En semaine';

  }
  // Les 7 derniers jours d'une habitude : fait, pas fait, pas prévu

      const k = decaler(auj, i - 6);
      return `<i class="${!habitudeDue(h, k) ? 'non' : h.faits[k] ? 'ok' : ''}" style="--c:${cat(h.cat).couleur}"></i>`;

  function ligneHabitudeGestion(h) {

      <button type="button" class="ouvrir" data-ouvrir-hab="${h.id}" data-focus="oh${h.id}"

        <span class="quoi" aria-hidden="true"><b>${esc(h.titre)}</b><small>${joursTexte(h)}${s ? ` · 🔥 ${s} j` : ''}</small>${histo(h)}</span></button>
      ${due ? rondCoche(h.id + '|' + auj, fait, `${h.titre}, aujourd'hui : ${fait ? 'faite' : 'à faire'}`, 'data-habitude') : '<span class="pts nul">repos</span>'}
    </div>`;
  }
  function carteObjectif(ob) {
    const a = avancement(ob), c = cat(ob.cat), atteint = !!ob.atteintLe;
    const ech = ob.echeance ? (ob.echeance < aujourdhui() ? `échéance passée (${fmt(ob.echeance, { day: 'numeric', month: 'short' })})` : ob.echeance === aujourdhui() ? "échéance aujourd'hui" : `dans ${pluriel(ecart(aujourdhui(), ob.echeance), 'jour')}`) : 'sans échéance';
    const nE = ob.etapes.length, fE = ob.etapes.filter(e => e.faitLe).length, nT = a.taches.length, fT = a.taches.filter(o => o.fait).length;
    const detail = [nE ? `${fE}/${nE} étapes` : '', nT ? `${fT}/${nT} tâches` : ''].filter(Boolean).join(' · ') || 'Ajoute des étapes';
    return `<button type="button" class="carte obj-carte${atteint ? ' atteint' : ''}" data-ouvrir-obj="${ob.id}" data-focus="ob${ob.id}"
        aria-label="${esc(ob.titre)}, ${esc(c.nom)}, ${a.pc} %${atteint ? ', atteint' : ''}, ${detail}, ${ech} : ouvrir">
      <span class="haut" aria-hidden="true"><span class="tuile" style="--c:${c.couleur}">${c.icone}</span>

  }
  function vueObjectifs() {
    const hab = S.vueObj !== 'long';
    const sd = serieDetail(), s = sd.n, best = Math.max(S.meilleureSerie, s), auj = aujourdhui();
    const recent = sd.pardons.find(k => ecart(k, auj) < CONFIG.pardon);
    const habs = habitudesActives();
    const dues = habs.filter(h => habitudeDue(h, auj)), faites = dues.filter(h => h.faits[auj]).length;
    return `
      <header class="tete"><div><h1>Objectifs</h1><p>Construis tes habitudes, vise loin.</p></div></header>
      <div class="segments" role="group" aria-label="Affichage">
