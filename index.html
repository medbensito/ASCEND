<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ASCEND</title>
<meta name="description" content="ASCEND : ton développement personnel et ton JOMO, jour après jour. Make everyday matter.">
<meta name="theme-color" content="#050616">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASCEND">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<style>
/* ===== ASCEND : couleurs, typo, fond ===== */
:root {
  --fond: #050616;
  --fond-2: #0a0c22;
  --carte: #0f1130;
  --carte-2: #15183f;
  --carte-3: #1b1f4d;
  --trait: rgba(129, 140, 255, .16);
  --trait-fort: rgba(129, 140, 255, .34);
  --texte: #f3f4ff;
  --doux: #a3a8d4;
  --pale: #7d82ad;
  --bleu: #4f6bff;
  --violet: #8b4dff;
  --accent: linear-gradient(135deg, #4f6bff 0%, #7a4dff 100%);
  --accent-texte: #8a9dff;
  --anneau: #5a5fd6;
  --vert: #3ee08f;
  --orange: #ffb547;
  --rouge: #ff5d73;
  --jomo: #2fd3c5;
  --ecran: #57c3ff;
  --focus: #9fb0ff;
  --H: 60px;
  --rayon: 18px;
  --haut-sur: env(safe-area-inset-top, 0px);
  --bas-sur: env(safe-area-inset-bottom, 0px);
  --police: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
/* Une app, pas une page : on ne pince pas pour zoomer, le double toucher ne zoome pas */
html { touch-action: pan-x pan-y; }
body {
  font-family: var(--police);
  color: var(--texte);
  background-color: var(--fond);
  background-image:
    radial-gradient(120% 60% at 110% -10%, rgba(123, 77, 255, .28), transparent 60%),
    radial-gradient(90% 55% at -20% 105%, rgba(79, 107, 255, .22), transparent 60%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  font-size: 15px;
  line-height: 1.35;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
.masque { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
h1, h2, h3, p { margin: 0; }

/* ===== Structure : écran + onglets du bas ===== */
/* L'app occupe la partie visible de l'écran (l'iPhone la décale parfois après le clavier : on la suit) */
.app { position: fixed; top: var(--app-haut, 0px); bottom: var(--app-bas, 0px); left: 0; right: 0; max-width: 640px; margin: 0 auto;
  display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; }
html.clavier { --bas-sur: 0px; }
.ecran { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; outline: none;
  padding: calc(var(--haut-sur) + 18px) max(18px, env(safe-area-inset-right)) 28px max(18px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.ecran > * { flex-shrink: 0; }
.ecran.plein { overflow: hidden; padding-bottom: 0; }
.ecran.plein > .cal-jour { flex-shrink: 1; }
.onglets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 10px calc(var(--bas-sur) + 8px);
  background: rgba(6, 7, 22, .92); border-top: 1px solid var(--trait); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.onglet { display: grid; justify-items: center; gap: 3px; padding: 7px 2px 6px; border: 0; background: none; color: var(--pale); border-radius: 14px;
  font-size: 11px; font-weight: 600; letter-spacing: .01em; min-height: 52px; }
.onglet svg { width: 24px; height: 24px; }
.onglet[aria-current="page"] { color: #6f88ff; background: rgba(79, 107, 255, .14); }
.onglet[aria-current="page"] svg { filter: drop-shadow(0 0 8px rgba(91, 124, 255, .7)); }

/* ===== Textes d'en-tête ===== */
.tete { display: flex; align-items: flex-start; gap: 12px; }
.tete > div { flex: 1; min-width: 0; }
.tete h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.12; }
.tete p { color: var(--doux); font-size: 15px; margin-top: 4px; }
.tete .actions-tete { display: flex; gap: 8px; flex: none; }
.icone-bouton { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--trait); background: rgba(21, 24, 63, .6); color: var(--texte);
  display: grid; place-items: center; padding: 0; flex: none; }
.icone-bouton svg { width: 22px; height: 22px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--trait-fort); background: radial-gradient(circle at 30% 25%, #2a2f6e, #14173d);
  color: var(--texte); font-weight: 700; font-size: 14px; letter-spacing: .02em; display: grid; place-items: center; flex: none; }
.section-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.section-tete h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.lien { border: 0; background: none; color: var(--doux); font-size: 13px; font-weight: 600; padding: 8px 4px; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; white-space: nowrap; flex: none; }
.lien svg { width: 14px; height: 14px; }
.lien.fort { color: var(--accent-texte); }
.lien.danger { color: var(--rouge); }

/* ===== Cartes ===== */
.carte { background: linear-gradient(180deg, rgba(26, 29, 70, .82), rgba(14, 16, 42, .9)); border: 1px solid var(--trait); border-radius: var(--rayon);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 10px 30px rgba(0, 0, 0, .25); }
.carte.pad { padding: 16px; }
.vide { color: var(--doux); text-align: center; padding: 22px 16px; font-size: 14px; line-height: 1.5; }

/* ===== Boutons ===== */
.bouton { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border: 0; border-radius: 16px;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; box-shadow: 0 10px 26px rgba(91, 100, 255, .35), inset 0 1px 0 rgba(255, 255, 255, .18); width: 100%; }
.bouton svg { width: 20px; height: 20px; }
.bouton:disabled { opacity: .45; box-shadow: none; }
.bouton.secondaire { background: rgba(33, 37, 88, .7); border: 1px solid var(--trait-fort); box-shadow: none; color: var(--texte); }
.bouton.danger { background: rgba(255, 93, 115, .12); border: 1px solid rgba(255, 93, 115, .45); color: #ff8a9a; box-shadow: none; }
.bouton.petit { min-height: 44px; font-size: 15px; border-radius: 14px; }
.boutons { display: grid; gap: 10px; }
.boutons.deux { grid-template-columns: 1fr 1fr; }

/* ===== Segments (7j / 30j / 90j, Mois / Jour…) ===== */
.segments { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: rgba(15, 17, 48, .9); border: 1px solid var(--trait); }
.segments button { border: 0; background: none; color: var(--doux); font-weight: 600; font-size: 14px; border-radius: 12px; min-height: 40px; padding: 0 8px; }
.segments button[aria-pressed="true"], .segments button[aria-selected="true"] { background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(91, 100, 255, .35); }

/* ===== Interrupteur ===== */
.interrupteur { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
.interrupteur input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.interrupteur i { position: absolute; inset: 0; border-radius: 16px; background: #2a2d55; border: 1px solid var(--trait-fort); transition: background .2s; }
.interrupteur i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px; border-radius: 50%; background: #c9cbe6; transition: transform .2s, background .2s; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.interrupteur input:checked + i { background: var(--accent); border-color: transparent; }
.interrupteur input:checked + i::after { transform: translateX(20px); background: #fff; }
.interrupteur input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ===== Cases à cocher rondes ===== */
.rond-coche { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--anneau); background: rgba(10, 12, 34, .6); padding: 0; display: grid; place-items: center; color: transparent; flex: none; }
.rond-coche svg { width: 16px; height: 16px; }
.rond-coche[aria-checked="true"] { background: var(--accent); border-color: #8f9bff; color: #fff; box-shadow: 0 0 14px rgba(110, 120, 255, .6); }
.rond-coche:disabled { opacity: .5; }
/* Cible tactile élargie */
.rond-coche { position: relative; }
.rond-coche::before { content: ""; position: absolute; inset: -8px; }

/* ===== Lignes (tâches, habitudes) ===== */
.lignes { display: grid; gap: 10px; }
.ligne { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; }
.ligne .ouvrir { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; text-align: left; color: inherit; min-height: 40px; }
.ligne .quoi { flex: 1; min-width: 0; display: grid; gap: 2px; }
.ligne .quoi b { font-weight: 650; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ligne .quoi small { color: var(--doux); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ligne .pts { color: var(--accent-texte); font-weight: 700; font-size: 14px; white-space: nowrap; flex: none; }
.ligne .pts.gagne { color: var(--vert); }
.ligne .pts.nul { color: var(--pale); font-weight: 600; }
.ligne.faite .quoi b { color: var(--doux); text-decoration: line-through; text-decoration-color: rgba(163, 168, 212, .6); }
.tuile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 21px; flex: none; background: color-mix(in srgb, var(--c, #5a5fd6) 18%, #0d0f2a); border: 1px solid color-mix(in srgb, var(--c, #5a5fd6) 40%, transparent); }
.tuile.petite { width: 32px; height: 32px; border-radius: 10px; font-size: 17px; }
.puce-cat { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }

/* ===== Toast ===== */
.toast { position: fixed; left: 50%; top: calc(var(--haut-sur) + 12px); transform: translate(-50%, calc(-100% - 40px)); z-index: 50; max-width: min(92vw, 520px);
  background: rgba(24, 27, 66, .96); border: 1px solid var(--trait-fort); color: var(--texte); padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 14px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, .45); transition: transform .3s ease, opacity .3s ease, visibility .3s; pointer-events: none; text-align: center; opacity: 0; visibility: hidden; }
.toast:empty { display: none; }
.toast.visible { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

/* ===== Lancement ===== */
.lancement { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--fond);
  background-image: radial-gradient(80% 50% at 100% 0%, rgba(123, 77, 255, .35), transparent 60%), radial-gradient(80% 50% at 0% 100%, rgba(79, 107, 255, .3), transparent 60%);
  transition: opacity .45s ease, visibility .45s; }
.lancement.parti { opacity: 0; visibility: hidden; }
.marque { display: grid; justify-items: center; gap: 18px; text-align: center; }
.marque svg { width: 108px; height: 108px; filter: drop-shadow(0 0 24px rgba(110, 120, 255, .55)); }
.marque b { font-size: 34px; font-weight: 300; letter-spacing: .42em; margin-right: -.42em; }
.marque small { color: var(--doux); font-size: 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* ===== Accueil ===== */
.salut h1 { font-size: 27px; }
.points { position: relative; overflow: hidden; padding: 18px 18px 58px; min-height: 150px;
  background: radial-gradient(120% 120% at 100% 0%, rgba(123, 77, 255, .35), transparent 55%), linear-gradient(180deg, rgba(28, 31, 76, .9), rgba(14, 16, 44, .95)); }
.points .libelle { display: flex; align-items: center; gap: 8px; color: var(--doux); font-weight: 600; font-size: 14px; }
.points .libelle .etoile { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 181, 71, .14); border: 1px solid rgba(255, 181, 71, .45); }
.points .libelle .etoile svg { width: 15px; height: 15px; color: var(--orange); }
.points .total { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; position: relative; z-index: 1; }
.points .total b { font-size: 40px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.points .total span { color: var(--vert); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 3px; }
.points .total span.zero { color: var(--pale); }
.points .total span svg { width: 13px; height: 13px; }
.points .palier { position: relative; z-index: 1; margin-top: 6px; color: var(--doux); font-size: 13px; }
.points .palier b { color: var(--texte); font-weight: 650; }
.points .embleme { position: absolute; right: 10px; top: 6px; width: 92px; height: 92px; z-index: 1; }
.points .courbe { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 56px; opacity: .95; }
.points .monte { animation: monte .6s ease; }
@keyframes monte { 0% { transform: translateY(6px); opacity: .3; } 100% { transform: none; opacity: 1; } }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { padding: 14px; display: grid; gap: 6px; text-align: left; border: 1px solid var(--trait); color: inherit; min-height: 96px; }
.mini .titre-mini { color: var(--doux); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.mini b { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mini small { color: var(--doux); font-size: 12.5px; }
.alerte { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-color: rgba(255, 181, 71, .45); background: linear-gradient(180deg, rgba(60, 44, 20, .55), rgba(30, 22, 12, .55)); }
.alerte .ic { font-size: 20px; line-height: 1; }
.alerte p { font-size: 14px; color: #ffe2b0; }
.alerte p b { color: #fff; }
.a-valider { display: grid; gap: 10px; padding: 14px; }
.a-valider p { font-size: 14.5px; }
.a-valider p small { display: block; color: var(--doux); font-size: 12.5px; margin-top: 2px; }

/* ===== Calendrier : mois ===== */
.cal-tete { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 12px; }
.cal-tete h2 { font-size: 18px; font-weight: 650; }
.cal-tete .icone-bouton { width: 40px; height: 40px; border: 0; background: none; }
.mois-grille { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; padding: 0 6px 12px; touch-action: pan-y; }
.mois-grille .jsem { text-align: center; color: var(--doux); font-size: 13px; font-weight: 600; padding: 4px 0 8px; }
.jour-m { position: relative; border: 0; background: none; color: var(--texte); height: 46px; display: grid; justify-items: center; align-content: start; gap: 3px; padding: 0; border-radius: 12px; }
.jour-m .n { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-variant-numeric: tabular-nums; }
.jour-m.dehors { color: #5b6090; }
.jour-m.auj .n { color: #8fa2ff; font-weight: 800; }
.jour-m[aria-pressed="true"] .n { background: var(--accent); color: #fff; font-weight: 700; box-shadow: 0 0 0 3px rgba(79, 107, 255, .25), 0 0 18px rgba(110, 100, 255, .75); }
.jour-m .pts-j { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; }
.jour-m .pts-j i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.jour-m.charge .n::after { content: ""; position: absolute; top: 2px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
.jour-liste-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 2px 2px 10px; }
.jour-liste-tete h2 { font-size: 16px; font-weight: 650; }
.jour-liste-tete small { color: var(--doux); font-size: 13px; }
.ligne.cal { min-height: 58px; padding: 10px 14px; }

/* ===== Calendrier : jour (grille) ===== */
.cal-barre { display: flex; gap: 10px; align-items: center; }
.cal-barre .segments { flex: 1; }
.bande { display: grid; grid-template-columns: 30px repeat(7, minmax(0, 1fr)) 30px; align-items: center; gap: 2px; }
.bande .fleche { border: 0; background: none; color: var(--doux); height: 52px; padding: 0; display: grid; place-items: center; }
.bande .fleche svg { width: 18px; height: 18px; }
.jour-b { border: 0; background: none; color: var(--texte); display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 14px; min-height: 56px; }
.jour-b span { font-size: 11px; color: var(--doux); font-weight: 600; }
.jour-b b { font-size: 16px; font-weight: 600; width: 32px; height: 32px; max-width: 100%; border-radius: 50%; display: grid; place-items: center; }
@media (max-width: 359px) { .jour-b b { width: 28px; height: 28px; font-size: 15px; } }
.jour-b.auj b { color: #8fa2ff; }
.jour-b[aria-pressed="true"] b { background: var(--accent); color: #fff; box-shadow: 0 0 14px rgba(110, 100, 255, .7); }
.jour-b i { width: 4px; height: 4px; border-radius: 50%; }
.jour-b i.plein { background: var(--doux); }
.jour-entete { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.jour-entete h2 { font-size: 17px; font-weight: 650; }
.jauge { display: grid; gap: 5px; min-width: 120px; text-align: right; }
.jauge small { color: var(--doux); font-size: 12px; }
.jauge small b { color: var(--texte); }
.jauge .barre { height: 6px; border-radius: 3px; background: rgba(129, 140, 255, .18); overflow: hidden; }
.jauge .barre i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.jauge.depasse small b { color: var(--orange); }
.jauge.depasse .barre i { background: linear-gradient(90deg, #ffb547, #ff7a59); }
.defile { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; margin: 0 -18px; padding: 0 18px; touch-action: pan-y; }
.grille { position: relative; height: calc(var(--H) * 24); margin-left: 46px; }
.grille .heure { position: absolute; left: -46px; width: 40px; text-align: right; transform: translateY(-50%); color: var(--pale); font-size: 11px; font-variant-numeric: tabular-nums; }
.grille .trait-h { position: absolute; left: 0; right: 0; height: 1px; background: rgba(129, 140, 255, .1); }
.colonnes { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n, 1), 1fr); }
.colonne { position: relative; border: 0; background: none; padding: 0; }
.bloc { position: absolute; border-radius: 12px; overflow: hidden; background: color-mix(in srgb, var(--c) 22%, #0e1030); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
  border-left: 4px solid var(--c); color: var(--texte); touch-action: none; user-select: none; -webkit-user-select: none; }
.bloc .b-ouvrir { position: absolute; inset: 0; border: 0; background: none; padding: 0; width: 100%; }
.bloc .b-texte { position: relative; pointer-events: none; display: grid; gap: 1px; padding: 6px 8px 0 9px; padding-right: 44px; }
.bloc .b-texte b { font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bloc .b-texte small { font-size: 11.5px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bloc.court .b-texte { grid-auto-flow: column; justify-content: start; gap: 6px; padding-top: 2px; }
.bloc .rond-coche { position: absolute; right: 8px; top: 6px; width: 26px; height: 26px; }
.bloc.court .rond-coche { top: 50%; margin-top: -11px; width: 22px; height: 22px; }
.bloc.fait .b-texte b { text-decoration: line-through; color: var(--doux); }
.bloc.libre { background: repeating-linear-gradient(135deg, rgba(47, 211, 197, .14) 0 8px, rgba(47, 211, 197, .06) 8px 16px); }
.bloc.sansecran { background: repeating-linear-gradient(135deg, rgba(87, 195, 255, .14) 0 8px, rgba(87, 195, 255, .05) 8px 16px); }
.bloc.grignote { border-style: dashed; }
.bloc .gain { position: absolute; right: 8px; bottom: 5px; font-size: 11px; font-weight: 700; color: var(--vert); pointer-events: none; }
.bloc .bord { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; cursor: ns-resize; }

.bloc .poignee.bas { bottom: -2px; }

.bloc.repere { animation: repere 1.8s ease-out 1; }
@keyframes repere { 0%, 55% { box-shadow: 0 0 0 3px #fff, 0 0 26px rgba(140, 150, 255, .95); } }
.maintenant { position: absolute; left: -8px; right: 0; height: 2px; background: #ff5d73; z-index: 6; pointer-events: none; }
.maintenant::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ff5d73; }
.maintenant span { position: absolute; left: -50px; top: -8px; font-size: 11px; font-weight: 700; color: #ff8a9a; background: var(--fond); padding: 0 2px; }
.bas-espace { height: 96px; }
.fab { position: absolute; right: 18px; bottom: 18px; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center;
  box-shadow: 0 12px 30px rgba(91, 100, 255, .5); z-index: 8; }
.fab svg { width: 26px; height: 26px; }
.cal-jour { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

/* ===== Objectifs ===== */
.serie-carte { display: flex; align-items: center; gap: 14px; padding: 16px; }
.serie-carte .flamme { font-size: 32px; line-height: 1; filter: drop-shadow(0 0 10px rgba(255, 150, 60, .55)); }
.serie-carte b { font-size: 28px; font-weight: 700; }
.serie-carte small { color: var(--doux); font-size: 13px; display: block; }
.histo { display: flex; gap: 4px; margin-top: 4px; }
.histo i { width: 9px; height: 9px; border-radius: 3px; background: rgba(129, 140, 255, .16); }
.histo i.ok { background: var(--c, var(--bleu)); box-shadow: 0 0 6px color-mix(in srgb, var(--c, #4f6bff) 70%, transparent); }

.obj-carte { padding: 16px; display: grid; gap: 12px; text-align: left; color: inherit; border: 1px solid var(--trait); width: 100%; }
.obj-carte .haut { display: flex; align-items: center; gap: 12px; }

/* ===== Progression ===== */
.anneau-carte { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 18px; }
.anneau { position: relative; width: 150px; height: 150px; }

.anneau .val span { color: var(--doux); font-size: 11px; line-height: 1.2; max-width: 92px; margin: 2px auto 0; }
.chiffres { display: grid; gap: 18px; }
.chiffres .evol { display: grid; gap: 2px; }
.chiffres .evol b { font-size: 22px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

.chiffres .evol b.baisse { color: #ff8a9a; }

.repart { display: grid; gap: 12px; }
.repart .r-ligne { display: grid; grid-template-columns: 24px minmax(70px, 1fr) 2fr 44px; align-items: center; gap: 10px; font-size: 14px; }

.repart .r-ligne .barre { height: 8px; border-radius: 4px; background: rgba(129, 140, 255, .12); overflow: hidden; }
.repart .r-ligne .barre i { display: block; height: 100%; border-radius: 4px; background: var(--c); }
.repart .r-ligne b { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.encourage { display: flex; align-items: center; gap: 14px; padding: 18px; }
.encourage svg { width: 44px; height: 44px; flex: none; }
.encourage p { font-size: 15px; line-height: 1.45; }
.trois { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.trois .mini b { font-size: 20px; }
.courbe-pts { width: 100%; height: 120px; display: block; }
.legende-courbe { display: flex; justify-content: space-between; color: var(--pale); font-size: 11.5px; margin-top: 4px; }
/* ===== Feuilles (formulaires en bas d'écran) ===== */
dialog { color: var(--texte); }
/* Calée sur la partie visible de l'écran : au-dessus du clavier quand il est sorti */
dialog.feuille { top: var(--vv-haut, 0px); bottom: var(--vv-bas, 0px); width: 100%; max-width: 560px;
  max-height: 92vh; max-height: min(92dvh, calc(var(--vv-h, 100dvh) - 12px)); margin: auto auto 0; padding: 0; border: 1px solid var(--trait-fort); border-bottom: 0;
  border-radius: 26px 26px 0 0; background: linear-gradient(180deg, #11143a, #0a0c26 40%); box-shadow: 0 -20px 60px rgba(0, 0, 0, .55); }
dialog.feuille[open] { display: flex; flex-direction: column; animation: monter .26s ease; }
dialog.feuille.haute { height: 92vh; height: min(92dvh, calc(var(--vv-h, 100dvh) - 12px)); }
dialog.feuille::before { content: ""; display: block; flex: none; width: 40px; height: 5px; border-radius: 3px; background: rgba(163, 168, 212, .35); margin: 8px auto 0; }
dialog::backdrop { background: rgba(2, 3, 14, .62); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
@keyframes monter { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (min-width: 640px) { dialog.feuille { margin: auto; border-radius: 26px; border-bottom: 1px solid var(--trait-fort); } }
dialog.feuille > form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.f-haut { flex: none; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; padding: 6px 10px 8px; }
.f-haut h2 { text-align: center; font-size: 18px; font-weight: 700; }
.f-icone { width: 44px; height: 44px; border: 0; background: none; color: var(--texte); display: grid; place-items: center; padding: 0; border-radius: 50%; }
.f-icone svg { width: 22px; height: 22px; }
.f-valider { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; justify-self: end; padding: 0; box-shadow: 0 0 16px rgba(110, 100, 255, .6); }
.f-valider svg { width: 20px; height: 20px; }
.f-ok { border: 0; background: none; color: var(--accent-texte); font-weight: 700; font-size: 16px; padding: 10px 6px; justify-self: end; min-height: 44px; }
.f-msg { flex: none; margin: 0 18px; color: #b9c4ff; font-size: 13.5px; font-weight: 600; min-height: 0; }
.f-msg:empty { display: none; }
.f-msg:not(:empty) { padding: 10px 12px; border-radius: 12px; background: rgba(79, 107, 255, .14); border: 1px solid var(--trait-fort); margin-bottom: 8px; }
.f-corps { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 6px 18px calc(var(--bas-sur) + 22px); display: grid; gap: 16px; align-content: start; grid-auto-rows: max-content; grid-template-columns: minmax(0, 1fr); }
.f-pied { flex: none; padding: 10px 18px calc(var(--bas-sur) + 14px); border-top: 1px solid var(--trait); background: rgba(8, 9, 28, .6); }
.champ-nom { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 0 16px; border-radius: 16px; background: rgba(21, 24, 63, .7); border: 1px solid var(--trait-fort); }
.champ-nom svg { width: 20px; height: 20px; color: var(--doux); flex: none; }
.champ-nom input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; padding: 14px 0; }
.champ-nom input::placeholder { color: var(--pale); opacity: 1; }
.champ-nom:focus-within { border-color: #8f9bff; box-shadow: 0 0 0 3px rgba(110, 120, 255, .25); }
.etiquette { font-size: 15px; font-weight: 600; color: var(--texte); margin: 0 0 8px 2px; display: block; }
.groupe { border-radius: 16px; background: rgba(21, 24, 63, .55); border: 1px solid var(--trait); overflow: hidden; }
.rang { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 14px; border: 0; border-bottom: 1px solid var(--trait); background: none; width: 100%; text-align: left; color: inherit; }
.groupe > .rang:last-child, .groupe > :last-child .rang, .groupe > :last-child > .rang { border-bottom: 0; }
.rang > span:first-child { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.rang .sous { display: block; color: var(--doux); font-size: 12.5px; }
.rang .val { color: var(--accent-texte); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.rang .val svg { width: 16px; height: 16px; color: var(--doux); }
.rang .ic { width: 28px; height: 28px; display: grid; place-items: center; color: var(--doux); flex: none; font-size: 18px; }
.rang .ic svg { width: 22px; height: 22px; }
.rang input[type="date"], .rang input[type="time"], .rang select, .rang input[type="number"] { border: 1px solid var(--trait-fort); background: rgba(10, 12, 34, .8); border-radius: 10px; padding: 8px 10px;
  color: var(--texte); font-size: 16px; min-height: 40px; color-scheme: dark; max-width: 58%; }
.rang input[type="number"] { width: 84px; text-align: center; }
.rang select { -webkit-appearance: none; appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, #a3a8d4 50%), linear-gradient(135deg, #a3a8d4 50%, transparent 50%);
  background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.horaires { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 14px 12px; }
.horaires label { display: grid; gap: 4px; font-size: 12.5px; color: var(--doux); font-weight: 600; }
.horaires input { width: 100%; max-width: none; border: 1px solid var(--trait-fort); background: rgba(10, 12, 34, .8); border-radius: 10px; padding: 9px 10px; color: var(--texte); font-size: 16px; min-height: 44px; color-scheme: dark; }
.pas-points { display: flex; align-items: center; gap: 6px; }
.note { color: var(--doux); font-size: 13px; line-height: 1.45; }
.erreur { color: #ff8a9a; font-size: 14px; font-weight: 600; }
.erreur:empty { display: none; }
.types { display: grid; grid-template-columns: repeat(3, 1fr); }
.types label { position: relative; display: grid; place-items: center; min-height: 40px; border-radius: 12px; color: var(--doux); font-weight: 600; font-size: 13.5px; cursor: pointer; text-align: center; padding: 0 4px; }
.types input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.types label:has(input:checked) { background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(91, 100, 255, .35); }
.types label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.choix-jours { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.choix-jours label { position: relative; display: grid; place-items: center; height: 42px; border-radius: 50%; border: 1px solid var(--trait-fort); color: var(--doux); font-weight: 700; cursor: pointer; }
.choix-jours input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.choix-jours label:has(input:checked) { background: var(--accent); color: #fff; border-color: transparent; }
.choix-jours label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.icones-choix { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.icones-choix label, .couleurs-choix label { position: relative; display: grid; place-items: center; height: 46px; border-radius: 12px; border: 1px solid var(--trait); font-size: 22px; cursor: pointer; background: rgba(21, 24, 63, .55); }
.icones-choix input, .couleurs-choix input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.icones-choix label:has(input:checked) { border-color: #8f9bff; box-shadow: 0 0 0 2px #8f9bff inset; background: rgba(79, 107, 255, .22); }
.couleurs-choix { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }

.cat-rang .tuile { width: 36px; height: 36px; font-size: 19px; border-radius: 11px; }
.cat-rang[aria-checked="true"] { background: rgba(79, 107, 255, .16); }
.cat-rang[aria-checked="true"] .val { color: #fff; }
.etapes { display: grid; gap: 0; }
.etape { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--trait); }
.etape:last-child { border-bottom: 0; }
.etape span { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
.etape.faite span { color: var(--doux); text-decoration: line-through; }

.ajout-etape { display: flex; gap: 8px; padding: 10px; }
.ajout-etape input { flex: 1; min-width: 0; border: 1px solid var(--trait-fort); background: rgba(10, 12, 34, .8); border-radius: 12px; padding: 0 12px; min-height: 44px; font-size: 16px; }
.ajout-etape button { flex: none; width: auto; padding: 0 16px; min-height: 44px; }
.anneau.petit { width: 96px; height: 96px; }

.obj-resume { display: flex; align-items: center; gap: 16px; }
.obj-resume p { font-size: 14px; color: var(--doux); line-height: 1.5; }

/* ===== Catégories (gestion) ===== */
.cat-liste .rang { min-height: 66px; }
.cat-liste .rang .ouvrir-cat { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; color: inherit; text-align: left; padding: 0; min-height: 48px; }

/* ===== Questions ===== */
dialog.feuille.petite { max-height: 80vh; max-height: min(80dvh, calc(var(--vv-h, 100dvh) - 12px)); }
.q-corps { padding: 18px 18px calc(var(--bas-sur) + 18px); display: grid; gap: 12px; }

.q-corps p { color: var(--doux); text-align: center; font-size: 15px; line-height: 1.45; }
.q-choix { display: grid; gap: 10px; margin-top: 6px; }

/* ===== Minuteur ===== */
dialog.minuteur { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--fond);
  background-image: radial-gradient(80% 50% at 50% 30%, rgba(110, 90, 255, .28), transparent 65%); }
dialog.minuteur[open] { display: grid; }
.m-corps { display: grid; grid-template-rows: auto 1fr auto; gap: 18px; padding: calc(var(--haut-sur) + 16px) 22px calc(var(--bas-sur) + 22px); max-width: 520px; width: 100%; margin: 0 auto; min-height: 100%; }
.m-haut { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; text-align: center; }
.m-haut h2 { font-size: 17px; font-weight: 700; }
.m-centre { display: grid; justify-items: center; align-content: center; gap: 18px; text-align: center; }
.m-anneau { position: relative; width: min(74vw, 300px); aspect-ratio: 1; }
.m-anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.m-anneau .temps { position: absolute; inset: 0; display: grid; place-content: center; gap: 4px; }
.m-anneau .temps b { font-size: clamp(48px, 15vw, 66px); font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.m-anneau .temps span { color: var(--doux); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }
.m-tache { display: grid; gap: 4px; }
.m-tache b { font-size: 19px; font-weight: 650; }
.m-tache small { color: var(--doux); font-size: 14px; }
.m-cycles { display: flex; gap: 8px; justify-content: center; }
.m-cycles i { width: 10px; height: 10px; border-radius: 50%; background: rgba(129, 140, 255, .2); }
.m-cycles i.fait { background: var(--accent); box-shadow: 0 0 8px rgba(110, 100, 255, .7); }

/* ===== Profil ===== */
.profil-tete { display: flex; align-items: center; gap: 14px; }
input, select, textarea { font-size: 16px; }
.profil-tete .avatar { width: 64px; height: 64px; font-size: 20px; }
.profil-tete .embleme-p { width: 64px; height: 64px; margin-left: auto; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 10px; }
legend { font-size: 13px; font-weight: 700; color: var(--doux); text-transform: uppercase; letter-spacing: .08em; padding: 0 2px; margin-bottom: 10px; }
.code-coffre { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 20px; letter-spacing: .06em; text-align: center; padding: 16px; border-radius: 14px; background: rgba(10, 12, 34, .8); border: 1px dashed var(--trait-fort); user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }
.champ-code { font-family: ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase; letter-spacing: .06em; }
.liste-radios { display: grid; gap: 0; }
.liste-radios label { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border-bottom: 1px solid var(--trait); }

/* ===== Loupe ===== */
.lp-haut { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 8px 10px 14px; margin: 0; }
.lp-champ { flex: 1; min-width: 0; position: relative; }
.lp-champ .lp-icone { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: var(--doux); pointer-events: none; }
.lp-champ .lp-icone svg { width: 18px; height: 18px; }
.lp-champ input { width: 100%; min-height: 46px; border: 1px solid var(--trait-fort); border-radius: 14px; padding: 8px 42px 8px 38px; background: rgba(21, 24, 63, .7); color: var(--texte); font-size: 16px; -webkit-appearance: none; appearance: none; }
.lp-champ input::-webkit-search-cancel-button, .lp-champ input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.lp-champ input::placeholder { color: var(--pale); opacity: 1; }
.lp-effacer { position: absolute; right: 4px; top: 50%; margin-top: -19px; width: 38px; height: 38px; border: 0; background: none; color: var(--doux); padding: 0; display: grid; place-items: center; }
.lp-effacer svg { width: 18px; height: 18px; }
.lp-filtres { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.filtre { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1px solid var(--trait-fort); border-radius: 18px; background: rgba(21, 24, 63, .6); color: var(--texte); font-weight: 600; font-size: 13px; }
.filtre[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: #fff; }
.filtre[aria-pressed="true"]::before { content: "✓"; font-weight: 800; }
.lp-resultats { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 14px calc(var(--bas-sur) + 18px); display: grid; gap: 14px; align-content: start; }
.lp-resultats h3 { font-size: 13px; font-weight: 700; color: var(--doux); text-transform: uppercase; letter-spacing: .08em; margin: 4px 2px 8px; display: flex; justify-content: space-between; }
mark { background: rgba(255, 213, 107, .9); color: #10122e; border-radius: 4px; padding: 0 2px; }

/* ===== Verrou Face ID ===== */

  border: 1px solid var(--trait); background: rgba(16, 18, 50, .75); color: var(--texte); }

.case-m[aria-current="date"] .n span { background: var(--accent); color: #fff; border-radius: 8px; padding: 0 6px; box-shadow: 0 0 10px rgba(110, 100, 255, .7); }

/* Jour : la grille prend toute la largeur */

/* Feuilles et minuteur, téléphone couché */

<script>
(() => {
  'use strict';
  // ASCEND : développement personnel et JOMO. Une seule page, données sur l'appareil (localStorage).
  const VERSION = 1;
  const CLE = 'ascend-v1';

  // ---------- Réglages fixes ----------
  const CONFIG = {
    heure: 60,             // px par heure dans la grille (= --H)
    pas: 15,               // minutes : les plages se calent au quart d'heure
    duree: 60,             // durée proposée pour une nouvelle plage
    ouverture: 7,          // heure en haut de la grille à l'ouverture
    appuiLong: 450,        // ms : appui long sur l'écran tactile
    points: { libre: 30, sansecran: 40, libresParJour: 2, libreMin: 30, bonusObjectif: 5 },
    validation: 3,         // jours pour dire si un moment sans écran a été tenu
    rappels: { horizon: 14, heureSauvegarde: 19 * 60 },
    paliers: [
      { id: 'eclat', nom: 'Éclat', seuil: 0 },
      { id: 'cristal', nom: 'Cristal', seuil: 500 },
      { id: 'etoile', nom: 'Étoile', seuil: 1500 },
      { id: 'constellation', nom: 'Constellation', seuil: 4000 },
      { id: 'nova', nom: 'Nova', seuil: 10000 }
    ]
  };
  const H = CONFIG.heure;
  const PALETTE = ['#ff4d6d', '#ffb547', '#7b6cff', '#d78bff', '#ff5e7a', '#4f8bff', '#3ee08f', '#2fd3c5', '#57c3ff', '#ff8a3d', '#f5d547', '#9aa3d9'];
  const NOMS_COULEURS = { '#ff4d6d': 'Rouge', '#ffb547': 'Orange', '#7b6cff': 'Violet', '#d78bff': 'Mauve', '#ff5e7a': 'Rose', '#4f8bff': 'Bleu', '#3ee08f': 'Vert', '#2fd3c5': 'Turquoise', '#57c3ff': 'Ciel', '#ff8a3d': 'Mandarine', '#f5d547': 'Jaune', '#9aa3d9': 'Gris' };
  const ICONES_CAT = ['🏋️', '💼', '📘', '👥', '❤️', '⭐', '🧘', '🏃', '🚴', '⚽', '🎯', '🧠', '💡', '📝', '🎨', '🎵', '🍎', '💰', '🏠', '✈️', '🌱', '🛠️', '📷', '🎮'];
  const CATS = () => [
    { id: 'sport', nom: 'Sport', icone: '🏋️', couleur: '#ff4d6d', points: 50, objectif: 2, active: true },
    { id: 'travail', nom: 'Travail', icone: '💼', couleur: '#ffb547', points: 30, objectif: 5, active: true },
    { id: 'lecture', nom: 'Lecture', icone: '📘', couleur: '#7b6cff', points: 20, objectif: 3, active: true },
    { id: 'social', nom: 'Social', icone: '👥', couleur: '#d78bff', points: 20, objectif: 1, active: true },
    { id: 'sante', nom: 'Santé', icone: '❤️', couleur: '#ff5e7a', points: 40, objectif: 4, active: true },
    { id: 'autre', nom: 'Autre', icone: '⭐', couleur: '#9aa3d9', points: 10, objectif: 0, active: true }
  ];
  // Les deux types JOMO : pas de catégorie, des points fixes
  const JOMO = {
    libre: { nom: 'Temps pour moi', court: 'Pour moi', icone: '🌿', couleur: '#2fd3c5' },
    sansecran: { nom: 'Sans écran', court: 'Sans écran', icone: '📵', couleur: '#57c3ff' }
  };
  const REPET = { jour: 'Chaque jour', ouvres: 'En semaine', semaine: 'Chaque semaine', mois: 'Chaque mois' };
  const JOURS_COURTS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  const JOURS_LONGS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];

  // ---------- Données ----------
  // elements : { id, type: 'tache' | 'libre' | 'sansecran', titre, cat, date, debut, fin (minutes), rep: null | { freq, jusqua },
  //              exceptions: { date: true }, faits: { date: true }, objectif: id | null, creeLe }
  // habitudes : { id, titre, cat, jours: [0..6] (0 = lundi), debut (date), fin (date de retrait ou null), faits: { date: true } }
  // objectifs : { id, titre, cat, echeance, etapes: [{ id, titre, faitLe }], creeLe, atteintLe }
  // payes : { clé : { pts, jour, type, cat, raison? } } ; gains : { jour : { total, cats: { id: pts }, src: { type: pts } } }
  function rappelsVides() {
    return { actif: false, jeton: null, service: null, avant: true, delai: 30, matin: true, heureMatin: 8 * 60, sauvegarde: true, signature: null, majLe: null, erreur: null };
  }
  function coffreVide() { return { actif: false, derniere: null, envoiLe: null, jours: [], erreur: null, signature: null }; }
  const vide = () => ({
    app: 'ascend', version: VERSION,
    profil: { prenom: 'Mehdi', initiales: 'MB' },
    categories: CATS(),
    elements: [], habitudes: [], objectifs: [],
    tenus: {}, payes: {}, gains: {}, points: 0,
    focus: [],                 // sessions de concentration : { jour, cat, min, cle, le }
    minuteur: null,            // { phase: 'travail' | 'pause' | 'pret', fin, reste, cle, cat, titre, cycle, debut }
    reglages: { plafond: 9 * 60, travail: 25, pause: 5 },
    meilleureSerie: 0, meilleureSansEcran: 0,
    onglet: 'accueil', vueCal: 'mois', vueObj: 'habitudes', periode: 30,
    derniereExport: null, depuis: null,
    rappels: null, coffre: null
  });
  let S;
  try { S = Object.assign(vide(), JSON.parse(localStorage.getItem(CLE)) || {}); }
  catch (e) { S = vide(); }
  const estObjet = v => v && typeof v === 'object' && !Array.isArray(v);
  function nettoyer() {
    ['elements', 'habitudes', 'objectifs', 'focus'].forEach(c => { if (!Array.isArray(S[c])) S[c] = []; });
    ['tenus', 'payes', 'gains'].forEach(c => { if (!estObjet(S[c])) S[c] = {}; });
    if (!Array.isArray(S.categories) || !S.categories.length) S.categories = CATS();
    S.categories.forEach(c => {
      c.points = Math.max(0, Math.min(1000, Math.round(Number(c.points) || 0)));
      c.objectif = Math.max(0, Math.min(21, Math.round(Number(c.objectif) || 0)));
      if (typeof c.active !== 'boolean') c.active = true;
      if (!c.icone) c.icone = '⭐';
      if (!/^#[0-9a-f]{6}$/i.test(c.couleur || '')) c.couleur = '#9aa3d9';
    });
    S.profil = Object.assign({ prenom: 'Mehdi', initiales: 'MB' }, estObjet(S.profil) ? S.profil : {});
    S.reglages = Object.assign({ plafond: 9 * 60, travail: 25, pause: 5 }, estObjet(S.reglages) ? S.reglages : {});
    S.rappels = Object.assign(rappelsVides(), estObjet(S.rappels) ? S.rappels : {});
    S.coffre = Object.assign(coffreVide(), estObjet(S.coffre) ? S.coffre : {});
    S.elements = S.elements.filter(el => el && el.id && typeof el.date === 'string' && el.debut != null && el.fin != null);
    S.elements.forEach(el => {
      el.exceptions = estObjet(el.exceptions) ? el.exceptions : {};
      el.faits = estObjet(el.faits) ? el.faits : {};
      if (!['tache', 'libre', 'sansecran'].includes(el.type)) el.type = 'tache';
      if (el.objectif === undefined) el.objectif = null;
    });
    S.elements = S.elements.filter(el => !el.rep || !el.rep.jusqua || el.rep.jusqua >= el.date);
    S.habitudes = S.habitudes.filter(h => h && h.id && h.titre);
    S.habitudes.forEach(h => {
      h.faits = estObjet(h.faits) ? h.faits : {};
      if (!Array.isArray(h.jours) || !h.jours.length) h.jours = [0, 1, 2, 3, 4, 5, 6];
      if (!h.debut) h.debut = aujourdhui();
    });
    S.objectifs = S.objectifs.filter(o => o && o.id && o.titre);
    S.objectifs.forEach(o => { if (!Array.isArray(o.etapes)) o.etapes = []; });
    if (S.focus.length > 3000) S.focus = S.focus.slice(-3000);
    if (!S.depuis) S.depuis = aujourdhui();
  }
  let erreurStockage = false;
  // Enregistre, puis prévient le service de rappels et la sauvegarde automatique
  const sauver = () => { verifierObjectifs(); ecrire(); planifierSynchro(); planifierCoffre(); };
  const ecrire = () => {
    nettoyer();
    // Journal des gains et paiements : 400 jours (les étapes et les objectifs restent)
    const limite = decaler(aujourdhui(), -400);
    Object.keys(S.gains).forEach(k => { if (k < limite) delete S.gains[k]; });
    Object.keys(S.payes).forEach(c => { if (!/^[eo]:/.test(c) && (!S.payes[c] || (S.payes[c].jour || '') < limite)) delete S.payes[c]; });
    try { localStorage.setItem(CLE, JSON.stringify(S)); erreurStockage = false; }
    catch (e) { erreurStockage = true; }
  };
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* facultatif */ }

  // ---------- Dates et heures ----------
  const dk = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parse = k => { const [y, m, j] = k.split('-').map(Number); return new Date(y, m - 1, j); };
  const aujourdhui = () => dk(new Date());
  const decaler = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dk(d); };
  const ecart = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const indexJour = k => (parse(k).getDay() + 6) % 7;            // 0 = lundi
  const lundiDe = k => decaler(k, -indexJour(k));
  const moisPlus = (k, n) => { const d = parse(k); const j = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const fin = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(j, fin)); return dk(d); };
  const fmt = (k, o) => parse(k).toLocaleDateString('fr-FR', o);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const hhmm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  const finTexte = m => (m === 1440 ? '24:00' : hhmm(m));
  const versMin = s => { if (!s) return null; const [h, m] = s.split(':').map(Number); return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null; };
  const minNow = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const caler = m => Math.round(m / CONFIG.pas) * CONFIG.pas;
  const borne = (v, a, b) => Math.max(a, Math.min(b, v));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  // Sur téléphone, une feuille qui s'ouvre ne fait pas surgir le clavier : on touche le champ quand on veut écrire
  const TACTILE = window.matchMedia('(hover: none) and (pointer: coarse)');
  const focusDepart = champ => { if (!TACTILE.matches) setTimeout(() => { const c = champ(); if (c) c.focus(); }, 60); };
  const nombre =n => Math.round(n).toLocaleString('fr-FR');
  const duree = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') : ''}`;
  const jourLong = k => cap(fmt(k, { weekday: 'long', day: 'numeric', month: 'long' }));
  const quandJour = k => { const a = aujourdhui(); return k === a ? "aujourd'hui" : k === decaler(a, 1) ? 'demain' : k === decaler(a, -1) ? 'hier' : 'le ' + fmt(k, { weekday: 'long', day: 'numeric', month: 'long' }); };
  const pluriel = (n, mot, motPl) => `${n} ${n > 1 ? (motPl || mot + 's') : mot}`;

  // ---------- Catégories ----------
  const cat = id => S.categories.find(c => c.id === id) || S.categories[0] || { id: '', nom: 'Sans catégorie', icone: '⭐', couleur: '#9aa3d9', points: 0, objectif: 0, active: true };
  const catsActives = () => S.categories.filter(c => c.active);
  // Apparence d'un élément : catégorie (tâche) ou type JOMO
  const look = el => el.type === 'tache' ? { icone: cat(el.cat).icone, couleur: cat(el.cat).couleur, nom: cat(el.cat).nom } : { icone: JOMO[el.type].icone, couleur: JOMO[el.type].couleur, nom: JOMO[el.type].nom };

  // ---------- Occurrences ----------
  function tombe(el, k) {
    if (k < el.date) return false;
    if (!el.rep) return k === el.date;
    if (el.rep.jusqua && k > el.rep.jusqua) return false;
    if (el.exceptions[k]) return false;
    const d = parse(k), d0 = parse(el.date);
    switch (el.rep.freq) {
      case 'jour': return true;
      case 'ouvres': return d.getDay() >= 1 && d.getDay() <= 5;
      case 'semaine': return d.getDay() === d0.getDay();
      case 'mois': return d.getDate() === d0.getDate();
    }
    return false;
  }
  const occ = (el, k) => ({ el, k, cle: el.id + '|' + k, fait: !!el.faits[k] });
  const ordre = (a, b) => a.el.debut - b.el.debut || a.el.fin - b.el.fin || a.el.titre.localeCompare(b.el.titre, 'fr');
  const duJour = k => S.elements.filter(el => tombe(el, k)).map(el => occ(el, k)).sort(ordre);
  function trouver(cle) {
    const i = cle.lastIndexOf('|');
    const el = S.elements.find(e => e.id === cle.slice(0, i));
    const k = cle.slice(i + 1);
    return el && tombe(el, k) ? occ(el, k) : null;
  }
  const copie = el => JSON.parse(JSON.stringify(el));
  const debutOcc = o => parse(o.k).getTime() + o.el.debut * 6e4;
  const finOcc = o => parse(o.k).getTime() + o.el.fin * 6e4;
  const prevue = o => (o.el.creeLe || 0) < debutOcc(o);            // planifiée avant son début

  function transferer(ancienne, nouvelle) {
    if (ancienne === nouvelle) return;
    if (S.payes[ancienne]) { S.payes[nouvelle] = S.payes[ancienne]; delete S.payes[ancienne]; }
    if (S.tenus[ancienne] !== undefined) { S.tenus[nouvelle] = S.tenus[ancienne]; delete S.tenus[ancienne]; }
  }
  function prendreDepuis(obj, depuis, delta) {
    const res = {};
    Object.keys(obj).forEach(k => { if (k >= depuis) { res[delta ? decaler(k, delta) : k] = obj[k]; delete obj[k]; } });
    return res;
  }
  // Modifie une occurrence. portee : 'une' (cette fois seulement) ou 'suivantes'. Renvoie la nouvelle clé.
  function appliquer(o, champs, portee) {
    const el = o.el;
    const final = Object.assign({}, { date: o.k }, champs);
    if (!el.rep) {
      const fait = !!el.faits[o.k];
      Object.assign(el, final);
      el.faits = fait ? { [el.date]: true } : {};
      if (!el.rep) el.exceptions = {};
      transferer(o.cle, el.id + '|' + el.date);
      return el.id + '|' + el.date;
    }
    if (portee === 'une') {
      const fait = !!el.faits[o.k];
      el.exceptions[o.k] = true;
      delete el.faits[o.k];
      const n = Object.assign(copie(el), final, { id: uid(), rep: null, exceptions: {}, faits: {}, serie: el.id });
      if (fait) n.faits[n.date] = true;
      S.elements.push(n);
      transferer(o.cle, n.id + '|' + n.date);
      return n.id + '|' + n.date;
    }
    const delta = ecart(o.k, final.date);
    if (o.k === el.date) {
      const faits = prendreDepuis(el.faits, o.k, delta), exc = prendreDepuis(el.exceptions, o.k, delta);
      Object.assign(el, final);
      el.faits = faits; el.exceptions = exc;
      return el.id + '|' + el.date;
    }
    const n = Object.assign(copie(el), final, { id: uid(), faits: prendreDepuis(el.faits, o.k, delta), exceptions: prendreDepuis(el.exceptions, o.k, delta) });
    el.rep = Object.assign({}, el.rep, { jusqua: decaler(o.k, -1) });
    Object.keys(S.payes).concat(Object.keys(S.tenus)).forEach(c => {
      if (c.startsWith(el.id + '|') && c.slice(el.id.length + 1) >= o.k) transferer(c, n.id + '|' + decaler(c.slice(el.id.length + 1), delta));
    });
    S.elements.push(n);
    return n.id + '|' + n.date;
  }
  function supprimerOcc(o, portee) {
    const el = o.el;
    if (!el.rep || (portee === 'suivantes' && o.k === el.date)) {
      S.elements = S.elements.filter(e => e !== el);
    } else if (portee === 'une') {
      el.exceptions[o.k] = true;
      delete el.faits[o.k];
    } else {
      el.rep = Object.assign({}, el.rep, { jusqua: decaler(o.k, -1) });
      prendreDepuis(el.faits, o.k, 0);
      prendreDepuis(el.exceptions, o.k, 0);
    }
  }
  // Minutes de tâches prévues un jour (les chevauchements comptent une fois) : c'est ce qui est comparé au plafond
  function minutesPrevues(k, sans) {
    const iv = duJour(k).filter(o => o.el.type === 'tache' && o.cle !== sans).map(o => [o.el.debut, o.el.fin]).sort((a, b) => a[0] - b[0]);
    let total = 0, d = -1, f = -1;
    iv.forEach(([a, b]) => { if (a > f) { total += Math.max(0, f - d); d = a; f = b; } else f = Math.max(f, b); });
    return total + Math.max(0, f - d);
  }

  // Service de rappels, sauvegarde automatique : états en mémoire
  const RAP = { service: undefined, cle: null, minuteur: null, enCours: false, reabonner: null };
  const COF = { minuteur: null, enCours: false, iter: 200000 };

  // ---------- État de l'écran (non enregistré) ----------
  const U = {
    onglet: ['accueil', 'calendrier', 'objectifs', 'progression'].includes(S.onglet) ? S.onglet : 'accueil',
    date: aujourdhui(),
    selection: null, brouillon: null, defile: {}, edition: null, avaler: 0,
    reaction: false, palierAtteint: null, repere: null
  };
  nettoyer();

  // ---------- Paliers de l'emblème ----------
  const palierDe = pts => CONFIG.paliers.reduce((a, p) => (pts >= p.seuil ? p : a), CONFIG.paliers[0]);
  const palier = () => palierDe(S.points);
  const palierSuivant = () => CONFIG.paliers.find(p => p.seuil > S.points) || null;

  // ---------- Points ----------
  // Tout gain ou retrait passe par ici : le total, le journal par jour et par catégorie restent d'accord.
  function noterGain(pts, jour, type, catId) {
    const g = (S.gains[jour] = S.gains[jour] || { total: 0, cats: {}, src: {} });
    const c = catId || 'jomo';
    g.total += pts;
    g.cats[c] = (g.cats[c] || 0) + pts;
    g.src[type] = (g.src[type] || 0) + pts;
  }
  function gagner(cle, pts, jour, type, catId, raison) {
    const avant = palier();
    S.payes[cle] = { pts, jour, type, cat: catId || null };
    if (raison) S.payes[cle].raison = raison;
    if (!pts) return 0;
    S.points = Math.max(0, S.points + pts);
    noterGain(pts, jour, type, catId);
    U.reaction = true;
    const apres = palier();
    if (apres.id !== avant.id) U.palierAtteint = apres;
    return pts;
  }
  function reprendre(cle) {
    const p = S.payes[cle];
    if (!p) return 0;
    delete S.payes[cle];
    if (p.pts) { S.points = Math.max(0, S.points - p.pts); noterGain(-p.pts, p.jour, p.type, p.cat); }
    return p.pts || 0;
  }
  const valeur = el => el.type === 'tache' ? cat(el.cat).points : CONFIG.points[el.type];

  // Temps pour moi : grignoté si une tâche empiète dessus
  const grignoteurs = o => duJour(o.k).filter(x => x.el.type === 'tache' && x.el.debut < o.el.fin && x.el.fin > o.el.debut);
  const libresPayes = k => Object.values(S.payes).filter(p => p.type === 'libre' && p.jour === k && p.pts > 0).length;
  const ETAT_LIBRE = { paye: 'gardé', grignote: 'grignoté', tard: 'ajouté après son début', court: 'moins de 30 min', plafond: 'déjà 2 ce jour-là', 'en-cours': 'en cours', protege: 'protégé' };
  function etatLibre(o) {
    const p = S.payes[o.cle];
    if (p) return p.pts > 0 ? 'paye' : (p.raison || 'grignote');
    if (grignoteurs(o).length) return 'grignote';
    if (!prevue(o)) return 'tard';
    if (o.el.fin - o.el.debut < CONFIG.points.libreMin) return 'court';
    const now = Date.now();
    return now >= debutOcc(o) && now < finOcc(o) ? 'en-cours' : 'protege';
  }
  // Moment sans écran : à venir, en cours, à valider (fini, pas encore dit), tenu, pas tenu, oublié
  function etatSansEcran(o) {
    const p = S.payes[o.cle], t = S.tenus[o.cle], now = Date.now();
    if (t === true) return p && !p.pts && p.raison === 'tard' ? 'tenu-tard' : 'tenu';
    if (t === false) return 'pas-tenu';
    if (p) return 'oublie';
    if (now < debutOcc(o)) return 'a-venir';
    if (now < finOcc(o)) return 'en-cours';
    return 'a-valider';
  }
  const ETAT_ECRAN = { tenu: 'tenu', 'tenu-tard': 'tenu, ajouté après son début', 'pas-tenu': 'pas tenu', oublie: 'pas validé', 'a-venir': 'à venir', 'en-cours': 'en cours', 'a-valider': 'à valider' };

  // Verse ce qui est dû : tâches cochées en avance dont l'heure est venue, temps pour moi arrivés au bout,
  // moments sans écran restés sans réponse trop longtemps.
  function crediter() {
    const now = Date.now(), auj = aujourdhui();
    let change = false;
    for (let i = -14; i <= 0; i++) {
      const k = decaler(auj, i);
      duJour(k).forEach(o => {
        if (S.payes[o.cle]) return;
        const t = o.el.type;
        if (t === 'tache' && o.fait && prevue(o) && debutOcc(o) <= now) { gagner(o.cle, valeur(o.el), k, 'tache', cat(o.el.cat).id); change = true; }
        else if (t === 'libre' && finOcc(o) <= now) {
          let raison = null;
          if (!prevue(o)) raison = 'tard';
          else if (grignoteurs(o).length) raison = 'grignote';
          else if (o.el.fin - o.el.debut < CONFIG.points.libreMin) raison = 'court';
          else if (libresPayes(k) >= CONFIG.points.libresParJour) raison = 'plafond';
          if (raison) gagner(o.cle, 0, k, 'libre', null, raison); else gagner(o.cle, CONFIG.points.libre, k, 'libre', null);
          change = true;
        } else if (t === 'sansecran' && S.tenus[o.cle] === undefined && now - finOcc(o) > CONFIG.validation * 864e5) {
          gagner(o.cle, 0, k, 'sansecran', null, 'oublie'); change = true;
        }
      });
    }
    if (change) sauver();
    return change;
  }
  // Cocher ou décocher une tâche. Renvoie le message à afficher.
  function basculerTache(o) {
    if (o.fait) {
      delete o.el.faits[o.k];
      o.fait = false;
      const pts = reprendre(o.cle);
      U.decoche = true;
      return pts ? `Décochée : −${pts} pts.` : 'Décochée.';
    }
    o.el.faits[o.k] = true;
    o.fait = true;
    const pts = valeur(o.el);
    if (!prevue(o)) return 'Bien joué ! Pas de points : elle a été ajoutée après son début.';
    if (debutOcc(o) > Date.now()) return `Faite en avance : +${pts} pts ${o.k === aujourdhui() ? 'à ' + hhmm(o.el.debut) : quandJour(o.k)}.`;
    return `+${gagner(o.cle, pts, o.k, 'tache', cat(o.el.cat).id)} pts`;
  }
  // Moment sans écran : tenu ou pas (on peut changer d'avis)
  function validerSansEcran(o, tenu) {
    reprendre(o.cle);
    S.tenus[o.cle] = tenu;
    if (!tenu) { gagner(o.cle, 0, o.k, 'sansecran', null, 'pas-tenu'); return 'Pas tenu. Ce n\'est que partie remise.'; }
    if (!prevue(o)) { gagner(o.cle, 0, o.k, 'sansecran', null, 'tard'); return 'Bravo ! Pas de points : il a été ajouté après son début.'; }
    const pts = gagner(o.cle, CONFIG.points.sansecran, o.k, 'sansecran', null);
    const s = serieSansEcran();
    if (s > S.meilleureSansEcran) S.meilleureSansEcran = s;
    return `+${pts} pts · ${pluriel(s, 'moment')} sans écran d'affilée.`;
  }
  // Moments sans écran tenus d'affilée (du plus récent au plus ancien ; un « pas tenu » ou un oubli coupe la série)
  function serieSansEcran() {
    const fins = [];
    const auj = aujourdhui();
    for (let i = 0; i <= 120; i++) {
      const k = decaler(auj, -i);
      duJour(k).filter(o => o.el.type === 'sansecran').forEach(o => {
        const e = etatSansEcran(o);
        if (['tenu', 'tenu-tard', 'pas-tenu', 'oublie'].includes(e)) fins.push({ f: finOcc(o), ok: e === 'tenu' || e === 'tenu-tard' });
      });
    }
    fins.sort((a, b) => b.f - a.f);
    let n = 0;
    for (const x of fins) { if (!x.ok) break; n++; }
    return n;
  }

  // ---------- Habitudes et série ----------
  const habitudeDue = (h, k) => k >= h.debut && (!h.fin || k < h.fin) && h.jours.includes(indexJour(k));
  const habitudesActives = () => S.habitudes.filter(h => !h.fin);
  const cleHab = (h, k) => 'h:' + h.id + '|' + k;
  function basculerHabitude(h, k) {
    const cle = cleHab(h, k);
    if (h.faits[k]) {
      delete h.faits[k];
      const pts = reprendre(cle);
      return pts ? `Décochée : −${pts} pts.` : 'Décochée.';
    }
    h.faits[k] = true;
    const c = cat(h.cat);
    const pts = gagner(cle, c.points, k, 'habitude', c.id);
    const s = serie();
    if (s > S.meilleureSerie) S.meilleureSerie = s;
    const toutes = S.habitudes.filter(x => habitudeDue(x, k));
    const reste = toutes.filter(x => !x.faits[k]).length;
    return `+${pts} pts` + (k === aujourdhui() ? (reste ? ` · encore ${pluriel(reste, 'habitude')} aujourd'hui` : ` · série : ${pluriel(s, 'jour')} 🔥`) : '');
  }
  // Un jour compte si toutes les habitudes prévues ce jour-là sont faites ; null si aucune n'était prévue.
  function jourComplet(k) {
    const d = S.habitudes.filter(h => habitudeDue(h, k));
    if (!d.length) return null;
    return d.every(h => h.faits[k]);
  }
  // Série actuelle : aujourd'hui compte dès qu'il est complet ; une journée ratée la casse
  function serie() {
    if (!S.habitudes.length) return 0;
    const premier = S.habitudes.reduce((m, h) => (h.debut < m ? h.debut : m), '9999-12-31');
    const auj = aujourdhui();
    let n = jourComplet(auj) === true ? 1 : 0;
    for (let k = decaler(auj, -1), i = 0; k >= premier && i < 3700; k = decaler(k, -1), i++) {
      const c = jourComplet(k);
      if (c === false) break;
      if (c === true) n++;
    }
    return n;
  }
  function serieHabitude(h) {
    const auj = aujourdhui();
    let n = habitudeDue(h, auj) && h.faits[auj] ? 1 : 0;
    for (let k = decaler(auj, -1), i = 0; k >= h.debut && i < 3700; k = decaler(k, -1), i++) {
      if (!habitudeDue(h, k)) continue;
      if (!h.faits[k]) break;
      n++;
    }
    return n;
  }

  // ---------- Objectifs à long terme ----------
  // Avancement : étapes cochées + tâches rattachées faites. Une tâche répétée compte ses fois jusqu'à l'échéance
  // (ou jusqu'à aujourd'hui sans échéance).
  function tachesLiees(ob) {
    const res = [];
    const limite = ob.echeance && ob.echeance > aujourdhui() ? ob.echeance : aujourdhui();
    S.elements.filter(el => el.type === 'tache' && el.objectif === ob.id).forEach(el => {
      if (!el.rep) { res.push(occ(el, el.date)); return; }
      for (let k = el.date, i = 0; k <= limite && i < 800; k = decaler(k, 1), i++) {
        if (el.rep.jusqua && k > el.rep.jusqua) break;
        if (tombe(el, k)) res.push(occ(el, k));
      }
    });
    return res.sort((a, b) => a.k.localeCompare(b.k) || ordre(a, b));
  }
  function avancement(ob) {
    const t = tachesLiees(ob);
    const total = ob.etapes.length + t.length;
    const faits = ob.etapes.filter(e => e.faitLe).length + t.filter(o => o.fait).length;
    return { total, faits, taches: t, pc: total ? Math.round(faits / total * 100) : 0 };
  }
  const cleEtape = (ob, e) => 'e:' + ob.id + ':' + e.id;
  function basculerEtape(ob, e) {
    const cle = cleEtape(ob, e);
    if (e.faitLe) { e.faitLe = null; U.decoche = true; const pts = reprendre(cle); return pts ? `Étape décochée : −${pts} pts.` : 'Étape décochée.'; }
    e.faitLe = Date.now();
    const c = cat(ob.cat);
    return `Étape franchie : +${gagner(cle, c.points, aujourdhui(), 'etape', c.id)} pts.`;
  }
  // Objectif atteint (100 %) : bonus de 5 fois la valeur de sa catégorie. Repris seulement si on décoche quelque chose.
  function verifierObjectifs() {
    const decoche = U.decoche;
    U.decoche = false;
    S.objectifs.forEach(ob => {
      const a = avancement(ob);
      const cle = 'o:' + ob.id;
      if (a.total && a.faits === a.total) {
        if (!ob.atteintLe) {
          ob.atteintLe = Date.now();
          const c = cat(ob.cat);
          gagner(cle, c.points * CONFIG.points.bonusObjectif, aujourdhui(), 'objectif', c.id);
          U.objectifAtteint = ob;
        }
      } else if (ob.atteintLe && decoche) {
        ob.atteintLe = null;
        reprendre(cle);
      }
    });
  }

  // ---------- Statistiques ----------
  // Nombre de choses faites dans une catégorie entre deux jours (inclus) : tâches cochées et habitudes faites
  function faitsCat(catId, de, a) {
    let n = 0;
    S.elements.forEach(el => {
      if (el.type !== 'tache' || el.cat !== catId) return;
      Object.keys(el.faits).forEach(k => { if (k >= de && k <= a && tombe(el, k)) n++; });
    });
    S.habitudes.forEach(h => { if (h.cat !== catId) return; Object.keys(h.faits).forEach(k => { if (k >= de && k <= a) n++; }); });
    return n;
  }
  // Part des objectifs par semaine atteinte sur une fenêtre de « jours » jours finissant le jour « fin »
  function tauxObjectifs(jours, fin) {
    const de = decaler(fin, -(jours - 1));
    let cible = 0, atteint = 0;
    S.categories.filter(c => c.active && c.objectif > 0).forEach(c => {
      const ci = c.objectif * jours / 7;
      cible += ci;
      atteint += Math.min(faitsCat(c.id, de, fin), ci);
    });
    return cible ? atteint / cible : null;
  }
  function gainsEntre(de, a) {
    const r = { total: 0, cats: {}, src: {} };
    Object.keys(S.gains).forEach(k => {
      if (k < de || k > a) return;
      const g = S.gains[k];
      r.total += g.total || 0;
      Object.keys(g.cats || {}).forEach(c => { r.cats[c] = (r.cats[c] || 0) + g.cats[c]; });
      Object.keys(g.src || {}).forEach(c => { r.src[c] = (r.src[c] || 0) + g.src[c]; });
    });
    return r;
  }
  const gainDuJour = k => (S.gains[k] && S.gains[k].total) || 0;
  function focusEntre(de, a) {
    const r = { total: 0, sessions: 0, cats: {} };
    S.focus.forEach(f => { if (f.jour < de || f.jour > a) return; r.total += f.min; r.sessions++; r.cats[f.cat] = (r.cats[f.cat] || 0) + f.min; });
    return r;
  }
  // JOMO sur une fenêtre : temps pour moi gardés, moments sans écran tenus, jours sous le plafond (parmi les jours avec des tâches)
  function jomoEntre(de, a) {
    let libres = 0, libresTotal = 0, tenus = 0, ecransTotal = 0, sous = 0, joursPrevus = 0;
    const auj = aujourdhui();
    for (let k = de; k <= a; k = decaler(k, 1)) {
      duJour(k).forEach(o => {
        if (o.el.type === 'libre' && finOcc(o) <= Date.now()) { libresTotal++; if (S.payes[o.cle] && S.payes[o.cle].pts > 0) libres++; }
        if (o.el.type === 'sansecran' && finOcc(o) <= Date.now()) { ecransTotal++; if (S.tenus[o.cle] === true) tenus++; }
      });
      if (k <= auj) { const m = minutesPrevues(k); if (m) { joursPrevus++; if (m <= S.reglages.plafond) sous++; } }
    }
    return { libres, libresTotal, tenus, ecransTotal, sous, joursPrevus };
  }

  // ---------- Minuteur de concentration (Pomodoro) ----------
  // État enregistré : il survit à la fermeture de l'app. Les phases se suivent sur des horodatages.
  function demarrerMinuteur(o, catId) {
    const el = o ? o.el : null;
    S.minuteur = { phase: 'travail', debut: Date.now(), fin: Date.now() + S.reglages.travail * 6e4, reste: null, cle: o ? o.cle : null,
      cat: el ? cat(el.cat).id : (catId || catsActives()[0].id), titre: el ? el.titre : null, cycle: 1 };
  }
  function noterFocus(min) {
    const M = S.minuteur;
    if (!M || min < 1) return;
    S.focus.push({ jour: aujourdhui(), cat: M.cat, min: Math.round(min), cle: M.cle, le: Date.now() });
  }
  // Fait avancer le minuteur : fin de travail (le temps est compté, la pause démarre), fin de pause (on attend le feu vert)
  function avancerMinuteur() {
    const M = S.minuteur;
    if (!M || M.reste != null || !M.fin || Date.now() < M.fin) return null;
    if (M.phase === 'travail') {
      noterFocus((M.fin - M.debut) / 6e4);

  // Emblème : un cristal qui se pare à chaque palier (Éclat, Cristal, Étoile, Constellation, Nova)
  let nEmb = 0;
  function embleme(id) {
    const n = ++nEmb;
    const etoile = (cx, cy, R, r) => {
      const p = [];
      for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + i * Math.PI / 4, d = i % 2 ? r : R; p.push([cx + d * Math.cos(a), cy + d * Math.sin(a)]); }
      return p;
    };
    const facettes = (cx, cy, R, r) => {
      const p = etoile(cx, cy, R, r);
      return p.map((pt, i) => { const q = p[(i + 1) % 8]; return `<path d="M${cx} ${cy}L${pt[0].toFixed(1)} ${pt[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}z" fill="${i % 2 ? `url(#ec${n})` : `url(#ef${n})`}"/>`; }).join('');
    };
    const simple = (cx, cy, R, r, c) => `<path d="M${etoile(cx, cy, R, r).map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L')}z" fill="${c}"/>`;

    const R = [26, 32, 34, 30, 32][niveau] || 26;

    if (niveau >= 3) {
      const pts = [[18, 24], [84, 30], [78, 82]];
      extra += `<path d="M18 24L50 50L84 30M50 50L78 82" stroke="#8fa2ff" stroke-width=".9" opacity=".55" fill="none"/>` + pts.map(([x, y]) => simple(x, y, 6, 1.8, '#cfd8ff')).join('');
    }
    if (niveau >= 4) fond = `<circle cx="50" cy="50" r="44" fill="url(#eh${n})"/><circle cx="50" cy="50" r="40" fill="none" stroke="#b9a6ff" stroke-width="1" opacity=".5"/>`;

      <radialGradient id="eg${n}"><stop offset="0" stop-color="#7f8cff" stop-opacity=".75"/><stop offset="1" stop-color="#7f8cff" stop-opacity="0"/></radialGradient>
      <radialGradient id="eh${n}"><stop offset=".55" stop-color="#8a5cff" stop-opacity="0"/><stop offset=".85" stop-color="#8a5cff" stop-opacity=".35"/><stop offset="1" stop-color="#8a5cff" stop-opacity="0"/></radialGradient></defs>

  // ---------- Accueil ----------
  // Petite courbe du total de points sur 14 jours (décor : le nombre est écrit à côté)
  function courbePoints() {
    const auj = aujourdhui(), jours = Array.from({ length: 14 }, (_, i) => decaler(auj, i - 13));
    let total = S.points;
    const valeurs = [];
    for (let i = jours.length - 1; i >= 0; i--) { valeurs[i] = total; total -= gainDuJour(jours[i]); }
    const min = Math.min(...valeurs), max = Math.max(...valeurs), et = max - min || 1;
    const pts = valeurs.map((v, i) => [i / 13 * 200, 62 - (v - min) / et * 46]);
    const ligne = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
    return `<svg class="courbe" viewBox="0 0 200 70" preserveAspectRatio="none" aria-hidden="true"><defs>
      <linearGradient id="cp-f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7a5cff" stop-opacity="0"/></linearGradient>
      <linearGradient id="cp-l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f6bff"/><stop offset="1" stop-color="#b38bff"/></linearGradient></defs>
      <path d="${ligne}L200 70L0 70z" fill="url(#cp-f)"/><path d="${ligne}" fill="none" stroke="url(#cp-l)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;

    return res;

          <span class="titre-mini" aria-hidden="true">🔥 Série</span><b aria-hidden="true">${s} j</b><small aria-hidden="true">Meilleure : ${Math.max(S.meilleureSerie, s)} j</small></button>
        <button type="button" class="carte mini" data-action="minuteur" data-focus="minuteur" aria-label="${M ? 'Concentration en cours : ouvrir le minuteur' : `Concentration : ${duree(foc.total)} aujourd'hui. Lancer une session`}">
          <span class="titre-mini" aria-hidden="true">⏱️ Concentration</span>
          <b aria-hidden="true" ${M ? 'data-reste-mini' : ''}>${M ? texteMinuteurCourt() : duree(foc.total)}</b>
          <small aria-hidden="true">${M ? ({ travail: 'Session en cours', pause: 'Pause', pret: 'Prêt à reprendre' }[M.phase]) : 'Lancer une session'}</small></button>
      </div>`;
  }
  // ---------- Calendrier ----------
  function vueCalendrier() {
    const mois = S.vueCal !== 'jour';
    return `
      <header class="tete">
        <div><h1>Calendrier</h1><p>Planifie. Organise. Réussis.</p></div>
        <div class="actions-tete">
          <button type="button" class="icone-bouton" data-action="chercher" aria-label="Chercher" aria-keyshortcuts="/" data-focus="chercher">${ICONE.loupe}</button>
          <button type="button" class="icone-bouton" data-action="aujourdhui" aria-label="Aujourd'hui" data-focus="auj">${ICONE.calendrier}</button>
        </div>
      </header>
      <div class="segments" role="group" aria-label="Affichage">
        <button type="button" aria-pressed="${mois}" data-vue-cal="mois" data-focus="vc-mois">Mois</button>
