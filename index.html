          <small style="margin-top:4px">${recent ? `🛟 ${cap(quandJour(recent))} est pardonné : ta série continue. Prochain joker ${quandJour(decaler(recent, CONFIG.pardon))}.` : habs.length ? '🛟 Joker prêt : un jour raté par semaine ne casse pas ta série.' : ''}</small>
          ${dues.length ? `<small style="margin-top:4px">Aujourd'hui : ${faites} / ${dues.length}${faites === dues.length ? ' · journée gagnée ✓' : ''}</small>` : ''}</div></div>
        <div class="lignes">${habs.length ? habs.map(ligneHabitudeGestion).join('') : '<p class="carte vide">Pas encore d\'habitude. Méditer, lire 10 pages, marcher… Commence petit, tiens longtemps.</p>'}</div>
        <button type="button" class="bouton" data-action="nouvelle-habitude" data-focus="nh">${ICONE.plus} Nouvelle habitude</button>`

  // ---------- Progression ----------

  // Points gagnés jour par jour (ou semaine par semaine sur 90 jours) : barres, valeur la plus haute écrite

  function phraseEncouragement(taux, diff, s) {

  }
  // ---------- Bilan de la semaine ----------

  // Une catégorie dans le bilan : faits, objectif, bonus (versé, ou à venir pour la semaine en cours)

      const p = S.payes[cleSemaine(lundi, c.id)], objectif = (p && p.obj) || c.objectif, n = faitsCat(c.id, lundi, dim);

  function statsSemaine(lundi) {

  function phraseBilan(st) {

  };

  // ---------- Priorités de la semaine ----------

  // ---------- La feuille du bilan ----------

  function miniStat(icone, titre, val, sous, label) {

    const prioRevue = !st.enCours ? `<section aria-labelledby="b-prio">

        ${st.prio.length ? `<ul class="groupe prio-revue">${st.prio.map(p => `<li class="${p.fait ? 'faite' : ''}"><span class="marque-prio" aria-hidden="true">${p.fait ? ICONE.coche : ''}</span><span>${esc(p.titre)}<span class="masque"> : ${p.fait ? 'tenue' : 'pas tenue'}</span></span></li>`).join('')}</ul>`

    const se = st.J, sur = (n, t) => t ? `${n}<small> / ${t}</small>` : '—';
    const stats = `<section aria-labelledby="b-stats">

    const npf = B.cible ? pasFaites().length : 0;

    const edit = B.cible ? `<section aria-labelledby="b-cible" class="b-cible">

    corps.innerHTML = nav + hero + (st.enCours ? edit + cats : cats + prioRevue) + bilanIdentites(B.lundi) + stats + reflexionBilan(B.lundi) + (st.enCours ? '' : edit);
    pied.innerHTML = B.cible ? `<button type="button" class="bouton" data-b="fermer">${B.auto ? 'C\'est parti !' : 'Enregistrer'}</button>`

    if (focus) { const c = BD.querySelector(`[data-focus="${focus}"]`); if (c && !c.disabled) c.focus(); else { const t = BD.querySelector('[data-fermer]'); if (t) t.focus(); } }
  }
  BD.addEventListener('click', e => {
    const n = e.target.closest('[data-b-nav]');
    if (n) {

  BD.addEventListener('change', e => { if (e.target.matches('[data-prio]')) lirePriorites(); });
  // Entrée sur un champ : au suivant, puis on range le clavier
  BD.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.matches('[data-prio]')) return;
    e.preventDefault();
    const champs = [...BD.querySelectorAll('[data-prio]')], i = champs.indexOf(e.target);
    if (i < champs.length - 1) champs[i + 1].focus(); else e.target.blur();
  });
  BD.addEventListener('close', () => {
    lirePriorites();
    render();
    if (!B.change) return;
    B.change = false;
    const n = prioritesDe(lundiDe(aujourdhui())).length;
    dire(!n ? 'Priorités retirées.' : `${pluriel(n, 'priorité')} pour ta semaine 🎯`);
  });
  // Le lundi (dès 5 h) ou au premier passage de la semaine : le bilan de la semaine passée, une fois
  function proposerBilan() {
    if (V.etat !== 'ouvert' || document.querySelector('dialog[open]')) return;
    const auj = aujourdhui(), lundi = lundiDe(auj);
    if (S.bilanVu === lundi || decaler(lundi, -1) < (S.depuis || auj)) return feterNiveau();
    if (auj === lundi && minNow() < 5 * 60) return feterNiveau();
    S.bilanVu = lundi;
    ecrire();
    ouvrirBilan(decaler(lundi, -7), true);
  }
  // ---------- Tâches pas faites ----------
  // Les tâches non cochées des 7 derniers jours (avant aujourd'hui). Pour chacune : je l'ai faite, la reporter
  // (aujourd'hui, demain, ou un autre moment), ou la laisser partir — JOMO : rater sans regret, sans points ni pénalité.
  // Laissées partir : S.partis = { clé de l'occurrence : jour de la décision }.
  function pasFaites() {
    const auj = aujourdhui(), res = [];
    for (let i = 7; i >= 1; i--) {
      const k = decaler(auj, -i);
      if (k < (S.depuis || auj)) continue;
      duJour(k).forEach(o => { if (o.el.type === 'tache' && !o.fait && !S.partis[o.cle]) res.push(o); });
    }
    return res;
  }
  // Prochain créneau libre de cette durée, entre 8 h et 22 h, à partir d'un jour (et d'une heure ce jour-là)
  function creneauLibre(k, duree, sans, apres) {
    const occupe = duJour(k).filter(o => o.cle !== sans && !o.el.flou).map(o => [o.el.debut, o.el.fin]);
    for (let m = Math.max(8 * 60, apres || 0); m + duree <= 22 * 60; m += CONFIG.pas) {
      if (!occupe.some(([a, b]) => m < b && m + duree > a)) return { k, debut: m, fin: m + duree };
    }
    return null;
  }
  const libreA = (k, debut, fin, sans) => !duJour(k).some(o => o.cle !== sans && !o.el.flou && debut < o.el.fin && fin > o.el.debut);
  // Propositions pour reporter : aujourd'hui (même heure si elle est encore à venir et libre, sinon le prochain créneau libre),
  // demain (même heure si libre, sinon le créneau libre qui suit)
  function propositions(o) {
    const auj = aujourdhui(), dem = decaler(auj, 1), d = o.el.debut, f = o.el.fin, du = f - d;
    const tot = Math.ceil((minNow() + 5) / CONFIG.pas) * CONFIG.pas;
    const res = [];
    if (o.el.flou) return [{ k: auj, debut: d, fin: f }, { k: dem, debut: d, fin: f }];       // sans heure : le jour seul compte
    const a = d >= tot && libreA(auj, d, f, o.cle) ? { k: auj, debut: d, fin: f } : creneauLibre(auj, du, o.cle, tot);
    if (a) res.push(a);
    const b = libreA(dem, d, f, o.cle) ? { k: dem, debut: d, fin: f } : creneauLibre(dem, du, o.cle);
    if (b) res.push(b);
    return res;
  }
  const quandCourt = k => { const a = aujourdhui(); return k === a ? "Aujourd'hui" : k === decaler(a, 1) ? 'Demain' : cap(fmt(k, { weekday: 'long', day: 'numeric' })); };

  // ---------- Sur l'accueil ----------
  function cartePasFaites() {
    const n = pasFaites().length;

    return `<button type="button" class="carte b-entree pf-entree" data-action="pas-faites" data-focus="pas-faites">
        <span class="tuile" style="--c:#ffb547" aria-hidden="true">📋</span><span class="quoi"><b>${pluriel(n, 'tâche pas faite', 'tâches pas faites')}</b><small>Coche, reporte ou laisse partir.</small></span>${ICONE.droite}</button>`;

  // ---------- La page « Pas faites » ----------
  const PF = $('#pas-faites');
  const P = { ouverte: null };          // clé de la tâche dont les choix de report sont dépliés

  function renderPasFaites(focus) {

    } else {
      const jours = [...new Set(l.map(o => o.k))].sort().reverse();
      corps.innerHTML = `<p class="note">Les 7 derniers jours. Rien de grave : décide, puis passe à autre chose. 🌿</p>` + jours.map(k => `
        <section class="pf-jour" aria-labelledby="pf-${k}"><h3 id="pf-${k}">${k === decaler(aujourdhui(), -1) ? 'Hier' : jourLong(k)}</h3>
          ${l.filter(o => o.k === k).map(o => {
            const lk = look(o.el), pts = prevue(o) ? `+${valeur(o.el)} pts si faite` : '0 pt (ajoutée le jour même)';
            const ouv = P.ouverte === o.cle, props = ouv ? propositions(o) : [];
            return `<div class="carte pf-item" style="--c:${lk.couleur}" role="group" aria-label="${esc(o.el.titre)}, ${esc(quandJour(o.k))}, ${plage(o.el)}, ${esc(lk.nom)}">
              <div class="pf-haut"><span class="tuile petite" aria-hidden="true">${lk.icone}</span><span class="quoi" aria-hidden="true"><b>${esc(o.el.titre)}</b><small>${plage(o.el)} · ${esc(lk.nom)} · ${pts}</small></span></div>
              <div class="pf-actions">
                <button type="button" class="pf-b" data-pf="fait" data-cle="${o.cle}" data-focus="pff${o.cle}">${ICONE.coche}<span>Faite</span></button>
                <button type="button" class="pf-b" data-pf="reporter" data-cle="${o.cle}" aria-expanded="${ouv}" data-focus="pfr${o.cle}">${ICONE.repeter}<span>Reporter</span></button>
                <button type="button" class="pf-b" data-pf="partir" data-cle="${o.cle}" data-focus="pfp${o.cle}"><span aria-hidden="true">🍃</span><span>Laisser partir</span></button>
              </div>
              ${ouv ? `<div class="pf-reports" role="group" aria-label="Reporter « ${esc(o.el.titre)} »">
                ${props.map((p, i) => `<button type="button" class="bouton petit secondaire" data-pf="mettre" data-cle="${o.cle}" data-k="${p.k}" data-debut="${p.debut}" data-fin="${p.fin}" data-focus="pfm${i}${o.cle}">${quandCourt(p.k)}${o.el.flou ? '' : ' · ' + hhmm(p.debut)}</button>`).join('')}
                <button type="button" class="bouton petit secondaire" data-pf="choisir" data-cle="${o.cle}" data-focus="pfc${o.cle}">Choisir…</button></div>` : ''}
            </div>`;
          }).join('')}

    }
    if (focus) {
      const c = PF.querySelector(`[data-focus="${CSS.escape(focus)}"]`) || PF.querySelector('[data-pf="fait"]') || PF.querySelector('[data-fermer-pf]');

  }
  // Après une décision, le focus passe à la tâche suivante
  function suivante(cle) {
    const l = pasFaites(), i = l.findIndex(o => o.cle === cle);
    return i >= 0 ? 'pff' + cle : l.length ? 'pff' + l[0].cle : null;
  }
  async function reporter(o, p) {
    if (!(await accepterPlafond(p.k, o.cle, p.debut, p.fin))) return null;
    const cle = appliquer(o, { date: p.k, debut: p.debut, fin: p.fin }, 'une');

  }
  PF.addEventListener('click', async e => {
    if (e.target.closest('[data-fermer-pf]')) { PF.close(); return; }
    const b = e.target.closest('[data-pf]');
    if (!b) return;
    const a = b.dataset.pf;
    if (a === 'tout-partir') {
      const l = pasFaites(), auj = aujourdhui();
      l.forEach(o => { S.partis[o.cle] = auj; });
      sauver();
      P.ouverte = null;

      dire(`${pluriel(l.length, 'tâche laissée', 'tâches laissées')} partir. Sans regret. 🍃`);
      const f = PF.querySelector('[data-fermer-pf]'); if (f) f.focus();
      return;
    }
    const o = trouver(b.dataset.cle);
    if (!o) return;
    if (a === 'fait') {
      const msg = basculerTache(o);

  // La feuille d'une tâche ouverte par « Choisir… » se ferme : la liste se met à jour

  // ---------- Jour difficile ----------
  async function jourDifficile() {
    const auj = aujourdhui();
    if (difficilesSemaine(auj) >= CONFIG.difficilesParSemaine) return dire(`Déjà ${CONFIG.difficilesParSemaine} jours difficiles cette semaine. Fais ce que tu peux : ta série pardonne un jour raté.`);
    const oui = await demander('Journée difficile ?', `Ça arrive. Aujourd'hui, tes habitudes passent en version minimale : moitié des points, et ta série continue. ${CONFIG.difficilesParSemaine} jours par semaine au plus.`,
      [{ texte: 'Passer en version mini', valeur: true }, { texte: 'Non, ça va', valeur: false, clair: true }]);
    if (!oui) return;
    S.difficiles[auj] = true;
    sauver();
    $('#ecran').scrollTop = 0;
    render('dur');
    dire('Jour difficile : le minimum suffit. 🌧️');
  }
  // Reporter à demain les tâches d'aujourd'hui pas encore commencées (même heure si libre, sinon le créneau libre qui suit)
  function allegerJournee() {
    const auj = aujourdhui(), dem = decaler(auj, 1);
    let n = 0;
    duJour(auj).filter(o => o.el.type === 'tache' && !o.fait && o.el.debut > minNow()).forEach(o => {
      const d = o.el.debut, f = o.el.fin;
      const p = libreA(dem, d, f, o.cle) ? { debut: d, fin: f } : (creneauLibre(dem, f - d, o.cle, d) || creneauLibre(dem, f - d, o.cle));
      if (!p) return;
      appliquer(o, { date: dem, debut: p.debut, fin: p.fin }, 'une');
      n++;
    });
    sauver();
    U.garderDefilement = true;
    render('dur');
    dire(n ? `${pluriel(n, 'tâche reportée', 'tâches reportées')} à demain. Souffle. 🌿` : 'Demain est déjà plein : rien n\'a bougé.');
  }

  // ---------- Retour après une absence : sans reproche ----------
  let accueilEnCours = false;
  async function accueillir() {
    if (accueilEnCours || V.etat !== 'ouvert' || document.querySelector('dialog[open]')) return;
    const auj = aujourdhui(), absence = S.vu ? ecart(S.vu, auj) : 0;
    if (S.vu !== auj) { S.vu = auj; ecrire(); }
    if (absence >= CONFIG.absence) {
      accueilEnCours = true;
      const n = pasFaites().length, best = S.meilleureSerie;
      const texte = `${absence} jours loin d'ASCEND : ça arrive à tout le monde, et rien n'est perdu. Tes ${nombre(S.points)} points sont là${best ? `, ta meilleure série (${pluriel(best, 'jour')}) aussi` : ''}. Ce qui compte, c'est aujourd'hui : une seule chose suffit pour repartir.`
        + (n ? ` ${pluriel(n, 'tâche t\'attendait', 'tâches t\'attendaient')} : tu peux les laisser partir d'un geste.` : '');
      const r = await demander(`Content de te revoir${S.profil.prenom ? ', ' + S.profil.prenom : ''}`, texte,
        n ? [{ texte: 'Repartir à neuf', valeur: 'neuf' }, { texte: 'Voir ce que j\'ai manqué', valeur: 'voir', clair: true }] : [{ texte: 'C\'est reparti', valeur: 'ok' }]);
      accueilEnCours = false;
      if (r === 'neuf') { pasFaites().forEach(o => { S.partis[o.cle] = auj; }); sauver(); render(); dire('Page tournée. On repart d\'ici. 🍃'); }
      if (r === 'voir') return ouvrirPasFaites();
    }
    proposerBilan();
  }
  // ---------- Qui je deviens ----------
  // 1 à 4 identités (« Athlète », « Bâtisseur »…). Chaque catégorie peut en nourrir une : chaque tâche ou habitude faite
  // dans cette catégorie est un acte qui te fait devenir cette personne. S.identites = [{ id, nom, icone, phrase }] ; categorie.identite = id.
  const IDEES = [['Athlète', '🏃', 'Je prends soin de mon corps, chaque semaine.'], ['Bâtisseur', '🏗️', 'J\'avance sur ce qui compte, pas seulement sur l\'urgent.'],
    ['Esprit curieux', '📚', 'J\'apprends quelque chose chaque jour.'], ['Présent pour les miens', '🤝', 'Je donne du temps à ceux que j\'aime.'],
    ['Serein', '🧘', 'Je protège mon calme et mon repos.'], ['Créateur', '🎨', 'Je fabrique, j\'écris, je crée.']];
  const EMOJIS_ID = ['🏃', '🏗️', '📚', '🤝', '🧘', '🎨', '💪', '🧠', '❤️', '🌱', '🎯', '✨'];
  const identite = id => S.identites.find(x => x.id === id) || null;
  const catsIdentite = id => S.categories.filter(c => c.identite === id);
  const identiteDeCat = catId => { const c = S.categories.find(x => x.id === catId); return c && c.identite ? identite(c.identite) : null; };
  // Actes d'une identité sur une période, et part de ses objectifs de la semaine déjà tenue
  function statsIdentite(idt, a, b) {
    const cats = catsIdentite(idt.id), G = gainsEntre(a, b);
    let actes = 0, vise = 0, tenu = 0, pts = 0;
    cats.forEach(c => { const n = faitsCat(c.id, a, b); actes += n; pts += G.cats[c.id] || 0; if (c.active && c.objectif) { vise += c.objectif; tenu += Math.min(n, c.objectif); } });
    return { cats, actes, pts, taux: vise ? tenu / vise : null };
  }
  const enSommeil = idt => { const auj = aujourdhui(); return catsIdentite(idt.id).length > 0 && statsIdentite(idt, decaler(auj, -6), auj).actes === 0; };
  // Après une tâche ou une habitude faite : « tu deviens… »
  const echoIdentite = catId => { const i = identiteDeCat(catId); return i ? ` · ${i.icone} ${i.nom}` : ''; };

  function ligneIdentite(idt, a, b, focus) {
    const st = statsIdentite(idt, a, b), dort = enSommeil(idt), pc = st.taux == null ? null : Math.round(st.taux * 100);
    const lab = `${idt.nom} : ${pluriel(st.actes, 'acte')} cette semaine${pc == null ? '' : `, ${pc} % de ses objectifs`}${dort ? ', en sommeil depuis 7 jours' : ''}${st.cats.length ? '' : ', aucune catégorie rattachée'}. Modifier`;
    return `<button type="button" class="idt-ligne${dort ? ' dort' : ''}" data-identite="${esc(idt.id)}" data-focus="${focus}${esc(idt.id)}" aria-label="${esc(lab)}">
        <span class="tuile" aria-hidden="true">${idt.icone}</span>
        <span class="quoi" aria-hidden="true"><b>${esc(idt.nom)}</b><small>${st.cats.length ? (dort ? 'En sommeil : un petit acte la réveille' : esc(st.cats.map(c => c.nom).join(' · '))) : 'Rattache-lui une catégorie'}</small>
          ${pc == null ? '' : `<span class="barre-obj"><i style="width:${Math.max(pc, 2)}%"></i></span>`}</span>
        <span class="idt-val" aria-hidden="true"><b>${st.actes}</b><small>${st.actes > 1 ? 'actes' : 'acte'}</small></span></button>`;
  }
  // Sur l'accueil
  function carteIdentites() {
    const l = lundiDe(aujourdhui()), d = decaler(l, 6);
    if (!S.identites.length) return `<button type="button" class="carte b-entree" data-action="identites" data-focus="idt">
        <span class="tuile" style="--c:#e4d3b3" aria-hidden="true">🧭</span><span class="quoi"><b>Qui veux-tu devenir ?</b><small>Donne un sens à tes points : choisis 1 à 4 identités.</small></span>${ICONE.droite}</button>`;
    return `<section class="carte pad idt" aria-labelledby="idt-titre">
        <div class="section-tete"><h2 id="idt-titre">Qui je deviens</h2><button type="button" class="lien" data-action="identites" data-focus="idt" aria-label="Modifier mes identités">Modifier</button></div>
        <div class="idt-liste">${S.identites.map(i => ligneIdentite(i, l, d, 'idt')).join('')}</div></section>`;
  }
  // Dans le bilan de la semaine
  function bilanIdentites(lundi) {
    if (!S.identites.length) return '';
    const dim = decaler(lundi, 6);
    const l = S.identites.map(i => ({ i, st: statsIdentite(i, lundi, dim) })).sort((x, y) => y.st.actes - x.st.actes);
    return `<section aria-labelledby="b-idt"><div class="section-tete"><h3 id="b-idt">Qui tu as nourri</h3></div>
        <ul class="groupe prio-revue idt-revue">${l.map(({ i, st }) => `<li class="${st.actes ? 'faite' : ''}"><span class="tuile petite" aria-hidden="true">${i.icone}</span>
          <span>${esc(i.nom)}<small>${st.actes ? `${pluriel(st.actes, 'acte')} · +${nombre(st.pts)} pts` : (st.cats.length ? 'rien cette semaine-là' : 'aucune catégorie rattachée')}</small></span></li>`).join('')}</ul></section>`;
  }

  // ---------- La page ----------
  const ID = $('#identites');
  const I = { edit: null, brouillon: null };       // edit : id, 'nouveau' ou null (liste)
  function ouvrirIdentites(id) {

  }
  function editerIdentite(id) {
    const x = id === 'nouveau' ? null : identite(id);
    I.edit = x ? x.id : 'nouveau';
    I.brouillon = x ? { nom: x.nom, icone: x.icone, phrase: x.phrase || '', cats: catsIdentite(x.id).map(c => c.id) } : { nom: '', icone: '🎯', phrase: '', cats: [] };
    renderIdentites();
  }
  function renderIdentites(focus) {
    const corps = $('#i-corps'), pied = $('#i-pied'), haut = ID.querySelector('[data-i-retour]');
    ID.querySelector('.f-msg').textContent = '';
    if (!I.edit) {

      corps.innerHTML = `<p class="note">Tu ne coches pas des cases : tu deviens quelqu'un. Choisis 1 à 4 identités et rattache-leur tes catégories. Chaque tâche ou habitude faite est un acte de plus.</p>
        ${S.identites.length ? `<div class="groupe idt-liste">${S.identites.map(i => ligneIdentite(i, l, d, 'idl')).join('')}</div>` : '<p class="carte vide">Aucune identité pour l\'instant. Qui veux-tu être dans un an ?</p>'}`;
      pied.innerHTML = S.identites.length < 4 ? `<button type="button" class="bouton" data-i="nouvelle" data-focus="i-nouvelle">${ICONE.plus} Ajouter une identité</button>` : `<p class="note" style="text-align:center">4 identités au plus : choisir, c'est renoncer.</p>`;
    } else {
      const b = I.brouillon, nouveau = I.edit === 'nouveau';
      haut.innerHTML = ICONE.gauche; haut.setAttribute('aria-label', 'Retour');
      $('#i-titre').textContent = nouveau ? 'Nouvelle identité' : 'Identité';
      const prises = S.identites.map(x => x.nom);
      corps.innerHTML = `
        ${nouveau ? `<div><span class="etiquette" id="i-idees">Des idées</span><div class="pastilles" role="group" aria-labelledby="i-idees">${IDEES.filter(x => !prises.includes(x[0])).map((x, n) => `<button type="button" class="pastille" data-i-idee="${IDEES.indexOf(x)}" data-focus="idee${n}">${x[1]} ${x[0]}</button>`).join('')}</div></div>` : ''}
        <label class="champ-nom"><span aria-hidden="true">${b.icone}</span><span class="masque">Nom de l'identité</span><input name="i-nom" maxlength="40" autocomplete="off" placeholder="Athlète, Bâtisseur…" value="${esc(b.nom)}"></label>
        <div><span class="etiquette" id="i-ic">Symbole</span><div class="pastilles" role="radiogroup" aria-labelledby="i-ic">${EMOJIS_ID.map((e, n) => `<button type="button" class="pastille ronde" role="radio" aria-checked="${e === b.icone}" aria-label="Symbole ${e}" data-i-icone="${e}" data-focus="ic${n}">${e}</button>`).join('')}</div></div>
        <div><label class="etiquette" for="i-phrase">Ce que ça veut dire <span class="sous">facultatif</span></label>
          <label class="champ-nom"><span aria-hidden="true">💬</span><input id="i-phrase" name="i-phrase" maxlength="80" autocomplete="off" placeholder="Je suis quelqu'un qui…" value="${esc(b.phrase)}"></label></div>
        <div><span class="etiquette" id="i-cats">Les catégories qui la nourrissent</span>
          <div class="groupe" role="group" aria-labelledby="i-cats">${S.categories.filter(c => c.active || b.cats.includes(c.id)).map(c => { const autre = c.identite && c.identite !== I.edit ? identite(c.identite) : null;
            return `<label class="rang"><span><span class="tuile petite" style="--c:${c.couleur}" aria-hidden="true">${c.icone}</span><span>${esc(c.nom)}${autre && !b.cats.includes(c.id) ? `<span class="sous">nourrit déjà « ${esc(autre.nom)} »</span>` : ''}</span></span>
              <span class="interrupteur"><input type="checkbox" role="switch" data-i-cat="${esc(c.id)}"${b.cats.includes(c.id) ? ' checked' : ''}><i></i></span></label>`; }).join('')}</div>
          <p class="note" style="margin-top:8px">Une catégorie nourrit une seule identité.</p></div>
        <p class="erreur" id="i-erreur" role="alert"></p>
        ${nouveau ? '' : `<button type="button" class="bouton danger" data-i="supprimer">${ICONE.corbeille} Retirer cette identité</button>`}`;
      pied.innerHTML = `<button type="button" class="bouton" data-i="enregistrer">${nouveau ? 'Devenir cette personne' : 'Enregistrer'}</button>`;
    }
    if (focus) { const c = ID.querySelector(`[data-focus="${CSS.escape(focus)}"]`); if (c) c.focus(); }
  }
  const lireIdentite = () => { const n = ID.querySelector('[name="i-nom"]'), p = ID.querySelector('[name="i-phrase"]'); if (n) I.brouillon.nom = n.value.trim().replace(/\s+/g, ' '); if (p) I.brouillon.phrase = p.value.trim(); };
  ID.addEventListener('change', e => {
    const c = e.target.dataset && e.target.dataset.iCat;
    if (!c) return;
    const l = I.brouillon.cats;
    if (e.target.checked) { if (!l.includes(c)) l.push(c); } else l.splice(l.indexOf(c), 1);
  });
  ID.addEventListener('click', async e => {
    if (e.target.closest('[data-i-retour]')) { if (I.edit && S.identites.length) { I.edit = null; renderIdentites(); } else ID.close(); return; }
    const li = e.target.closest('[data-identite]');
    if (li) return editerIdentite(li.dataset.identite);
    const idee = e.target.closest('[data-i-idee]');
    if (idee) { const x = IDEES[+idee.dataset.iIdee]; lireIdentite(); Object.assign(I.brouillon, { nom: x[0], icone: x[1], phrase: x[2] }); return renderIdentites(); }
    const ic = e.target.closest('[data-i-icone]');
    if (ic) { lireIdentite(); I.brouillon.icone = ic.dataset.iIcone; return renderIdentites(ic.dataset.focus); }
    const b = e.target.closest('[data-i]');
    if (!b) return;
    const a = b.dataset.i;
    if (a === 'nouvelle') return editerIdentite('nouveau');
    if (a === 'enregistrer') {
      lireIdentite();
      const br = I.brouillon;
      if (!br.nom) { $('#i-erreur').textContent = 'Donne un nom à cette identité.'; ID.querySelector('[name="i-nom"]').focus(); return; }
      let x = identite(I.edit);
      if (!x) { x = { id: uid() }; S.identites.push(x); }
      Object.assign(x, { nom: br.nom.slice(0, 40), icone: br.icone, phrase: br.phrase.slice(0, 80) });
      S.categories.forEach(c => { if (br.cats.includes(c.id)) c.identite = x.id; else if (c.identite === x.id) c.identite = null; });
      sauver();
      const nouveau = I.edit === 'nouveau';
      I.edit = null;
      renderIdentites();
      ID.querySelector('.f-msg').textContent = '';
      dire(nouveau ? `${x.icone} ${x.nom} : chaque acte compte, à partir de maintenant.` : 'Identité enregistrée.');
      return;
    }
    if (a === 'supprimer') {
      const x = identite(I.edit);
      if (!(await demander('Retirer cette identité ?', `« ${x.nom} » ne sera plus suivie. Tes catégories, tes tâches et tes points ne changent pas.`, [{ texte: 'Retirer', valeur: true, danger: true }, { texte: 'Annuler', valeur: false, clair: true }]))) return;
      S.identites = S.identites.filter(y => y.id !== x.id);
      S.categories.forEach(c => { if (c.identite === x.id) c.identite = null; });
      sauver();
      I.edit = null;
      renderIdentites();
      dire('Identité retirée.');
    }
  });
  ID.addEventListener('close', () => { I.edit = null; render(); });
  // ---------- Énergie du jour ----------
  // Une note de 1 à 5, une fois par jour : S.energie = { jour : 1..5 }. Elle nourrit le coach.
  const ENERGIES = [['😴', 'À plat'], ['😕', 'Basse'], ['😐', 'Moyenne'], ['🙂', 'Bonne'], ['⚡', 'Au top']];
  function carteEnergie(bas) {
    const auj = aujourdhui(), e = S.energie[auj];
    if (bas ? !e : e) return '';
    return `<section class="carte pad energie${e ? ' notee' : ''}" aria-labelledby="en-titre">
        <h2 id="en-titre">${e ? 'Ton énergie aujourd\'hui' : 'Ton énergie aujourd\'hui ?'}</h2>
        <div class="en-choix" role="radiogroup" aria-labelledby="en-titre">${ENERGIES.map((x, i) => `<button type="button" role="radio" aria-checked="${e === i + 1}" aria-label="${x[1]} (${i + 1} sur 5)" data-energie="${i + 1}" data-focus="en${i + 1}"><span aria-hidden="true">${x[0]}</span><small aria-hidden="true">${x[1]}</small></button>`).join('')}</div></section>`;
  }
  function noterEnergie(n) {
    const auj = aujourdhui();
    if (S.energie[auj] === n) delete S.energie[auj]; else S.energie[auj] = n;
    sauver();
    U.garderDefilement = true;
    render('en' + n);
    if (S.energie[auj]) dire(n <= 2 ? `Énergie ${ENERGIES[n - 1][1].toLowerCase()} : noté. Ménage-toi. 🌿` : `Énergie ${ENERGIES[n - 1][1].toLowerCase()} : noté.`);
  }

  // ---------- Réflexion de la semaine (dans le bilan) ----------
  // S.reflexions = { lundi : { marche, change } } ; modifiable pour la semaine en cours et la précédente.
  function reflexionBilan(lundi) {
    const r = S.reflexions[lundi] || {}, modifiable = lundi >= decaler(lundiDe(aujourdhui()), -7);
    if (!modifiable && !r.marche && !r.change) return '';
    const champ = (cle, titre, aide) => modifiable
      ? `<label class="refl-champ"><span>${titre}</span><textarea data-refl="${cle}" rows="2" maxlength="200" placeholder="${aide}">${esc(r[cle] || '')}</textarea></label>`
      : (r[cle] ? `<div class="refl-champ"><span>${titre}</span><p>${esc(r[cle])}</p></div>` : '');
    return `<section aria-labelledby="b-refl" class="refl"><div class="section-tete"><h3 id="b-refl">Deux phrases pour toi</h3></div>
        <div class="groupe">${champ('marche', 'Ce qui a marché', 'Le sport le matin, couper le téléphone…')}${champ('change', 'Ce que je change', 'Une seule chose, concrète.')}</div></section>`;
  }
  function lireReflexion() {
    const champs = [...BD.querySelectorAll('[data-refl]')];
    if (!champs.length || !B.lundi) return;
    const r = {};
    champs.forEach(c => { const t = c.value.trim().slice(0, 200); if (t) r[c.dataset.refl] = t; });
    const avant = JSON.stringify(S.reflexions[B.lundi] || {});
    if (JSON.stringify(r) === avant) return;
    if (Object.keys(r).length) S.reflexions[B.lundi] = r; else delete S.reflexions[B.lundi];
    sauver();
  }
  BD.addEventListener('change', e => { if (e.target.matches('[data-refl]')) lireReflexion(); });
  BD.addEventListener('click', e => { if (e.target.closest('[data-b-nav], [data-b]')) lireReflexion(); }, true);
  BD.addEventListener('close', lireReflexion);
  // Ce que tu as décidé de changer (dernière réflexion), rappelé sur l'accueil
  function rappelChange() {
    const l = lundiDe(aujourdhui()), r = S.reflexions[decaler(l, -7)];
    return r && r.change ? `<p class="carte refl-rappel"><span aria-hidden="true">🔁</span><span><small>Cette semaine, je change</small>${esc(r.change)}</span></p>` : '';
  }

  // ---------- Le coach : des remarques tirées de tes propres données ----------
  // Chaque conseil : { id, icone, texte, action?: { nom, type, arg } }. « Compris » le masque 7 jours (S.conseilsVus).
  const virgule = n => String(Math.round(n * 10) / 10).replace('.', ',');
  function conseils() {
    const auj = aujourdhui(), lundi = lundiDe(auj), dim = decaler(lundi, 6), res = [];
    const depuis = S.depuis || auj;
    // 1. Énergie basse plusieurs jours de suite
    const e3 = [0, 1, 2].map(i => S.energie[decaler(auj, -i)]);
    if (e3.every(x => x && x <= 2) && !difficile(auj)) res.push({ id: 'energie-basse', icone: '🌧️', texte: 'Ton énergie est basse depuis 3 jours. Ce n\'est pas le moment de forcer : passe en version mini aujourd\'hui, et protège un temps pour toi.', action: { nom: 'Jour difficile', type: 'difficile' } });
    // 2. Un jour à venir dépasse le plafond
    for (let i = 0; i < 7; i++) { const k = decaler(auj, i), m = minutesPrevues(k);
      if (m > S.reglages.plafond) { res.push({ id: 'charge-' + k, icone: '⚖️', texte: `${cap(quandJour(k))} dépasse ton plafond : ${duree(m)} prévues pour ${duree(S.reglages.plafond)}. Allège-le tant qu'il est encore temps.`, action: { nom: 'Voir la journée', type: 'jour', arg: k } }); break; } }
    // 3. Une identité en sommeil
    const dort = S.identites.find(enSommeil);
    if (dort) { const c = catsIdentite(dort.id).find(x => x.active); res.push({ id: 'sommeil-' + dort.id, icone: dort.icone, texte: `« ${dort.nom} » dort depuis 7 jours. Pas besoin d'un exploit : un seul petit acte la réveille.`, action: c ? { nom: `Prévoir ${c.nom}`, type: 'ajouter', arg: c.id } : null }); }
    // 4. Un objectif jamais atteint sur 3 semaines : le baisser
    if (decaler(lundi, -21) >= lundiDe(depuis)) S.categories.filter(c => c.active && c.objectif > 1).some(c => {
      const faits = [1, 2, 3].map(i => faitsCat(c.id, decaler(lundi, -7 * i), decaler(lundi, -7 * i + 6)));
      if (faits.some(n => n >= c.objectif)) return false;
      const moy = (faits[0] + faits[1] + faits[2]) / 3, vise = Math.max(1, Math.ceil(moy));
      if (!moy || vise >= c.objectif) return false;       // une catégorie jamais utilisée n'est pas un objectif raté
      res.push({ id: 'objectif-' + c.id, icone: c.icone, texte: `${c.nom} : ${c.objectif} par semaine, jamais atteint en 3 semaines (${virgule(moy)} en moyenne). Vise ${vise} : un objectif tenu vaut mieux qu'un objectif rêvé.`, action: { nom: `Passer à ${vise} / semaine`, type: 'objectif', arg: c.id + '|' + vise } });
      return true;
    });
    // 5. Le meilleur moment pour une catégorie (4 dernières semaines)
    const debut = decaler(auj, -28) > depuis ? decaler(auj, -28) : depuis;
    const moments = {};
    for (let k = debut; k < auj; k = decaler(k, 1)) duJour(k).forEach(o => { if (o.el.type !== 'tache' || o.el.flou) return;
      const m = o.el.debut < 720 ? 0 : o.el.debut < 1080 ? 1 : 2, x = (moments[o.el.cat] = moments[o.el.cat] || [[0, 0], [0, 0], [0, 0]]); x[m][1]++; if (o.fait) x[m][0]++; });
    const NOMS = ['le matin', 'l\'après-midi', 'le soir'];
    let meilleur = null;
    Object.keys(moments).forEach(id => { const x = moments[id].map((v, i) => ({ i, f: v[0], n: v[1], t: v[1] ? v[0] / v[1] : 0 })).filter(v => v.n >= 3);
      if (x.length < 2) return; x.sort((a, b) => b.t - a.t); const haut = x[0], bas = x[x.length - 1], d = haut.t - bas.t;
      if (d >= .4 && (!meilleur || d > meilleur.d)) meilleur = { d, id, haut, bas }; });
    if (meilleur) { const c = cat(meilleur.id); res.push({ id: 'moment-' + c.id, icone: c.icone, texte: `Tu tiens ${c.nom} ${NOMS[meilleur.haut.i]} (${meilleur.haut.f} sur ${meilleur.haut.n}), rarement ${NOMS[meilleur.bas.i]} (${meilleur.bas.f} sur ${meilleur.bas.n}). Planifie-le ${NOMS[meilleur.haut.i]}.`, action: { nom: `Prévoir ${c.nom}`, type: 'ajouter', arg: c.id + '|' + [8 * 60, 14 * 60, 19 * 60][meilleur.haut.i] } }); }
    // 6. Ce qui te donne de l'énergie
    const notes = Object.keys(S.energie).filter(k => k >= decaler(auj, -60));
    if (notes.length >= 8) { let top = null;
      S.categories.filter(c => c.active).map(c => ({ nom: c.nom, icone: c.icone, test: k => faitsCat(c.id, k, k) > 0 }))

  // ---------- Vue Semaine ----------

  function avancementCat(c, lundi) {

  }
  // Un créneau à proposer pour une catégorie : un jour restant sans elle, à son heure et sa durée habituelles (sinon 18 h, 1 h)
  function creneauPourCat(c, lundi) {
    const auj = aujourdhui(), dim = decaler(lundi, 6), heures = {}, durees = {};

    const plus = t => { const l = Object.keys(t).sort((a, b) => t[b] - t[a]); return l.length ? +l[0] : null; };
    const debut = plus(heures) != null ? plus(heures) : 18 * 60, du = plus(durees) || 60;

    const tot = Math.ceil((minNow() + 5) / CONFIG.pas) * CONFIG.pas;

      if (debut >= min && debut + du <= 1440 && libreA(k, debut, debut + du)) return { k, debut, fin: debut + du };

  // ---------- Récompenses ----------

  const IDEES_REC = [['☕', 'Un café en terrasse', 100], ['🎬', 'Un film ou un épisode, sans culpabilité', 150], ['🛋️', 'Une soirée à ne rien faire', 300], ['🍽️', 'Un bon restaurant', 600], ['🎁', 'Un achat plaisir', 1500]];
  const EMOJIS_REC = ['🎁', '☕', '🎬', '🍽️', '🛋️', '🎮', '📚', '👟', '✈️', '💆', '🍫', '🎧'];

    const e = enCours();
    const msg = e && e.o.cle === cle ? terminer() : basculerTache(o);          // cocher la tâche commencée, c'est la terminer
    sauver();
    U.garderDefilement = true;
    render();
    dire(msg);
    feliciter();
  }

  // ---------- Gestes sur la grille (vue Jour) ----------
  // Souris : glisser sur un vide dessine une plage ; glisser une plage la déplace ; son bord bas la redimensionne.
  // Tactile : appui long puis glisser dessine ; appui long sur une plage la soulève ; les poignées la redimensionnent.
  // Un toucher simple sur un vide pose une « Nouvelle » plage d'une heure, à ajuster puis à toucher pour la remplir.
  let G = null;
  const actifG = () => G && ['creer', 'deplacer', 'redim'].includes(G.mode);
  function sous(e) {
    const r = G.cols.getBoundingClientRect(), n = G.cols.children.length;
    const i = borne(Math.floor((e.clientX - r.left) / (r.width / n)), 0, n - 1);
    return { min: (e.clientY - r.top) / H * 60, k: G.cols.children[i].dataset.jour, col: G.cols.children[i] };
  }
  function cible(blocEl) {
    if (blocEl.dataset.brouillon) return Object.assign({ brouillon: true }, U.brouillon);
    const o = trouver(blocEl.dataset.cle);
    return o ? { o, k: o.k, debut: o.el.debut, fin: o.el.fin } : null;
  }
  function demarrerG(mode) {
    G.mode = mode;
    clearTimeout(G.minuteur);
    try { G.cols.setPointerCapture(G.id); } catch (e) { /* déjà capturé */ }
    if (navigator.vibrate && G.tactile) { try { navigator.vibrate(8); } catch (e) { /* facultatif */ } }
    if (mode === 'creer') {
      const p = sous(G.depart);
      G.k = p.k;
      G.m0 = borne(Math.floor(p.min / CONFIG.pas) * CONFIG.pas, 0, 1440 - CONFIG.pas);
      G.vue = document.createElement('div');
      G.vue.className = 'bloc brouillon leve';
      G.vue.style.cssText = 'left:2px;width:calc(100% - 4px)';
      G.vue.innerHTML = '<span class="b-texte"><b>Nouvelle</b><small></small></span>';
      p.col.appendChild(G.vue);
      G.min0 = p.min; G.debut = G.m0; G.fin = Math.min(G.m0 + CONFIG.duree, 1440);
      majVueG();
      return;
    }
    G.t = cible(G.blocEl);
    if (!G.t) { G.mode = 'libre'; return; }
    G.debut = G.t.debut; G.fin = G.t.fin; G.k = G.t.k;
    G.min0 = sous(G.depart).min;
    G.vue = G.blocEl;
    G.vue.classList.add('leve');
    if (mode === 'deplacer') { G.vue.style.left = '2px'; G.vue.style.width = 'calc(100% - 4px)'; }
  }
  function majVueG() {
    const v = G.vue, h = Math.max((G.fin - G.debut) / 60 * H, 22);
    v.style.top = G.debut / 60 * H + 'px';
    v.style.height = h + 'px';
    v.classList.toggle('court', h < 42);
    const s = v.querySelector('.b-texte small');
    if (s) s.textContent = `${hhmm(G.debut)} – ${finTexte(G.fin)}`;
  }
  function suivre(e, sansBord) {
    const p = sous(e);
    if (G.mode === 'creer') {
      if (!G.bouge && Math.abs(p.min - G.min0) < CONFIG.pas) { G.debut = G.m0; G.fin = Math.min(G.m0 + CONFIG.duree, 1440); }
      else {
        G.bouge = true;
        const m = borne(caler(p.min), 0, 1440);
        if (m >= G.m0 + CONFIG.pas) { G.debut = G.m0; G.fin = m; }
        else if (m <= G.m0) { G.debut = m; G.fin = G.m0 + CONFIG.pas; }
        else { G.debut = G.m0; G.fin = G.m0 + CONFIG.pas; }
      }
    } else if (G.mode === 'deplacer') {
      const d = G.t.fin - G.t.debut;
      G.debut = borne(caler(G.t.debut + p.min - G.min0), 0, 1440 - d);
      G.fin = G.debut + d;
      if (p.k !== G.k) { G.k = p.k; p.col.appendChild(G.vue); }       // plusieurs colonnes (semaine couchée) : d'un jour à l'autre
    } else if (G.mode === 'redim') {
      const m = borne(caler(p.min), 0, 1440);
      if (G.bord === 'haut') G.debut = Math.min(m, G.t.fin - CONFIG.pas);
      else G.fin = Math.max(m, G.t.debut + CONFIG.pas);
    }
    majVueG();
    if (!sansBord) defilerBord(e);
  }
  let rafBord = null;
  function defilerBord(e) {
    const d = G.cols.closest('.defile'), r = d.getBoundingClientRect();
    const v = e.clientY < r.top + 40 ? -8 : e.clientY > r.bottom - 40 ? 8 : 0;
    G.dernier = e;
    if (!v) { cancelAnimationFrame(rafBord); rafBord = null; return; }
    if (rafBord) return;
    const pas = () => {
      if (!actifG()) { rafBord = null; return; }
      const r2 = d.getBoundingClientRect();
      const v2 = G.dernier.clientY < r2.top + 40 ? -8 : G.dernier.clientY > r2.bottom - 40 ? 8 : 0;
      if (!v2) { rafBord = null; return; }
      d.scrollTop += v2;
      suivre(G.dernier, true);
      rafBord = requestAnimationFrame(pas);
    };
    rafBord = requestAnimationFrame(pas);
  }
  async function terminerG() {
    const g = G;
    G = null;
    cancelAnimationFrame(rafBord); rafBord = null;
    U.avaler = Date.now();
    if (g.mode === 'creer') {
      g.vue.remove();
      U.brouillon = { k: g.k, debut: g.debut, fin: g.fin };
      U.selection = null;
      ouvrirTache(null, { date: g.k, debut: g.debut, fin: g.fin });
      render();
      return;
    }
    const t = g.t;
    const change = g.debut !== t.debut || g.fin !== t.fin || g.k !== t.k;
    if (t.brouillon) { U.brouillon = { k: g.k, debut: g.debut, fin: g.fin }; render(); return; }
    if (!change) { if (g.tactile) U.selection = t.o.cle; render(); return; }
    if (t.o.el.type === 'tache' && !(await accepterPlafond(g.k, t.o.cle, g.debut, g.fin))) { render(); return; }
    let portee = 'une';
    if (t.o.el.rep) { portee = await demanderPortee('Déplacer'); if (!portee) { render(); return; } }
    const cle = appliquer(t.o, { date: g.k, debut: g.debut, fin: g.fin }, portee);
    sauver();
    U.selection = g.tactile ? cle : null;
    render();
    if (!avertirLibre(cle)) dire(`${t.o.el.titre} : ${g.k !== t.k ? quandJour(g.k) + ', ' : ''}${hhmm(g.debut)} – ${finTexte(g.fin)}`);
  }
  const ECRAN = $('#ecran');
  ECRAN.addEventListener('pointerdown', e => {
    if (G || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest('.rond-coche')) return;
    const tactile = e.pointerType !== 'mouse';
    const cols = e.target.closest('.colonnes');
    if (!cols) {
      // Ailleurs : seul le balayage horizontal compte (grille du mois, vue Jour)
      const zone = e.target.closest('[data-balayage], .cal-jour, .pay');
      if (zone) G = { id: e.pointerId, depart: e, x0: e.clientX, y0: e.clientY, mode: 'attente', libreSeul: true, tactile };
      return;
    }
    const poignee = e.target.closest('[data-bord]'), blocEl = e.target.closest('.bloc');
    G = { id: e.pointerId, cols, depart: e, x0: e.clientX, y0: e.clientY, tactile, blocEl, mode: 'attente' };
    G.direct = !!(blocEl && (blocEl.classList.contains('choisi') || blocEl.dataset.brouillon));
    if (poignee && blocEl && (poignee.classList.contains('poignee') || !tactile)) { G.bord = poignee.dataset.bord; demarrerG('redim'); e.preventDefault(); return; }
    if (tactile && !G.direct) G.minuteur = setTimeout(() => { if (G && G.mode === 'attente') demarrerG(blocEl ? 'deplacer' : 'creer'); }, CONFIG.appuiLong);
  });
  window.addEventListener('pointermove', e => {
    if (!G || e.pointerId !== G.id) return;
    const dist = Math.hypot(e.clientX - G.x0, e.clientY - G.y0);
    if (G.mode === 'attente') {
      if (G.direct && dist > 5) demarrerG('deplacer');
      else if (G.libreSeul || G.tactile) { if (dist > 10) { clearTimeout(G.minuteur); G.mode = 'libre'; } return; }
      else if (dist > 5) demarrerG(G.blocEl ? 'deplacer' : 'creer');
      else return;
    }
    if (actifG()) { e.preventDefault(); suivre(e); }
  });
  window.addEventListener('pointerup', e => {
    if (!G || e.pointerId !== G.id) return;
    clearTimeout(G.minuteur);
    if (actifG()) { terminerG(); return; }
    const dx = e.clientX - G.x0, dy = e.clientY - G.y0, g = G;
    G = null;
    if (g.tactile && g.mode === 'libre' && Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy) && (U.onglet === 'calendrier' || paysage())) { U.avaler = Date.now(); naviguer(dx < 0 ? 1 : -1); }
  });
  window.addEventListener('pointercancel', e => {
    if (!G || e.pointerId !== G.id) return;
    clearTimeout(G.minuteur);
    const etait = actifG();
    if (G.mode === 'creer' && G.vue) G.vue.remove();
    G = null;
    if (etait) render();
  });
  document.addEventListener('pointerdown', () => { U.avaler = 0; }, true);
  document.addEventListener('keydown', () => { U.avaler = 0; }, true);
  document.addEventListener('touchmove', e => { if (actifG()) e.preventDefault(); }, { passive: false });
  ECRAN.addEventListener('contextmenu', e => { if (e.target.closest('.colonnes')) e.preventDefault(); });

  // ---------- Clics ----------
  document.addEventListener('click', e => {
    if (e.target.closest('dialog')) return;
    if (U.avaler && Date.now() - U.avaler < 800) { U.avaler = 0; e.preventDefault(); return; }
    const b = e.target.closest('button, .colonne');
    if (!b) return;
    const d = b.dataset;
    if (d.onglet) return changerOnglet(d.onglet);
    if (d.cocher) return cocher(d.cocher);
    if (d.habitude) { U.garderDefilement = true; return cocherHabitude(d.habitude); }
    if (d.priorite) return cocherPriorite(d.priorite);
    if (d.energie) return noterEnergie(+d.energie);
    if (d.coach) return actionCoach(d.coach);
    if (d.identite) return ouvrirIdentites(d.identite);
    if (d.tenu || d.pasTenu) {
      const o = trouver(d.tenu || d.pasTenu);
      if (!o) return;
      const msg = validerSansEcran(o, !!d.tenu);
      sauver(); render(); dire(msg); feliciter();
      return;
    }
    if (d.ouvrir) { const o = trouver(d.ouvrir); if (!o) return; U.brouillon = null; if (U.selection && U.selection !== o.cle) U.selection = null; return ouvrirTache(o); }
    if (d.ouvrirHab) { const h = S.habitudes.find(x => x.id === d.ouvrirHab); return h && ouvrirHabitude(h); }
    if (d.ouvrirObj) { const ob = S.objectifs.find(x => x.id === d.ouvrirObj); return ob && ouvrirObjectif(ob); }
    if (d.vueCal) { S.vueCal = d.vueCal; U.selection = null; U.brouillon = null; ecrire(); return render('vc-' + d.vueCal); }
    if (d.vueObj) { S.vueObj = d.vueObj; ecrire(); return render(d.vueObj === 'long' ? 'vo-l' : 'vo-h'); }
    if (d.periode) { S.periode = +d.periode; ecrire(); U.garderDefilement = true; return render('per' + d.periode); }
    if (d.nav) return naviguer(+d.nav);
    if (d.saut) { U.date = decaler(U.date, +d.saut); U.selection = null; U.brouillon = null; return render(); }
    if (d.aller) return allerA(d.aller);
    if (d.choisir) { U.date = d.choisir; U.garderDefilement = true; return render(); }
    if (d.ouvrirJour) return allerA(d.ouvrirJour, 'jour');
    if (clicSemaine(d)) return;
    if (d.caser) return ouvrirCaser(d.caser);
    const a = d.action;
    if (a === 'remplir' && U.brouillon) return ouvrirTache(null, { date: U.brouillon.k, debut: U.brouillon.debut, fin: U.brouillon.fin });
    if (a === 'ajouter') {
      const auj = aujourdhui(), k = U.onglet === 'calendrier' ? U.date : auj;
      return ouvrirTache(null, { date: k < auj ? auj : k });
    }
    if (a === 'commencer' || a === 'terminer') {
      const msg = a === 'terminer' ? terminer() : (commencer(d.cle) ? `C'est parti. Touche « Terminé » quand tu as fini.` : null);
      if (!msg) return;
      sauver(); U.garderDefilement = true; render(a === 'terminer' ? null : 'mnt-go');
      dire(msg);
      if (a === 'terminer') feliciter();
      return;
    }
    if (a === 'aujourdhui') { U.recentrer = true; return allerA(aujourdhui()); }
    if (a === 'voir-tout') { U.onglet = 'calendrier'; S.onglet = 'calendrier'; S.vueCal = 'jour'; U.date = aujourdhui(); ecrire(); return render(); }
    if (a === 'profil') return ouvrirProfil();
    if (a === 'chercher') return ouvrirLoupe();
    if (a === 'serie') { U.onglet = 'objectifs'; S.onglet = 'objectifs'; S.vueObj = 'habitudes'; ecrire(); $('#ecran').scrollTop = 0; return render('tab-objectifs'); }
    if (a === 'minuteur') return ouvrirMinuteur();
    if (a === 'bilan') return ouvrirBilan();
    if (a === 'bilan-semaine') return ouvrirBilan(lundiDe(aujourdhui()));
    if (a === 'priorites') return ouvrirPriorites();
    if (a === 'pas-faites') return ouvrirPasFaites();
    if (a === 'identites') return ouvrirIdentites();
    if (a === 'recompenses') return ouvrirRecompenses();
    if (a === 'niveaux') return ouvrirNiveaux();
    if (a === 'difficile') return jourDifficile();
    if (a === 'fin-difficile') { delete S.difficiles[aujourdhui()]; sauver(); U.garderDefilement = true; render('dur'); return dire('Mode jour difficile retiré.'); }
    if (a === 'alleger') return allegerJournee();
    if (a === 'nouvelle-habitude') return ouvrirHabitude(null);
    if (a === 'nouvel-objectif') return ouvrirObjectif(null);
    if (b.classList.contains('colonne')) {
      if (U.selection || U.brouillon) { U.selection = null; U.brouillon = null; return render(); }
      const r = b.getBoundingClientRect();
      const m = borne(Math.floor((e.clientY - r.top) / H * 60 / 30) * 30, 0, 1440 - CONFIG.duree);
      U.brouillon = { k: b.dataset.jour, debut: m, fin: m + CONFIG.duree };
      return render();
    }
  });
  // Clavier : « / » ou Ctrl+K pour chercher ; flèches pour changer de mois ou de jour dans le calendrier
  document.addEventListener('keydown', e => {
    if (document.querySelector('dialog[open]')) return;
    if (e.key === 'Escape' && (U.selection || U.brouillon)) { U.selection = null; U.brouillon = null; render(); return; }
    const t = e.target;
    if (t.closest && t.closest('input, select, textarea')) return;
    if ((e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) || ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'k' || e.key === 'K'))) { e.preventDefault(); ouvrirLoupe(); return; }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && (U.onglet === 'calendrier' || paysage()) && !e.altKey && !e.metaKey && !e.ctrlKey && !(t.closest && t.closest('.segments, .onglets'))) {
      e.preventDefault();
      naviguer(e.key === 'ArrowLeft' ? -1 : 1);
    }
  });

  // ---------- Le temps passe ----------
  function rafraichir() {
    crediter();
    const libre = !G && !document.querySelector('dialog[open]');
    if (libre) { U.garderDefilement = true; render(); accueillir(); }
  }
  setInterval(rafraichir, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (S.coffre.actif) envoyerCoffre(); return; }
    if (S.minuteur) { avancerMinuteur(); ecrire(); }
    rafraichir();
    synchroniser();
    planifierCoffre();
  });

  // ---------- Une app, pas une page ----------
  // Safari : pas de zoom au pincement (le réglage du viewport ne suffit pas toujours sur iPhone)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  // Tourner le téléphone : plein écran calendrier, ou retour à l'onglet
  MQ_PAYSAGE.addEventListener('change', () => {
    U.selection = null; U.brouillon = null;
    delete U.defile.jour;
    render();
  });
  window.addEventListener('resize', () => { if (paysage() && S.vueCal === 'mois' && !G) render(); });

  // ---------- Le clavier de l'iPhone ----------
  // Safari place les éléments fixes sur toute la hauteur de l'écran, même quand le clavier en cache la moitié,
  // et garde parfois un décalage après l'avoir rangé. On suit la partie réellement visible :
  // les feuilles s'y calent (au-dessus du clavier), l'app aussi dès qu'aucun champ n'est en cours de saisie.
  const VV = window.visualViewport;
  const RACINE = document.documentElement;
  const SAISIE = 'input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]):not([type="range"]):not([type="color"]):not([type="file"]), textarea, select, [contenteditable="true"]';
  const enSaisie = () => { const a = document.activeElement; return !!a && a !== document.body && a.matches(SAISIE); };
  function suivreVue() {
    if (!VV || Math.abs(VV.scale - 1) > .01) return;          // zoom d'accessibilité : on ne touche à rien
    const haut = Math.max(0, Math.round(VV.offsetTop));
    const h = Math.round(VV.height);
    const bas = Math.max(0, Math.round(window.innerHeight - haut - h));
    const st = RACINE.style;
    st.setProperty('--vv-haut', haut + 'px');
    st.setProperty('--vv-bas', bas + 'px');
    st.setProperty('--vv-h', h + 'px');
    RACINE.classList.toggle('clavier', bas > 120);
    if (!enSaisie()) { st.setProperty('--app-haut', haut + 'px'); st.setProperty('--app-bas', bas + 'px'); }
  }
  if (VV) {
    VV.addEventListener('scroll', suivreVue);
    VV.addEventListener('resize', () => {
      suivreVue();
      // Le clavier sort : le champ en cours reste en vue dans sa feuille
      const a = document.activeElement;
      if (enSaisie() && a.closest('dialog')) requestAnimationFrame(() => a.scrollIntoView({ block: 'nearest' }));
    });
    suivreVue();
  }
  // Le clavier rangé : l'écran revient à sa place
  document.addEventListener('focusout', () => setTimeout(() => {
    if (enSaisie()) return;
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    if (document.body.scrollTop) document.body.scrollTop = 0;
    suivreVue();
  }, 120));

  // ---------- Démarrage ----------
  // Mises à jour : à chaque retour dans l'app, on regarde s'il existe une nouvelle édition ; quand elle prend la main,
  // l'app se recharge d'elle-même (pendant une saisie, elle attend que la feuille se ferme).
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const avaitMain = !!navigator.serviceWorker.controller;
    let recharge = false;
    const recharger = () => {
      if (recharge) return;
      if (document.querySelector('dialog[open]')) { document.addEventListener('close', recharger, { capture: true, once: true }); return; }
      recharge = true;
      location.reload();
    };
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (avaitMain) recharger(); });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => { /* hors ligne indisponible */ });
  }
  try {
    const vue = +localStorage.getItem('ascend-edition') || 0;
    if (vue && vue < EDITION) setTimeout(() => dire(`ASCEND est à jour (édition ${EDITION}).`), 1900);
    if (vue !== EDITION) localStorage.setItem('ascend-edition', String(EDITION));
  } catch (e) { /* stockage indisponible */ }
  crediter();
  if (S.minuteur) { avancerMinuteur(); demarrerTic(); }
  // Écran de lancement : le A d'ASCEND, le temps d'un souffle
  const L0 = $('#lancement');
  L0.innerHTML = `${sceneLancement()}<div class="marque">${logo()}<b>ASCEND</b><small>Make everyday matter.</small></div>`;
  if (V.conf.actif) verrouiller(true);
  render();
  setTimeout(() => L0.classList.add('parti'), window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 1100);
  setTimeout(() => L0.remove(), 1800);
  setTimeout(accueillir, 1300);
  if (erreurStockage) dire('Attention : le téléphone refuse d\'enregistrer. Libère de la place.');
  synchroniser();
  if (S.coffre.actif) setTimeout(() => envoyerCoffre(), 5000);
  window.ascend = { version: VERSION, edition: EDITION };
})();

</script>
</body>
</html>
