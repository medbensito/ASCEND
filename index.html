      </div>
      ${mois ? vueMois() : vueJour()}`;
  }

  // Mois : la grille de la maquette, avec des points sous les jours, et la liste du jour choisi en dessous
  function vueMois() {
    const k = U.date, d = parse(k), auj = aujourdhui();
    const premier = dk(new Date(d.getFullYear(), d.getMonth(), 1));
    const debut = lundiDe(premier);
    const nom = cap(d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }));
    let cases = '';
    for (let i = 0; i < 42; i++) {
      const j = decaler(debut, i);
      if (i === 35 && j.slice(0, 7) !== k.slice(0, 7)) break;      // pas de 6e ligne vide
      const occs = duJour(j);
      const couleurs = [];
      occs.forEach(o => { const c = look(o.el).couleur; if (!couleurs.includes(c)) couleurs.push(c); });
      const charge = minutesPrevues(j) > S.reglages.plafond;
      const n = occs.length;
      cases += `<button type="button" class="jour-m${j.slice(0, 7) !== k.slice(0, 7) ? ' dehors' : ''}${j === auj ? ' auj' : ''}${charge ? ' charge' : ''}" data-choisir="${j}" aria-pressed="${j === k}" data-focus="m${j}"
        aria-label="${jourLong(j)}${j === auj ? ", aujourd'hui" : ''}${n ? ', ' + pluriel(n, 'élément') : ''}${charge ? ', journée chargée' : ''}">
        <span class="n" aria-hidden="true">${parse(j).getDate()}</span>${couleurs.length ? `<span class="pts-j" aria-hidden="true">${couleurs.slice(0, 3).map(c => `<i style="--c:${c}"></i>`).join('')}</span>` : ''}</button>`;
    }
    const occs = duJour(k), habs = S.habitudes.filter(h => habitudeDue(h, k));
    const m = minutesPrevues(k);
    return `
      <section class="carte" aria-labelledby="mois-nom">
        <div class="cal-tete">
          <button type="button" class="icone-bouton" data-nav="-1" aria-label="Mois précédent" data-focus="nav-1">${ICONE.gauche}</button>
          <h2 id="mois-nom" aria-live="polite">${esc(nom)}</h2>
          <button type="button" class="icone-bouton" data-nav="1" aria-label="Mois suivant" data-focus="nav1">${ICONE.droite}</button>
        </div>
        <div class="mois-grille" data-balayage="mois">
          ${JOURS_COURTS.map((j, i) => `<span class="jsem" aria-hidden="true" title="${JOURS_LONGS[i]}">${j}</span>`).join('')}
          ${cases}
        </div>
      </section>
      <section aria-labelledby="jour-choisi">
        <div class="jour-liste-tete"><h2 id="jour-choisi">${k === auj ? "Aujourd'hui · " : ''}${jourLong(k)}</h2>
          <button type="button" class="lien fort" data-ouvrir-jour="${k}" data-focus="voir-jour">Voir la journée ${ICONE.fleche}</button></div>
        ${m ? `<p class="note" style="margin:-4px 2px 10px">${duree(m)} de tâches prévues${m > S.reglages.plafond ? ` · au-dessus du plafond (${duree(S.reglages.plafond)})` : ''}</p>` : ''}
        <div class="lignes">
          ${occs.map(o => ligneOcc(o, false)).join('')}
          ${habs.map(h => ligneHabitude(h, k, false)).join('')}
          ${!occs.length && !habs.length ? `<p class="carte vide">Rien de prévu ${quandJour(k)}.</p>` : ''}
        </div>
      </section>
      <button type="button" class="bouton" data-action="ajouter" data-focus="ajouter">${ICONE.plus} Ajouter une tâche</button>`;
  }

  // Jour : la grille horaire, avec les gestes (toucher un vide, appui long, glisser, poignées)
  function disposer(liste) {
    const items = liste.map(o => ({ o, d: o.el.debut, f: Math.max(o.el.fin, o.el.debut + 20) })).sort((a, b) => a.d - b.d || b.f - a.f);
    const res = [];
    let groupe = [], finGroupe = -1;
    const fermer = () => { const n = Math.max(...groupe.map(g => g.col)) + 1; groupe.forEach(g => { g.n = n; res.push(g); }); groupe = []; };
    items.forEach(it => {
      if (groupe.length && it.d >= finGroupe) fermer();
      const fins = [];
      groupe.forEach(g => { fins[g.col] = Math.max(fins[g.col] || 0, g.f); });
      let c = 0;
      while (fins[c] != null && fins[c] > it.d) c++;
      it.col = c;
      groupe.push(it);
      finGroupe = Math.max(finGroupe, it.f);
    });
    if (groupe.length) fermer();
    return res;
  }
  function bloc(g) {
    const o = g.o, el = o.el, l = look(el);
    const haut = el.debut / 60 * H, hauteur = Math.max((el.fin - el.debut) / 60 * H, 22);
    const court = hauteur < 42;
    const choisi = U.selection === o.cle;
    const etat = el.type === 'libre' ? etatLibre(o) : el.type === 'sansecran' ? etatSansEcran(o) : null;
    const p = S.payes[o.cle];
    return `<div class="bloc ${el.type}${etat === 'grignote' ? ' grignote' : ''}${o.fait ? ' fait' : ''}${court ? ' court' : ''}${choisi ? ' choisi' : ''}${U.repere === o.cle ? ' repere' : ''}" data-cle="${o.cle}"
        style="top:${haut}px;height:${hauteur}px;left:calc(${g.col / g.n * 100}% + 2px);width:calc(${100 / g.n}% - 4px);--c:${l.couleur}">
      <button type="button" class="b-ouvrir" data-ouvrir="${o.cle}" aria-label="${esc(description(o))}" data-focus="o${o.cle}"></button>
      ${el.type === 'tache' ? rondCoche(o.cle, o.fait, `${el.titre} : ${o.fait ? 'faite' : 'à faire'}`, 'data-cocher') : ''}
      <span class="b-texte" aria-hidden="true"><b>${l.icone} ${esc(el.titre)}</b><small>${hhmm(el.debut)}${court ? '' : ' – ' + finTexte(el.fin)}${etat ? ' · ' + (el.type === 'libre' ? ETAT_LIBRE[etat] : ETAT_ECRAN[etat]) : ''}</small></span>
      ${p && p.pts ? `<span class="gain" aria-hidden="true">+${p.pts}</span>` : ''}
      <span class="bord" data-bord="bas" aria-hidden="true"></span>
      ${choisi ? '<span class="poignee haut" data-bord="haut" aria-hidden="true"></span><span class="poignee bas" data-bord="bas" aria-hidden="true"></span>' : ''}
    </div>`;
  }
  function blocBrouillon(b) {
    const hauteur = Math.max((b.fin - b.debut) / 60 * H, 22);
    return `<div class="bloc brouillon${hauteur < 42 ? ' court' : ''}" data-brouillon="1" style="top:${b.debut / 60 * H}px;height:${hauteur}px;left:2px;width:calc(100% - 4px)">
      <button type="button" class="b-ouvrir" data-action="remplir" aria-label="Nouvelle plage de ${hhmm(b.debut)} à ${finTexte(b.fin)} : toucher pour la remplir" data-focus="brouillon"></button>
      <span class="b-texte" aria-hidden="true"><b>Nouvelle</b><small>${hhmm(b.debut)} – ${finTexte(b.fin)}</small></span>
      <span class="poignee haut" data-bord="haut" aria-hidden="true"></span><span class="poignee bas" data-bord="bas" aria-hidden="true"></span>
    </div>`;
  }
  function grille(jours) {
    const auj = aujourdhui(), mn = jours.includes(auj) ? minNow() : -99;
    let h = '';
    for (let i = 1; i < 24; i++) h += `${Math.abs(i * 60 - mn) < 14 ? '' : `<div class="heure" style="top:${i * H}px">${hhmm(i * 60)}</div>`}<div class="trait-h" style="top:${i * H}px"></div>`;
    const cols = jours.map(k => {
      const blocs = disposer(duJour(k)).map(bloc).join('');
      const br = U.brouillon && U.brouillon.k === k ? blocBrouillon(U.brouillon) : '';
      return `<div class="colonne${k === auj ? ' auj' : ''}" data-jour="${k}">${blocs}${br}</div>`;
    }).join('');
    const ligne = mn < 0 ? '' : `<div class="maintenant" style="top:${mn / 60 * H}px"><span>${hhmm(mn)}</span></div>`;
    return `<div class="grille">${h}<div class="colonnes" style="--n:${jours.length}" role="group" aria-label="Grille horaire : toucher un créneau vide pour y poser une plage">${cols}</div>${ligne}</div><div class="bas-espace"></div>`;
  }
  function bandeSemaine(k) {
    const l = lundiDe(k), auj = aujourdhui();
    return Array.from({ length: 7 }, (_, i) => {
      const d = decaler(l, i), n = duJour(d).length;
      return `<button type="button" class="jour-b${d === auj ? ' auj' : ''}" data-aller="${d}" aria-pressed="${d === k}" data-focus="j${d}"
        aria-label="${jourLong(d)}${d === auj ? ", aujourd'hui" : ''}${n ? ', ' + pluriel(n, 'élément') : ''}">
        <span aria-hidden="true">${JOURS_COURTS[i]}</span><b aria-hidden="true">${parse(d).getDate()}</b><i class="${n ? 'plein' : ''}" aria-hidden="true"></i></button>`;
    }).join('');
  }
  function vueJour() {
    const k = U.date, m = minutesPrevues(k), pl = S.reglages.plafond;
    return `<div class="cal-jour">
      <div class="bande">
        <button type="button" class="fleche" data-saut="-7" aria-label="Semaine précédente" data-focus="s-7">${ICONE.gauche}</button>
        ${bandeSemaine(k)}
        <button type="button" class="fleche" data-saut="7" aria-label="Semaine suivante" data-focus="s7">${ICONE.droite}</button>
      </div>
      <div class="jour-entete">
        <h2 aria-live="polite">${k === aujourdhui() ? "Aujourd'hui" : jourLong(k)}</h2>
        <div class="jauge${m > pl ? ' depasse' : ''}" role="img" aria-label="${duree(m)} de tâches prévues sur un plafond de ${duree(pl)}${m > pl ? ' : journée chargée' : ''}">
          <small aria-hidden="true"><b>${duree(m)}</b> / ${duree(pl)}</small><span class="barre" aria-hidden="true"><i style="width:${Math.min(100, m / pl * 100)}%"></i></span></div>
      </div>
      <div class="defile" data-defile="jour">${grille([k])}</div>
      <button type="button" class="fab" data-action="ajouter" aria-label="Ajouter une tâche" data-focus="fab">${ICONE.plus}</button>
    </div>`;
  }

  // ---------- Paysage : le calendrier seul, en plein écran (la vue en cours, en grand) ----------
  const MQ_PAYSAGE = window.matchMedia('(orientation: landscape) and (max-height: 520px)');
  const paysage = () => MQ_PAYSAGE.matches;
  function moisPaysage() {
    const k = U.date, d = parse(k), auj = aujourdhui();
    const debut = lundiDe(dk(new Date(d.getFullYear(), d.getMonth(), 1)));
    const jours = [];
    for (let i = 0; i < 42; i++) { const j = decaler(debut, i); if (i === 35 && j.slice(0, 7) !== k.slice(0, 7)) break; jours.push(j); }
    const rangs = jours.length / 7;
    // Combien de tâches tiennent dans une case : le numéro du jour (et « +N » à côté), puis une ligne par tâche
    const hApp = ($('.app') || {}).clientHeight || window.innerHeight;
    const place = Math.max(1, Math.floor(((hApp - 78) / rangs - 4 - 8 - 18) / 17));
    const cases = jours.map(j => {
      const occs = duJour(j), charge = minutesPrevues(j) > S.reglages.plafond;
      const montrees = occs.slice(0, place);
      const reste = occs.length - montrees.length;
      return `<button type="button" class="case-m${j.slice(0, 7) !== k.slice(0, 7) ? ' dehors' : ''}${j === auj ? ' auj' : ''}"${j === k ? ' aria-current="date"' : ''} data-ouvrir-jour="${j}" data-focus="pm${j}"
          aria-label="${jourLong(j)}${j === auj ? ", aujourd'hui" : ''}${occs.length ? ' : ' + occs.map(o => `${o.el.titre} à ${hhmm(o.el.debut)}${o.fait ? ', faite' : ''}`).join(' ; ') : ', rien de prévu'}${charge ? ', journée chargée' : ''}. Voir la journée">
        <span class="n" aria-hidden="true"><span>${parse(j).getDate()}</span>${reste ? `<em class="encore">+${reste}</em>` : ''}${charge ? '<i>⚠︎</i>' : ''}</span>
        ${montrees.map(o => `<span class="chip${o.fait ? ' fait' : ''}" style="--c:${look(o.el).couleur}" aria-hidden="true">${o.el.type === 'tache' ? '' : look(o.el).icone + ' '}${esc(o.el.titre)}</span>`).join('')}</button>`;
    }).join('');
    return `<div class="pay-mois" style="--rangs:${rangs}" data-balayage="mois">${JOURS_LONGS.map(n => `<span class="jsem" aria-hidden="true">${n.slice(0, 3)}</span>`).join('')}${cases}</div>`;
  }
  function vuePaysage() {
    const jour = S.vueCal === 'jour', k = U.date, auj = aujourdhui();
    const titre = jour ? (k === auj ? "Aujourd'hui · " : '') + jourLong(k) : cap(parse(k).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }));
    const m = minutesPrevues(k), pl = S.reglages.plafond;
    return `<h1 class="masque">Calendrier</h1>
      <div class="pay"${jour ? ' data-balayage="jour"' : ''}>
        <div class="pay-barre">
          <button type="button" class="icone-bouton" data-nav="-1" aria-label="${jour ? 'Jour précédent' : 'Mois précédent'}" data-focus="nav-1">${ICONE.gauche}</button>
          <h2 aria-live="polite">${esc(titre)}</h2>
          <button type="button" class="icone-bouton" data-nav="1" aria-label="${jour ? 'Jour suivant' : 'Mois suivant'}" data-focus="nav1">${ICONE.droite}</button>
          ${jour ? `<div class="jauge${m > pl ? ' depasse' : ''}" role="img" aria-label="${duree(m)} de tâches prévues sur un plafond de ${duree(pl)}${m > pl ? ' : journée chargée' : ''}"><small aria-hidden="true"><b>${duree(m)}</b> / ${duree(pl)}</small><span class="barre" aria-hidden="true"><i style="width:${Math.min(100, m / pl * 100)}%"></i></span></div>` : ''}
          <div class="segments" role="group" aria-label="Affichage">
            <button type="button" aria-pressed="${!jour}" data-vue-cal="mois" data-focus="vc-mois">Mois</button>
            <button type="button" aria-pressed="${jour}" data-vue-cal="jour" data-focus="vc-jour">Jour</button>
          </div>
          <button type="button" class="icone-bouton" data-action="aujourdhui" aria-label="Aujourd'hui" data-focus="auj">${ICONE.calendrier}</button>
          <button type="button" class="icone-bouton" data-action="chercher" aria-label="Chercher" data-focus="chercher">${ICONE.loupe}</button>
        </div>
        ${jour ? `<div class="defile" data-defile="jour">${grille([k])}</div>
          <button type="button" class="fab" data-action="ajouter" aria-label="Ajouter une tâche" data-focus="fab">${ICONE.plus}</button>` : moisPaysage()}
      </div>`;
  }
  // ---------- Objectifs : habitudes et long terme ----------
  function joursTexte(h) {
    const j = h.jours.slice().sort();
    if (j.length === 7) return 'Tous les jours';
    if (j.join() === '0,1,2,3,4') return 'En semaine';
    if (j.join() === '5,6') return 'Le week-end';
    return j.map(i => cap(JOURS_LONGS[i].slice(0, 3))).join(' · ');
  }
  // Les 7 derniers jours d'une habitude : fait, pas fait, pas prévu
  function histo(h) {
    const auj = aujourdhui();
    return `<span class="histo" aria-hidden="true">${Array.from({ length: 7 }, (_, i) => {
      const k = decaler(auj, i - 6);
      return `<i class="${!habitudeDue(h, k) ? 'non' : h.faits[k] ? 'ok' : ''}" style="--c:${cat(h.cat).couleur}"></i>`;
    }).join('')}</span>`;
  }
  function ligneHabitudeGestion(h) {
    const auj = aujourdhui(), c = cat(h.cat), due = habitudeDue(h, auj), fait = !!h.faits[auj], s = serieHabitude(h);
    const sept = Array.from({ length: 7 }, (_, i) => decaler(auj, i - 6)).filter(k => habitudeDue(h, k));
    const faits7 = sept.filter(k => h.faits[k]).length;
    return `<div class="carte ligne${fait ? ' faite' : ''}" style="--c:${c.couleur}">
      <button type="button" class="ouvrir" data-ouvrir-hab="${h.id}" data-focus="oh${h.id}"
        aria-label="${esc(h.titre)}, ${esc(c.nom)}, ${joursTexte(h).toLowerCase()}, série de ${pluriel(s, 'jour')}, ${faits7} sur ${sept.length} ces 7 derniers jours : ouvrir">
        <span class="tuile" style="--c:${c.couleur}" aria-hidden="true">${c.icone}</span>
        <span class="quoi" aria-hidden="true"><b>${esc(h.titre)}</b><small>${joursTexte(h)}${s ? ` · 🔥 ${s} j` : ''}</small>${histo(h)}</span></button>
      ${due ? rondCoche(h.id + '|' + auj, fait, `${h.titre}, aujourd'hui : ${fait ? 'faite' : 'à faire'}`, 'data-habitude') : '<span class="pts nul">repos</span>'}
    </div>`;
  }
  function carteObjectif(ob) {
    const a = avancement(ob), c = cat(ob.cat), atteint = !!ob.atteintLe;
    const ech = ob.echeance ? (ob.echeance < aujourdhui() ? `échéance passée (${fmt(ob.echeance, { day: 'numeric', month: 'short' })})` : ob.echeance === aujourdhui() ? "échéance aujourd'hui" : `dans ${pluriel(ecart(aujourdhui(), ob.echeance), 'jour')}`) : 'sans échéance';
    const nE = ob.etapes.length, fE = ob.etapes.filter(e => e.faitLe).length, nT = a.taches.length, fT = a.taches.filter(o => o.fait).length;
    const detail = [nE ? `${fE}/${nE} étapes` : '', nT ? `${fT}/${nT} tâches` : ''].filter(Boolean).join(' · ') || 'Ajoute des étapes';
    return `<button type="button" class="carte obj-carte${atteint ? ' atteint' : ''}" data-ouvrir-obj="${ob.id}" data-focus="ob${ob.id}"
        aria-label="${esc(ob.titre)}, ${esc(c.nom)}, ${a.pc} %${atteint ? ', atteint' : ''}, ${detail}, ${ech} : ouvrir">
      <span class="haut" aria-hidden="true"><span class="tuile" style="--c:${c.couleur}">${c.icone}</span>
        <span style="flex:1;min-width:0;display:grid;gap:2px"><b>${esc(ob.titre)}</b><small>${atteint ? '✓ Atteint · ' : ''}${detail} · ${ech}</small></span>
        <span class="pc">${a.pc} %</span></span>
      <span class="barre-obj" aria-hidden="true"><i style="width:${a.pc}%"></i></span>
    </button>`;
  }
  function vueObjectifs() {
    const hab = S.vueObj !== 'long';
    const s = serie(), best = Math.max(S.meilleureSerie, s), auj = aujourdhui();
    const habs = habitudesActives();
    const dues = habs.filter(h => habitudeDue(h, auj)), faites = dues.filter(h => h.faits[auj]).length;
    return `
      <header class="tete"><div><h1>Objectifs</h1><p>Construis tes habitudes, vise loin.</p></div></header>
      <div class="segments" role="group" aria-label="Affichage">
        <button type="button" aria-pressed="${hab}" data-vue-obj="habitudes" data-focus="vo-h">Habitudes</button>
        <button type="button" aria-pressed="${!hab}" data-vue-obj="long" data-focus="vo-l">Long terme</button>
      </div>
      ${hab ? `
        <div class="carte serie-carte"><span class="flamme" aria-hidden="true">🔥</span>
          <div><b>${pluriel(s, 'jour')}</b><small>Série actuelle : toutes tes habitudes faites, jour après jour. Meilleure : ${pluriel(best, 'jour')}.</small>
          ${dues.length ? `<small style="margin-top:4px">Aujourd'hui : ${faites} / ${dues.length}${faites === dues.length ? ' · journée gagnée ✓' : ''}</small>` : ''}</div></div>
        <div class="lignes">${habs.length ? habs.map(ligneHabitudeGestion).join('') : '<p class="carte vide">Pas encore d\'habitude. Méditer, lire 10 pages, marcher… Commence petit, tiens longtemps.</p>'}</div>
        <button type="button" class="bouton" data-action="nouvelle-habitude" data-focus="nh">${ICONE.plus} Nouvelle habitude</button>`
      : `
        <div class="lignes">${S.objectifs.length ? S.objectifs.slice().sort((a, b) => (!!a.atteintLe - !!b.atteintLe) || (a.echeance || '9999').localeCompare(b.echeance || '9999')).map(carteObjectif).join('')
          : '<p class="carte vide">Pas encore d\'objectif. Un semi-marathon, 12 livres dans l\'année, un projet à finir… Découpe-le en étapes et rattache-y des tâches.</p>'}</div>

      <circle cx="80" cy="80" r="${r}" fill="none" stroke="rgba(129,140,255,.16)" stroke-width="13"/>
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="url(#ga${taille || ''})" stroke-width="13" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" style="filter:drop-shadow(0 0 6px rgba(110,100,255,.7))"/></svg>`;
  }
  // Points gagnés jour par jour (ou semaine par semaine sur 90 jours) : barres, valeur la plus haute écrite
  function graphePoints(jours) {
    const auj = aujourdhui(), parSemaine = jours > 30;
    const groupes = [];
    if (parSemaine) {
      for (let i = Math.ceil(jours / 7) - 1; i >= 0; i--) {
        const fin = decaler(auj, -i * 7), de = decaler(fin, -6);
        groupes.push({ de, fin, v: gainsEntre(de, fin).total, nom: `semaine du ${fmt(de, { day: 'numeric', month: 'short' })}` });
      }
    } else for (let i = jours - 1; i >= 0; i--) { const k = decaler(auj, -i); groupes.push({ de: k, fin: k, v: gainDuJour(k), nom: jourLong(k) }); }
    const max = Math.max(1, ...groupes.map(g => g.v)), n = groupes.length, l = 300 / n;
    const iMax = groupes.findIndex(g => g.v === max);
    const barres = groupes.map((g, i) => {
      const h = Math.max(g.v > 0 ? 3 : 0, g.v / max * 92);
      return `<rect x="${(i * l + l * .18).toFixed(1)}" y="${(104 - h).toFixed(1)}" width="${(l * .64).toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4, l * .3).toFixed(1)}" fill="url(#gb)"/>`;
    }).join('');
    const etiquette = max > 1 && iMax >= 0 ? `<text x="${Math.min(280, Math.max(20, iMax * l + l / 2)).toFixed(1)}" y="${(104 - groupes[iMax].v / max * 92 - 5).toFixed(1)}" text-anchor="middle" fill="#a3a8d4" font-size="11" font-weight="600">${nombre(max)}</text>` : '';
    return `<svg class="courbe-pts" viewBox="0 0 300 108" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6bff"/><stop offset="1" stop-color="#4f6bff"/></linearGradient></defs>
        <line x1="0" y1="104.5" x2="300" y2="104.5" stroke="rgba(129,140,255,.25)"/>${barres}${etiquette}</svg>
      <div class="legende-courbe" aria-hidden="true"><span>${fmt(groupes[0].de, { day: 'numeric', month: 'short' })}</span><span>${parSemaine ? 'par semaine' : 'par jour'}</span><span>aujourd'hui</span></div>
      <table class="masque"><caption>Points gagnés ${parSemaine ? 'par semaine' : 'par jour'}</caption><tbody>${groupes.map(g => `<tr><th scope="row">${esc(g.nom)}</th><td>${g.v} points</td></tr>`).join('')}</tbody></table>`;
  }

  // Minutes de tâches d'un jour si on y ajoute (ou déplace) une plage
  function minutesAvec(k, sans, d, f) {
    const iv = duJour(k).filter(o => o.el.type === 'tache' && o.cle !== sans).map(o => [o.el.debut, o.el.fin]).concat([[d, f]]).sort((a, b) => a[0] - b[0]);
    let total = 0, a = -1, b = -1;
    iv.forEach(([x, y]) => { if (x > b) { total += Math.max(0, b - a); a = x; b = y; } else b = Math.max(b, y); });

  }

    if (e.key === 'Escape' && (U.selection || U.brouillon)) { U.selection = null; U.brouillon = null; render(); return; }
    const t = e.target;
    if (t.closest && t.closest('input, select, textarea')) return;
    if ((e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) || ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'k' || e.key === 'K'))) { e.preventDefault(); ouvrirLoupe(); return; }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && (U.onglet === 'calendrier' || paysage()) && !e.altKey && !e.metaKey && !e.ctrlKey && !(t.closest && t.closest('.segments, .onglets'))) {
      e.preventDefault();
      naviguer(e.key === 'ArrowLeft' ? -1 : 1);
    }
  });

  // ---------- Le temps passe ----------
  function rafraichir() {
    crediter();
    const libre = !G && !document.querySelector('dialog[open]');
    if (libre) { U.garderDefilement = true; render(); }
  }
  setInterval(rafraichir, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (S.coffre.actif) envoyerCoffre(); return; }
    if (S.minuteur) { avancerMinuteur(); ecrire(); }
    rafraichir();
    synchroniser();
    planifierCoffre();
  });

  // ---------- Une app, pas une page ----------
  // Safari : pas de zoom au pincement (le réglage du viewport ne suffit pas toujours sur iPhone)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  // Tourner le téléphone : plein écran calendrier, ou retour à l'onglet
  MQ_PAYSAGE.addEventListener('change', () => {
    U.selection = null; U.brouillon = null;
    delete U.defile.jour;
    render();
  });
  window.addEventListener('resize', () => { if (paysage() && S.vueCal !== 'jour' && !G) render(); });

  // ---------- Le clavier de l'iPhone ----------
  // Safari place les éléments fixes sur toute la hauteur de l'écran, même quand le clavier en cache la moitié,
  // et garde parfois un décalage après l'avoir rangé. On suit la partie réellement visible :
  // les feuilles s'y calent (au-dessus du clavier), l'app aussi dès qu'aucun champ n'est en cours de saisie.
  const VV = window.visualViewport;
  const RACINE = document.documentElement;
  const SAISIE = 'input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]):not([type="range"]):not([type="color"]):not([type="file"]), textarea, select, [contenteditable="true"]';
  const enSaisie = () => { const a = document.activeElement; return !!a && a !== document.body && a.matches(SAISIE); };
  function suivreVue() {
    if (!VV || Math.abs(VV.scale - 1) > .01) return;          // zoom d'accessibilité : on ne touche à rien
    const haut = Math.max(0, Math.round(VV.offsetTop));
    const h = Math.round(VV.height);
    const bas = Math.max(0, Math.round(window.innerHeight - haut - h));
    const st = RACINE.style;
    st.setProperty('--vv-haut', haut + 'px');
    st.setProperty('--vv-bas', bas + 'px');
    st.setProperty('--vv-h', h + 'px');
    RACINE.classList.toggle('clavier', bas > 120);
    if (!enSaisie()) { st.setProperty('--app-haut', haut + 'px'); st.setProperty('--app-bas', bas + 'px'); }
  }
  if (VV) {
    VV.addEventListener('scroll', suivreVue);
    VV.addEventListener('resize', () => {
      suivreVue();
      // Le clavier sort : le champ en cours reste en vue dans sa feuille
      const a = document.activeElement;
      if (enSaisie() && a.closest('dialog')) requestAnimationFrame(() => a.scrollIntoView({ block: 'nearest' }));
    });
    suivreVue();
  }
  // Le clavier rangé : l'écran revient à sa place
  document.addEventListener('focusout', () => setTimeout(() => {
    if (enSaisie()) return;
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    if (document.body.scrollTop) document.body.scrollTop = 0;
    suivreVue();
  }, 120));

  // ---------- Démarrage ----------
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne indisponible */ });
  }
  crediter();
  if (S.minuteur) { avancerMinuteur(); demarrerTic(); }
  // Écran de lancement : le A d'ASCEND, le temps d'un souffle
  const L0 = $('#lancement');
  L0.innerHTML = `<div class="marque">${logo()}<b>ASCEND</b><small>Make everyday matter.</small></div>`;
  if (V.conf.actif) verrouiller(true);
  render();
  setTimeout(() => L0.classList.add('parti'), window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 1100);
  setTimeout(() => L0.remove(), 1800);
  if (erreurStockage) dire('Attention : le téléphone refuse d\'enregistrer. Libère de la place.');
  synchroniser();
  if (S.coffre.actif) setTimeout(() => envoyerCoffre(), 5000);
  window.ascend = { version: VERSION };
})();

</script>
</body>
</html>
